 *
 * A projeção da disputa: mediana e intervalo de 80% por candidato, sempre;
 * probabilidade só com o gate homologado (§4.7). Lê a última registrada
 * pelo coletor (a mesma do telão), sem calcular de novo. */
async function viewProjecao() {
  const cargo = cargoAtual();
  if (cargo.abr === 'uf' && !st.uf) {
    return el('div', {cls: 'estado'},
      `Escolha uma UF acima: a projeção de ${cargo.nome.toLowerCase()} é `
      + 'feita estado a estado.');
  }
  const qs = `cargo=${cargo.cd}` + (cargo.abr === 'uf' ? `&uf=${st.uf}` : '');
  const d = await get(`/projection?${qs}&registrar=false`);
  rodape(d);
  if (!d.dados) {
    return el('div', {cls: 'estado'}, d.status_motivo || 'sem projeção ainda');
  }
  const pub = !!d.publicavel;
  const f = v => v == null ? '—' : v.toFixed(1).replace('.', ',') + '%';
  const idade = d.idade_s != null
    ? `registrada há ${Math.round(d.idade_s)} s` : 'calculada agora';
  return el('div', {},
    el('div', {cls: 'resumo'},
      el('div', {cls: 'kpi', style: pub ? 'border-color:var(--ok)'
                                        : 'border-color:var(--alerta)'},
        el('div', {cls: 'k'}, 'Estado'),
        el('div', {cls: 'v', style: 'font-size:16px'},
           pub ? 'projeção publicada' : 'cenário exploratório'),
        el('div', {cls: 'n'}, pub ? 'gate estatístico homologado'
                                  : 'sem probabilidade de vitória')),
      el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, 'Apurado'),
        el('div', {cls: 'v'}, f(d.cobertura_pct)),
        el('div', {cls: 'n'}, 'do eleitorado')),
      el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, 'Modelo'),
        el('div', {cls: 'v', style: 'font-size:16px'},
           String(d.modelo || '').toUpperCase()),
        el('div', {cls: 'n'}, `${fmt(d.n_sims)} simulações · ${idade}`))),
    !pub ? el('div', {cls: 'nota aten'}, el('b', {}, 'Cenário, não previsão. '),
      d.status_motivo) : null,
    // Vencedor projetado: probabilidade, com régua dura (engine/chamada.py).
    // Quando ainda não dá, a tela diz o que falta — é o que evita a
    // pergunta "e por que não?" no meio da apuração.
    (() => {
      const ch = d.chamada;
      if (!ch || !pub) return null;
      // Hierarquia: conta vence probabilidade. Com a disputa definida
      // matematicamente, é isso que a tela diz — "vencedor projetado" seria
      // dizer menos do que se sabe.
      const dfn = d.definicao || {};
      if (dfn.disputa_definida || dfn.segundo_turno_definido) {
        const quem = d.dados.filter(c =>
          c.estado_matematico === 'matematicamente_eleito'
          || c.estado_matematico === 'matematicamente_no_segundo_turno');
        // Com sub judice capaz de mudar o resultado, a conta vale no
        // cenário de validação: a tela diz em qual cenário está falando.
        const dois = dfn.cenarios_divergem;
        return el('div', {cls: dois ? 'nota aten' : 'nota ok'},
          el('b', {}, dfn.disputa_definida ? 'Matematicamente eleito: '
                                           : 'Garantidos entre os dois '
                                             + 'primeiros: '),
          quem.map(c => c.nome).join(', '),
          dois
            ? ' — com os votos sub judice validados. Se forem cassados, '
              + 'muda quem se define; por isso os dois cenários seguem '
              + 'na tela até a decisão judicial.'
            : ' — conta, não probabilidade: o que falta apurar não alcança.');
      }
      if (ch.apta && ch.tipo === 'segundo_turno') {
        return el('div', {cls: 'nota ok'}, el('b', {}, '2º turno projetado: '),
          ch.candidatos.map(c => c.nome).join(' × '),
          ` — chance de ${Math.floor(100 * ch.probabilidade_minima)}% ou mais`
          + ' de ninguém ter maioria absoluta, estável em '
          + `${ch.registros_estaveis} registros. É probabilidade, não `
          + 'conta: o que falta apurar, em tese, ainda muda.');
      }
      // Servidor anterior a 04/10/2026 não envia o tipo e apontava quem
      // lidera, não quem vence: com uma vaga, não se afirma vencedor.
      if (ch.apta && !ch.tipo && cargoAtual().vagas === 1) {
        return el('div', {cls: 'nota'}, el('b', {}, 'Sem vencedor projetado. '),
          'Liderança projetada de ',
          ch.candidatos.map(c => c.nome).join(', '),
          ' — liderar no 1º turno não é vencer.');
      }
      if (ch.apta) {
        return el('div', {cls: 'nota ok'}, el('b', {}, 'Vencedor projetado: '),
          ch.candidatos.map(c => c.nome).join(', '),
          ` — chance de ${Math.floor(100 * ch.probabilidade_minima)}% ou mais,`
          + ` estável em ${ch.registros_estaveis} registros. `, ch.nota,
          ' Ainda não é definição matemática: o que falta apurar, em tese, '
          + 'alcança.');
      }
      return el('div', {cls: 'nota'}, el('b', {}, 'Sem vencedor projetado. '),
        ch.motivo + `. Régua: ${Math.round(100 * ch.regra.p_min)}% de chance,`
        + ` ${ch.regra.registros} registros seguidos e `
        + `${ch.regra.apurado_min_pct}% apurado.`);
    })(),
    el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Candidato'),
      el('th', {cls: 'num'}, 'Apurado (votos)'),
      el('th', {cls: 'num'}, 'Projeção'),
      el('th', {cls: 'num'}, (() => {
        // O nível da faixa sobe com o apurado (engine/nivel.py): a tela
        // sempre diz qual está valendo — faixa sem nível não significa nada.
        const fx = d.dados[0] && d.dados[0].projecao.faixa;
        return fx ? `Intervalo ${fx.nivel}%` : 'Intervalo 80%';
      })()),
      pub ? el('th', {cls: 'num'}, cargo.vagas > 1 ? 'Chance de vaga'
                                                   : 'Chance de liderar')
          : null,
      pub && cargo.cd !== '5' ? el('th', {cls: 'num hide-sm'},
                                   'Maioria absoluta') : null)),
      el('tbody', {}, ...d.dados.map(c => el('tr', {},
        el('td', {}, c.nome),
        el('td', {cls: 'num'}, fmt(c.votos_observados)),
        el('td', {cls: 'num', style: 'color:var(--proj);font-weight:600'},
           f(c.projecao.pct_mediana)),
        el('td', {cls: 'num', style: 'color:var(--muted)'},
           c.projecao.faixa
             ? `${f(c.projecao.faixa.pct_min)} – ${f(c.projecao.faixa.pct_max)}`
             : `${f(c.projecao.pct_q100)} – ${f(c.projecao.pct_q900)}`),
        pub ? el('td', {cls: 'num'}, c.probabilidades
          ? Math.round(100 * (cargo.vagas > 1
              ? c.probabilidades.dentro_das_vagas
              : c.probabilidades.lideranca)) + '%' : '—') : null,
        pub && cargo.cd !== '5' ? el('td', {cls: 'num hide-sm'},
          c.probabilidades && c.probabilidades.maioria_absoluta != null
            ? Math.round(100 * c.probabilidades.maioria_absoluta) + '%'
            : '—') : null)))),
    el('div', {cls: 'nota'}, el('b', {}, 'Como ler. '),
      'Percentual sobre votos a concorrentes, a base da maioria absoluta. '
      + 'O intervalo é preditivo — contém o resultado final na proporção '
      + 'que o nível declara —, não margem de erro de pesquisa. O nível '
      + 'sobe com a apuração: 80% até 15% apurado e 90% daí em diante — '
      + 'no ensaio de 2018 a faixa de 95% entregou 92%, e prometer 95% '
      + 'seria prometer o que o modelo não cumpre. '
      + 'Subir o nível não torna a projeção mais precisa; alarga a faixa, '
      + 'e com mais votos contados essa garantia maior cabe na tela.'));
}

/* --------------------------------------------------------- convergência */

/* Gráfico de convergência. SVG inline, sem biblioteca: um gráfico de linha
 * com faixa é pouca geometria, e uma dependência externa numa tela que vai
 * ao ar na noite da apuração é risco sem retorno.
 *
 * Leitura: apurado em linha cheia, projetado em tracejado com faixa de 80%.
 * O par cheio/tracejado importa — a leitura não pode depender só de cor. */
function grafConvergencia(cand) {
  const W = 680, H = 210, ml = 48, mr = 12, mt = 10, mb = 26;
  const pts = cand.pontos.filter(p => p.pct_projetado != null);
  if (pts.length < 2) {
    return el('div', {cls: 'nota'},
      'série curta demais para um gráfico: ' + pts.length + ' ponto(s).');
  }

  const ys = [];
  for (const p of pts) {
    ys.push(p.pct_q100, p.pct_q900, p.pct_projetado);
    if (p.pct_apurado != null) ys.push(p.pct_apurado);
  }
  if (cand.pct_final != null) ys.push(cand.pct_final);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const folga = Math.max(0.4, (y1 - y0) * 0.14);
  y0 -= folga; y1 += folga;

  const X = c => ml + (Math.max(0, Math.min(100, c)) / 100) * (W - ml - mr);
  const Y = v => mt + (1 - (v - y0) / (y1 - y0 || 1)) * (H - mt - mb);
  const S = (t, a = {}) => {
    const n = document.createElementNS('http://www.w3.org/2000/svg', t);
    for (const [k, v] of Object.entries(a)) if (v != null) n.setAttribute(k, v);
    return n;
  };

  const svg = S('svg', {viewBox: '0 0 ' + W + ' ' + H, width: '100%',
    role: 'img', style: 'max-width:100%;height:auto;display:block',
    'aria-label': 'Convergência de ' + cand.nome});

  for (const v of [y0, (y0 + y1) / 2, y1]) {
    svg.append(S('line', {x1: ml, x2: W - mr, y1: Y(v), y2: Y(v),
      stroke: 'var(--line)', 'stroke-width': 1}));
    const t = S('text', {x: ml - 6, y: Y(v) + 3, 'text-anchor': 'end',
      'font-size': 10, fill: 'var(--muted)'});
    t.textContent = v.toFixed(1).replace('.', ',') + '%';
    svg.append(t);
  }
  for (const c of [0, 25, 50, 75, 100]) {
    const t = S('text', {x: X(c), y: H - 8, 'text-anchor': 'middle',
      'font-size': 10, fill: 'var(--muted)'});
    t.textContent = c + '%';
    svg.append(t);
  }
  const rot = S('text', {x: ml, y: H - 8, 'text-anchor': 'start',
    'font-size': 9, fill: 'var(--muted)', opacity: 0});
  svg.append(rot);

  const cima = pts.map(p => X(p.cobertura_pct) + ',' + Y(p.pct_q900));
  const baixo = pts.slice().reverse()
    .map(p => X(p.cobertura_pct) + ',' + Y(p.pct_q100));
  svg.append(S('polygon', {points: cima.concat(baixo).join(' '),
    fill: 'var(--proj)', opacity: 0.22}));

  if (cand.pct_final != null) {
    svg.append(S('line', {x1: ml, x2: W - mr,
      y1: Y(cand.pct_final), y2: Y(cand.pct_final),
      stroke: 'var(--fg)', 'stroke-width': 1, 'stroke-dasharray': '1 4',
      opacity: 0.5}));
  }

  const linha = (campo, cor, tracejado, largura) => {
    const d = pts.filter(p => p[campo] != null)
      .map((p, i) => (i ? 'L' : 'M') + X(p.cobertura_pct) + ' '
           + Y(p[campo])).join(' ');
    return S('path', {d, fill: 'none', stroke: cor,
      'stroke-width': largura || 2,
      'stroke-linejoin': 'round', 'stroke-dasharray': tracejado});
  };
  // Projetado primeiro, por baixo; apurado por cima e mais grosso: o
  // apurado e fato, a projecao e estimativa, e a hierarquia visual diz isso.
  svg.append(linha('pct_projetado', 'var(--proj)', '7 4', 2));
  svg.append(linha('pct_apurado', 'var(--acento)', null, 2.6));

  for (const p of pts) {
    if (p.pct_apurado == null) continue;
    const c = S('circle', {cx: X(p.cobertura_pct), cy: Y(p.pct_apurado),
      r: 2.5, fill: 'var(--acento)'});
    const t = S('title');
    t.textContent = p.cobertura_pct.toFixed(1) + '% apurado\n'
      + 'contado: ' + p.pct_apurado.toFixed(2) + '%\n'
      + 'projetado: ' + p.pct_projetado.toFixed(2) + '% ('
      + p.pct_q100.toFixed(1) + '–' + p.pct_q900.toFixed(1) + ')';
    c.append(t);
    svg.append(c);
  }
  return svg;
}

  if (!d.dados.length) {

      'Nenhuma projeção registrada ainda. Rode "obs2026 prever".');
  }
  const out = [el('div', {cls: 'nota'},
    el('b', {}, 'O que dissemos, e quando. '), d.nota)];
  for (const s of d.dados) {
    out.push(el('h2', {}, s.serie));
    out.push(el('div', {cls: 'nota'},
      `${s.execucoes} execuções · de ${brt(s.primeira)} a ${brt(s.ultima)}`));
    out.push(el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, 'Momento'),
        el('th', {cls: 'num'}, 'Cobertura'), el('th', {}, 'Estado'),
        el('th', {}, 'Líder projetado'), el('th', {cls: 'num'}, '% (80%)'),
        el('th', {cls: 'hide-sm'}, 'Modelo'),
        el('th', {cls: 'hide-sm num'}, 'Semente'), el('th', {}, 'Definida'))),
      el('tbody', {}, ...s.registros.map(r => {
        const t = r.candidatos[0];
        return el('tr', {},
          el('td', {}, r.momento.slice(0, 19).replace('T', ' ')),
          el('td', {cls: 'num'}, pct(r.cobertura_eleitorado_pct)),
          el('td', {}, el('span', {cls: 'tag'}, r.estado_publicacao)),
          el('td', {}, t ? t.nome : '—'),
          el('td', {cls: 'num'}, t
            ? `${pct(t.pct_q500)} (${t.pct_q100.toFixed(1)}–`
              + `${t.pct_q900.toFixed(1)})` : '—'),
          el('td', {cls: 'hide-sm'}, el('code', {}, r.model_version)),
          el('td', {cls: 'hide-sm num'}, el('code', {}, String(r.semente))),
          el('td', {}, r.disputa_definida
            ? el('span', {cls: 'tag ok'}, 'sim') : ''));
      }))));
  }
  out.push(el('div', {cls: 'nota'}, el('b', {}, 'Como ler. '),
    'Erro grande com 2% apurado não é falha; intervalo que não cobre o '
    + 'resultado com 60% apurado é. A consolidação por faixa, com intervalo '
    + 'de confiança das próprias métricas, sai em "obs2026 '
    + 'auditar-previsoes".'));
  return el('div', {}, ...out);
}

/* --------------------------------------------------------- configuração
 *
 * As chaves que se mexem com o sistema no ar. Cada seção grava sozinha e
 * mostra o que ficou gravado (a resposta do servidor relida do disco), não
 * o que foi pedido. Nada aqui muda voto, apuração ou projeção já feita:
 * modelo e chaves valem da próxima passada em diante. */

async function postConfig(rota, corpo) {
  const r = await fetch(API + '/configuracao/' + rota, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(corpo || {}),
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    const det = d.detail;
    throw new Error(typeof det === 'string' ? det
      : (det && det.motivo) || `erro ${r.status}`);
  }
  return d.dados;
}

const idade = iso => {
  if (!iso) return null;
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  return s < 90 ? `${s}s` : s < 5400 ? `${Math.round(s / 60)} min`
    : `${Math.round(s / 3600)} h`;
};

const dataBR = iso => iso ? new Date(iso).toLocaleString('pt-BR',
  {timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit',
   hour: '2-digit', minute: '2-digit'}) : '—';

async function viewConfig() {
  let c = (await get('/configuracao')).dados;
  const raiz = el('div', {});
  const msg = el('div', {});

  const aviso = (txt, erro) => poe(msg, el('div', {
    cls: 'nota' + (erro ? ' aten' : '')}, txt));
  const tenta = async (fn, ok) => {
    try { c = await fn(); aviso(ok); desenhar(); }
    catch (e) { aviso('Não gravado: ' + e.message, true); }
  };
  /* Ligar e desligar o coletor não é instantâneo: quem diz se ele está no ar
   * é o batimento que ele grava a cada 5 s, e o pedido de parada só é
   * atendido na volta seguinte do laço dele. Sem esperar, a tela redesenhava
   * com o estado velho e parecia que o clique não pegou — daí o hábito de
   * clicar duas vezes, que chegava a pedir dois coletores. Agora a tela
   * espera a confirmação, com o botão travado enquanto isso. */
  // Enquanto o pedido está em curso, `desenhar()` refaz o botão: sem
  // guardar o estado aqui, ele voltava a dizer "Iniciar coletor" no meio da
  // espera — a aparência de clique perdido que levava ao clique duplo.
  let coletorPendente = null;   // 'iniciando' | 'parando' | null
  const vivo = (x) => !!(x && x.coletor && x.coletor.visto_em
    && (Date.now() - new Date(x.coletor.visto_em).getTime()) < 30000);
  // Ao sair, o coletor grava `parado_em` junto com o último batimento. Sem
  // olhar isso, a parada só apareceria 30 s depois, quando o batimento
  // envelhece — e a tela ficava em "parando…" com ele já fora do ar.
  const parado = (x) => {
    const col = x && x.coletor;
    if (!col || !vivo(x)) return true;
    return !!(col.parado_em && col.visto_em
              && new Date(col.parado_em) >= new Date(col.visto_em));
  };
  const aguardarColetor = async (queroVivo, ate = 40000) => {
    const fim = Date.now() + ate;
    while (Date.now() < fim) {
      await new Promise(r => setTimeout(r, 1500));
      try {
        const novo = (await get('/configuracao')).dados;
        const pronto = queroVivo ? (vivo(novo) && !parado(novo))
                                 : parado(novo);
        if (pronto) { c = novo; desenhar(); return true; }
        c = novo;
      } catch (e) { /* servidor ocupado: tenta de novo */ }
    }
    try { c = (await get('/configuracao')).dados; } catch (e) { /* idem */ }
    desenhar();
    return false;
  };
  const secao = (titulo, ...filhos) => el('section', {
    style: 'border:1px solid var(--line);border-radius:var(--radius);'
         + 'padding:4px 16px 14px;margin:14px 0;background:var(--bg)'},
    el('h2', {}, titulo), ...filhos);
  const botao = (txt, onclick, extra) => el('button', {onclick,
    style: 'background:var(--panel);border:1px solid var(--line);'
         + 'border-radius:8px;padding:6px 13px;font:inherit;font-size:13px;'
         + 'color:var(--fg);cursor:pointer;margin:3px 6px 3px 0;'
         + (extra || '')}, txt);

  function secaoModelo() {
    const atual = c.operacao.modelo_projecao;
    return secao('Modelo de projeção',
      el('div', {style: 'display:flex;flex-direction:column;gap:8px'},
        ...c.modelos.map(m => el('label', {
          style: 'display:flex;gap:10px;align-items:flex-start;'
               + 'text-transform:none;letter-spacing:0;font-size:13.5px;'
               + 'color:var(--fg);cursor:pointer;padding:8px 10px;'
               + 'border-radius:8px;border:1px solid '
               + (m.id === atual ? 'var(--acento)' : 'var(--line)')},
          el('input', {type: 'radio', name: 'modelo', value: m.id,
            checked: m.id === atual ? '' : null,
            onchange: () => {
              if (m.id === 'm0' && !confirm('M0 é só a referência do gate '
                  + 'estatístico, não um modelo de produção. Usar mesmo '
                  + 'assim?')) { desenhar(); return; }
              // Trocar o modelo e assinar são um ato só (05/10/2026): a
              // homologação é de cada modelo, e trocar sem assinar deixava
              // a tela dizendo "homologado" com a assinatura do anterior.
              const gm = ((c.homologacao || {}).gates || {})[m.id] || {};
              const f = v => String(v).replace('.', ',');
              let assinante = null;
              if (gm.passou) {
                const cob = gm.cobertura ? ` (cobertura do intervalo de 80%: `
                  + `${f(gm.cobertura.real)}% na ordem real, `
                  + `${f(gm.cobertura.aleatoria)}% na aleatória)` : '';
                const r = prompt('TROCAR O MODELO EM PRODUÇÃO PARA\n'
                  + m.nome + '\n\nGate de 2022: passou' + cob + '.\n\n'
                  + 'A homologação é de cada modelo. Para as probabilidades '
                  + 'de vitória seguirem no ar com este, assine com o seu '
                  + 'nome.\n\n(Em branco: troca sem assinar — o modelo '
                  + 'fica em cenário exploratório, sem probabilidade.)',
                  c.homologacao.assinado_por || '');
                if (r === null) { desenhar(); return; }
                assinante = r.trim();
                if (assinante && assinante.length < 3) {
                  aviso('Nome curto demais para assinar. Nada foi trocado.',
                        true);
                  desenhar();
                  return;
                }
              } else if (!confirm('TROCAR O MODELO EM PRODUÇÃO PARA\n'
                  + m.nome + '\n\nEste modelo NÃO tem gate aprovado'
                  + (gm.motivo ? ': ' + gm.motivo
                     : gm.recusa && gm.recusa.length
                       ? ': ' + gm.recusa.join('; ') : '')
                  + '.\n\nEm produção ele fica em cenário exploratório: '
                  + 'os intervalos continuam no ar, sem probabilidade de '
                  + 'vitória e sem selo de vencedor projetado.\n\nTrocar '
                  + 'mesmo assim?')) { desenhar(); return; }
              tenta(async () => {
                let r = await postConfig('operacao', {modelo_projecao: m.id});
                if (assinante) {
                  r = await postConfig('homologar', {assinante});
                }
                return r;
              }, `Modelo em produção: ${m.nome}`
                + (assinante ? `, homologado por ${assinante}`
                   : gm.passou ? ', SEM assinatura: sem probabilidade até '
                     + 'homologar' : ', em cenário exploratório')
                + '. Vale da próxima projeção em diante (o coletor registra '
                + 'a cada 2 min; o telão guarda 60 s).');
            }}),
          el('div', {},
            el('b', {}, m.nome),
            m.recomendado ? [' ', el('span', {cls: 'tag ok'},
                                     'recomendado')] : null,
            m.id === atual ? [' ', el('span', {cls: 'tag info'},
                                      'em produção')] : null,
            (((c.homologacao || {}).gates || {})[m.id] || {}).passou
              ? [' ', el('span', {cls: 'tag'}, 'gate aprovado')] : null,
            el('div', {style: 'color:var(--muted);font-size:12.5px;'
                            + 'margin-top:2px'}, m.descricao))))),
      el('div', {cls: 'nota'}, 'A troca vale para projeções novas. As já '
        + 'registradas continuam no diário com o modelo com que foram '
        + 'feitas — o gráfico de convergência mostra a troca como série '
        + 'nova, não reescreve o passado (§5.2).'));
  }

  function secaoColeta() {
    const col = c.coletor;
    // "No ar" é batimento recente E sem marca de saída. O coletor grava
    // `parado_em` no mesmo instante do último batimento quando sai; sem
    // olhar isso, a tela diria "no ar" por mais 30 s depois de ele fechar.
    const paradoAgora = !!(col && col.parado_em && col.visto_em
      && new Date(col.parado_em) >= new Date(col.visto_em));
    const vivo = !paradoAgora && col && col.visto_em
      && (Date.now() - new Date(col.visto_em).getTime()) < 30000;
    const chave = (rotulo, k, nota) => el('label', {
      style: 'display:flex;gap:10px;align-items:flex-start;'
           + 'text-transform:none;letter-spacing:0;font-size:13.5px;'
           + 'color:var(--fg);margin:8px 0;cursor:pointer'},
      el('input', {type: 'checkbox',
        checked: c.operacao.coleta[k] ? '' : null,
        onchange: e => tenta(() => postConfig('operacao',
          {coleta: {[k]: e.target.checked}}),
          `${rotulo}: ${e.target.checked ? 'ligado' : 'desligado'}. O `
          + 'coletor aplica na próxima volta do laço.')}),
      el('div', {}, el('b', {}, rotulo),
        el('div', {style: 'color:var(--muted);font-size:12.5px'}, nota)));
    const ult = c.ultimo_comando;
    const atendido = ult && col && col.ultimo_comando_id >= ult.id;
    return secao('Coleta',
      el('div', {cls: 'resumo'},
        el('div', {cls: 'kpi', style: vivo ? null
            : 'border-color:var(--alerta)'},
          el('div', {cls: 'k'}, 'Coletor'),
          el('div', {cls: 'v', style: 'font-size:17px'},
             vivo ? 'no ar' : col ? 'parado' : 'nunca visto'),
          el('div', {cls: 'n'}, col
            ? (vivo ? `último sinal há ${idade(col.visto_em)}`
               : `parou há ${idade(col.parado_em || col.visto_em)}`
                 + (col.motivo_parada ? ` · ${col.motivo_parada}` : ''))
            : 'rode obs2026 coletar'),
          el('div', {style: 'margin-top:8px'}, c.ambiente.demonstracao ? null
            : coletorPendente
              ? botao(coletorPendente === 'parando' ? 'parando…'
                                                    : 'iniciando…',
                      null, 'opacity:.6;cursor:progress')
            : vivo ? botao('■ Parar coletor', async () => {
                if (!confirm('Parar o coletor? Ele termina a volta atual e '
                             + 'sai. Painel e telão continuam no ar.')) return;
                coletorPendente = 'parando';
                await tenta(() => postConfig('comando', {acao: 'parar'}),
                  'Pedido enviado: aguardando o coletor sair…');
                const ok = await aguardarColetor(false);
                coletorPendente = null;
                desenhar();
                aviso(ok ? 'Coletor parado.'
                  : 'O coletor ainda aparece no ar; veja a janela dele.');
              })
            : botao('▶ Iniciar coletor', async () => {
                coletorPendente = 'iniciando';
                await tenta(() => postConfig('coletor/iniciar', {}),
                  'Coletor aberto numa janela própria — aguardando o '
                  + 'primeiro batimento…');
                const ok = await aguardarColetor(true);
                coletorPendente = null;
                desenhar();
                aviso(ok ? 'Coletor no ar.'
                  : 'Iniciado, mas sem batimento ainda; veja a janela dele.');
              }))),
        el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, 'Fila'),
          el('div', {cls: 'v'}, col ? fmt(col.fila) : '—'),
          el('div', {cls: 'n'}, col ? `${String(col.req_s).replace('.', ',')}`
            + ' req/s em média' : '')),
        el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, 'Finalizados'),
          el('div', {cls: 'v'}, col ? fmt(col.finalizados) : '—'),
          el('div', {cls: 'n'}, 'fora das buscas, vigiados'))),
      chave('Pular o que o TSE já finalizou', 'pular_finalizados',
        'Poupa a cota de 100 req/s para o que ainda muda. O finalizado '
        + 'continua vigiado pelo EA14/EA15 e volta se o TSE re-totalizar.'),
      chave('Buscar deputados federais', 'deputados_federais',
        'Só os 27 arquivos de UF, a cada 2 min (0,23 req/s), para a tela '
        + 'de composição da Câmara. Sem projeção e sem municípios.'),
      chave('Parar o coletor quando o TSE encerrar', 'encerrar_ao_finalizar',
        'Quando Brasil e todas as UFs estiverem encerrados, o coletor espera '
        + '10 min pelos últimos arquivos e se desliga. Painel e telão '
        + 'continuam com o resultado final.'
        + (col && col.encerra_em_s != null
           ? ` Encerramento em ${Math.ceil(col.encerra_em_s / 60)} min.`
           : '')),
      el('div', {style: 'margin-top:10px'},
        botao('⟳ Forçar atualização dos totais', () => tenta(
          () => postConfig('comando', {acao: 'forcar_totais'}),
          'Pedido enviado ao coletor: Brasil, UFs e deputados vão para a '
          + 'frente da fila, inclusive os finalizados. Confira abaixo '
          + 'quando ele atender.'), 'border-color:var(--acento)'),
        botao('Forçar varredura completa', () => {
          if (!confirm('Enfileirar os ~16.900 arquivos municipais? Vão '
              + 'atrás de tudo que muda, mas ocupam cerca de 14 minutos de '
              + 'cota a 20 req/s.')) return;
          tenta(() => postConfig('comando', {acao: 'forcar_tudo'}),
                'Varredura completa pedida ao coletor.');
        }),
        botao('Reler o dia no banco', () => {
          if (!confirm('Reler no banco tudo o que chegou hoje do TSE? Não '
              + 'duplica nada; serve quando o painel parece parado num '
              + 'retrato velho. Leva de segundos a poucos minutos.')) return;
          tenta(() => postConfig('reler-dia', {}),
                'A carga do coletor relê o dia na próxima passada (5 s). '
                + 'Arquivos que falharem ficam pendentes e são tentados de '
                + 'novo sozinhos.');
        }),
        botao('Limpar memória do mapa', () => tenta(
          () => postConfig('cache', {}),
          'Memória de linhas do mapa esvaziada; a próxima leitura '
          + 'recalcula do banco.'))),
      ult ? el('div', {cls: 'nota' + (atendido ? '' : ' aten')},
        el('b', {}, `Último pedido #${ult.id}: `), c.comandos[ult.acao]
          || ult.acao, ` — pedido ${dataBR(ult.pedido_em)}; `,
        atendido
          ? `atendido às ${dataBR(col.ultimo_comando_atendido_em)} `
            + `(${fmt(col.ultimo_comando_alvos)} arquivos enfileirados).`
          : vivo ? 'aguardando o coletor (ele confere a cada volta).'
          : 'o coletor não está no ar — e um pedido feito com ele parado '
            + 'não é executado quando ele voltar, de propósito.') : null);
  }

  function secaoTelao() {
    return secao('Telão',
      botao('↻ Recarregar o telão', () => {
        comandarTelao('recarregar');
        aviso('Telão recarregado (se estiver aberto neste navegador).');
      }),
      botao('Abrir telão ↗', abrirTelao),
      el('div', {cls: 'nota'}, 'Recarregar relê a página do projetor — '
        + 'útil depois de assinar a classificação ou trocar cores. O '
        + 'roteiro continua o gravado, na aba Telão.'),
      el('div', {style: 'margin-top:10px'},
        el('b', {}, 'Faixa de alertas no pé do telão: '),
        botao('Ligada (últimos 40 min)', () => {
          comandarTelao('alertas:recentes');
          aviso('Faixa ligada: novidades dos últimos 40 minutos.');
        }),
        botao('Todas, de qualquer hora', () => {
          comandarTelao('alertas:tudo');
          aviso('Faixa mostrando as últimas novidades, de qualquer hora.');
        }),
        botao('Desligada', () => {
          comandarTelao('alertas:0');
          aviso('Faixa de alertas desligada.');
        })),
      el('div', {cls: 'nota'}, 'As novidades saem do diário de projeções: '
        + 'matematicamente eleito, 2º turno definido, vencedor ou 2º turno '
        + 'projetado e 100% apurado. A escolha fica guardada no navegador '

  }

  function secaoPartidos() {
    const cl = c.classificacao;
    const cats = cl.categorias;
    const linhas = c.partidos.map(p => ({...p, _orig: JSON.stringify(
      [p.ideologia, p.grau_controversia, p.justificativa, p.fonte]),
      _cor: p.cor}));
    const mudadas = () => linhas.filter(p => JSON.stringify(
      [p.ideologia, p.grau_controversia, p.justificativa, p.fonte])
      !== p._orig);
    const cores = () => linhas.filter(p => p.cor !== p._cor);
    const nome = el('input', {type: 'text', placeholder: 'seu nome',
      value: cl.curador || '',
      style: 'background:var(--bg);color:var(--fg);border:1px solid '
           + 'var(--line);border-radius:6px;padding:6px 9px;font:inherit;'
           + 'font-size:13.5px;min-width:220px'});
    const estadoBtn = el('span', {});
    const campo = 'background:var(--bg);color:var(--fg);border:1px solid '
      + 'var(--line);border-radius:6px;padding:3px 6px;font:inherit;'
      + 'font-size:12.5px;width:100%';

    function atualizarBotao() {
      const n = mudadas().length, k = cores().length;
      poe(estadoBtn,
        cl.estado !== 'disponivel' && !n
          ? botao('✍ Assinar a proposta como está', assinar,
                  'border-color:var(--ok)') : null,
        n ? botao(`✍ Gravar ${n} alteração(ões) e assinar`, assinar,
                  'border-color:var(--ok)') : null,
        k ? botao(`Gravar ${k} cor(es)`, gravarCores) : null,
        (n || k) ? botao('Descartar', () => desenhar()) : null);
    }
    async function assinar() {
      const quem = nome.value.trim();
      if (quem.length < 3) {
        aviso('Informe o nome de quem responde pela classificação.', true);
        nome.focus();
        return;
      }
      const alts = mudadas().map(p => ({numero: p.numero,
        ideologia: p.ideologia, grau_controversia: p.grau_controversia,
        justificativa: p.justificativa, fonte: p.fonte}));
      if (!confirm(`Assinar a classificação como "${quem}"? `
          + (alts.length ? `${alts.length} partido(s) alterado(s); ` : '')
          + 'ela passa a aparecer no telão, com o seu nome.')) return;
      tenta(() => postConfig('classificacao', {curador: quem,
        alteracoes: alts}), 'Classificação assinada. O telão passa a '
        + 'mostrar a ideologia na próxima atualização.');
    }
    function gravarCores() {
      const cs = {};
      for (const p of cores()) cs[p.numero] = p.cor;
      tenta(() => postConfig('cores', {cores: cs}), 'Cores gravadas.');
    }

    const tabela = el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, 'Nº'), el('th', {}, 'Partido'),
        el('th', {}, 'Ideologia'), el('th', {}, 'Controv.'),
        el('th', {}, 'Justificativa e fonte'))),
      el('tbody', {}, ...linhas.map(p => el('tr', {},
        el('td', {cls: 'num'}, p.numero),
        el('td', {style: 'white-space:nowrap'},
          el('input', {type: 'color', value: p.cor,
            title: 'cor do partido nos mapas',
            style: 'width:26px;height:22px;border:0;padding:0;'
                 + 'background:none;vertical-align:middle;cursor:pointer',
            oninput: e => { p.cor = e.target.value.toUpperCase();
                            atualizarBotao(); }}),
          ' ', el('b', {}, p.sigla),
          el('div', {style: 'font-size:11px;color:var(--muted)'}, p.nome)),
        el('td', {}, el('select', {style: campo,
            onchange: e => { p.ideologia = e.target.value || null;
                             atualizarBotao(); }},
          el('option', {value: '', selected: p.ideologia ? null : ''},
             '— sem classificação'),
          ...cats.map(k => el('option', {value: k.id,
            selected: p.ideologia === k.id ? '' : null},
            k.simbolo + ' ' + k.rotulo))),
          p.autor ? el('div', {style: 'font-size:10.5px;color:var(--muted);'
            + 'margin-top:2px'}, `${p.autor}, ${p.decidido_em || ''}`)

            + 'margin-top:2px'}, p.ideologia ? 'sem autor (proposta)' : '')),
        el('td', {}, el('select', {style: campo + ';width:52px',
            title: '0 consensual · 3 fortemente disputada',

                             atualizarBotao(); }},

                            atualizarBotao(); }}, p.justificativa),

            style: campo + ';margin-top:3px;color:var(--muted)',

                            atualizarBotao(); }}))))));

    const sec = secao('Partidos × ideologia',
      el('div', {cls: 'resumo'},

          el('div', {cls: 'v'}, String(c.partidos.filter(p => p.ideologia)

      el('div', {cls: 'nota'}, el('b', {}, 'Ato editorial, com autoria. '),
        'A ideologia só aparece no telão depois de assinada, e cada '
        + 'alteração vira versão nova com o nome de quem gravou — a anterior '
        + 'fica em config/classificacao.anterior/. Blocos: esquerda = '
        + 'esquerda + centro-esquerda; direita = direita + centro-direita. '
        + 'Vale o partido do candidato, nunca o da coligação. A cor ao lado '
        + 'da sigla é a do mapa por partido.'),
      cl.problemas.length ? el('div', {cls: 'nota aten'},
        el('b', {}, 'Problemas: '), cl.problemas.join(' · ')) : null,
      el('div', {style: 'display:flex;gap:10px;align-items:center;'
                      + 'flex-wrap:wrap;margin:8px 0'},
        el('span', {style: 'font-size:12.5px;color:var(--muted)'},
           'Assinar como'), nome, estadoBtn),
      el('div', {style: 'overflow-x:auto'}, tabela));
    atualizarBotao();
    return sec;
  }

  function secaoGate() {
    const h = c.homologacao, g = h.gate || {};
    const nome = el('input', {type: 'text', placeholder: 'seu nome',
      value: h.assinado_por || (c.classificacao.curador || ''),
      style: 'background:var(--bg);color:var(--fg);border:1px solid '
           + 'var(--line);border-radius:6px;padding:6px 9px;font:inherit;'
           + 'font-size:13.5px;min-width:220px'});
    const f = v => v == null ? '—' : String(v).replace('.', ',');
    // A assinatura é de UM modelo. Quando a produção troca de modelo, a
    // homologação antiga não vale para o novo: a tela diz isso e oferece
    // assinar — sem passar por "Revogar", que é o contrário.
    const nomeModelo = id => {
      const m = (c.modelos || []).find(x => x.id === id);
      return m ? m.nome.split(' — ')[0] : String(id || '').toUpperCase();
    };
    const MOD = nomeModelo(h.modelo_producao);
    const outro = h.thresholds && h.vale === false;
    const tabela = g.disponivel && g.por_rodada ? el('details', {},
      el('summary', {}, `Erro mediano rodada a rodada (M0 × ${MOD})`),
      el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Ordem'),
        el('th', {cls: 'num'}, 'Rodada'), el('th', {cls: 'num'}, 'M0 (pp)'),
        el('th', {cls: 'num'}, `${MOD} (pp)`),
        el('th', {}, `${MOD} melhor`))),
        el('tbody', {}, ...g.por_rodada.map(r => el('tr', {},
          el('td', {}, r.ordem), el('td', {cls: 'num'}, String(r.rodada)),
          el('td', {cls: 'num'}, f(r.erro_m0)),
          el('td', {cls: 'num'}, f(r.erro_m2)),
          el('td', {}, r.m2_melhor ? el('span', {cls: 'tag ok'}, 'sim')
                                   : el('span', {cls: 'tag err'}, 'não')))))))
      : null;
    return secao('Gate estatístico (probabilidade de vitória)',
      el('div', {cls: 'resumo'},
        el('div', {cls: 'kpi', style: h.thresholds && !outro
            ? 'border-color:var(--ok)' : 'border-color:var(--alerta)'},
          el('div', {cls: 'k'}, `Situação — ${MOD} em produção`),
          el('div', {cls: 'v', style: 'font-size:17px'},
             outro ? `falta homologar o ${MOD}`
             : h.thresholds ? 'homologado' : 'não homologado'),
          el('div', {cls: 'n'}, outro
            ? `a assinatura de ${dataBR(h.assinado_em)} é do `
              + `${nomeModelo(h.modelo_assinado)} · sem probabilidade até `
              + 'assinar'
            : h.thresholds
            ? `${h.assinado_por} · ${dataBR(h.assinado_em)}`
            : 'cenário exploratório, sem probabilidade')),
        el('div', {cls: 'kpi', style: g.disponivel ? (g.passou
            ? 'border-color:var(--ok)' : 'border-color:var(--erro)') : null},
          el('div', {cls: 'k'}, `Evidência 2022 — ${MOD}`),
          el('div', {cls: 'v', style: 'font-size:17px'},
             !g.disponivel ? 'não rodada' : g.passou ? 'passou' : 'não passou'),
          el('div', {cls: 'n'}, g.disponivel
            ? `${g.disputas} disputas · ${dataBR(g.gerado_em)}` : '')),
        g.disponivel ? el('div', {cls: 'kpi'},
          el('div', {cls: 'k'}, 'Cobertura do intervalo 80%'),
          el('div', {cls: 'v', style: 'font-size:17px'},
             `${f(g.cobertura80_m2_pct.real)}% · `
             + `${f(g.cobertura80_m2_pct.aleatoria)}%`),
          el('div', {cls: 'n'}, `ordem real · aleatória (±${f(g.tolerancia_pp)}`
             + ' pp)')) : null),
      el('div', {cls: 'nota'}, el('b', {}, 'O que é. '),
        'Probabilidade de vitória só é publicada se o modelo em produção '
        + 'provar, na eleição real de 2022 (ordem real de chegada e '
        + 'aleatória), que erra menos que a referência ingênua (M0) em toda '
        + 'rodada e que o intervalo de 80% cobre o resultado cerca de 80% '
        + 'das vezes. Sem isso, os intervalos ficam no ar e a probabilidade '
        + 'não.'),
      !g.disponivel ? el('div', {cls: 'nota aten'}, g.motivo)
        : g.recusa && g.recusa.length ? el('div', {cls: 'nota aten'},
            el('b', {}, 'Não pode ser homologado: '), g.recusa.join('; '),
            '. O produto segue em cenário exploratório.') : null,
      tabela,
      el('div', {style: 'display:flex;gap:10px;align-items:center;'
                      + 'flex-wrap:wrap;margin:10px 0'},
        (!h.thresholds || outro) && g.passou ? [
          el('span', {style: 'font-size:12.5px;color:var(--muted)'},
             'Assinar como'), nome,
          botao(`✍ Homologar o ${MOD} e liberar probabilidades`, () => {
            const quem = nome.value.trim();
            if (quem.length < 3) { aviso('Informe o seu nome.', true); return; }
            if (!confirm(`Homologar como "${quem}"? Probabilidades de vitória `
                + 'passam a aparecer no painel, no telão e no WhatsApp, a '
                + 'partir da próxima rodada de projeção (até 3 min).')) return;
            tenta(() => postConfig('homologar', {assinante: quem}),
                  'Homologado. Probabilidades a partir da próxima rodada.');
          }, 'border-color:var(--ok)')] : null,
        h.thresholds && !outro ? botao(
            'Revogar (desligar as probabilidades)', () => {
          const motivo = prompt('Motivo da revogação (fica registrado):');
          if (motivo === null) return;
          tenta(() => postConfig('revogar', {motivo}),
                'Homologação revogada: sem probabilidade a partir da próxima '
                + 'rodada.');
        }, 'border-color:var(--alerta)') : null));
  }

  function secaoDados() {
    const s = c.senado;
    return secao('Dados institucionais e homologação',
      el('div', {cls: 'resumo'},
        el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, 'Senado até 2031'),
          el('div', {cls: 'v'}, String(s.remanescentes)),
          el('div', {cls: 'n'}, s.obtido_em ? 'partidos de '
            + dataBR(s.obtido_em) : 'não baixado')),
        el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, 'Ambiente'),
          el('div', {cls: 'v', style: 'font-size:15px'}, c.ambiente.nome),
          el('div', {cls: 'n'}, c.ambiente.oficial ? 'oficial'
            : c.ambiente.demonstracao ? 'demonstração' : 'simulado')),
        el('div', {cls: 'kpi', style: c.homologacao.thresholds ? null
            : 'border-color:var(--alerta)'},
          el('div', {cls: 'k'}, 'Gate estatístico'),
          el('div', {cls: 'v', style: 'font-size:15px'},
             c.homologacao.thresholds ? 'homologado' : 'não homologado'),
          el('div', {cls: 'n'}, c.homologacao.thresholds
            ? `${c.homologacao.assinado_por || ''}`
            : 'sem probabilidade publicada'))),
      botao('Atualizar composição do Senado (usa internet)', () => {
        if (!confirm('Baixar de novo a lista de senadores dos dados '
            + 'abertos do Senado? Faça antes da noite, não durante.')) return;
        tenta(() => postConfig('senado', {}), 'Composição do Senado '
          + 'atualizada.');
      }),
      el('div', {cls: 'nota'}, 'Trocar de ambiente (simulado, oficial, '
        + 'demonstração) é na hora de subir o servidor: ',
        el('code', {}, 'obs2026 servir --env oficial2026'),
        '. O gate estatístico é assinado em config/thresholds.yaml, fora do '
        + 'painel, de propósito.'));
  }

  function desenhar() {
    poe(raiz, msg, secaoModelo(), secaoGate(), secaoColeta(), secaoTelao(),
        secaoPartidos(), secaoDados());
  }
  desenhar();
  return raiz;
}

/* ------------------------------------------------------ deputado federal
 *
 * Só o resultado do TSE, sem projeção (pedido de 21/09). Não é uma disputa
 * no banco: os 27 arquivos de UF vêm do arquivo bruto pela rota de
 * composição. Por isso esta aba tem visão própria, e as de projeção,
 * convergência e auditoria não se aplicam a ela. */
/* ------------------------------------------------------ deputado estadual
 *
 * As 27 assembleias (05/10/2026). Como deputado federal: só o resultado do
 * TSE, sem projeção, lido do arquivo bruto pela rota de composição. Sem UF,
 * o quadro do país por bloco; com UF, o plenário daquela casa e os eleitos.
 * No DF a casa é a Câmara Legislativa e o cargo, deputado distrital. */
const COR_BLOCO_PAINEL = {esquerda: '#C62828', centro: '#F2C94C',
                          direita: '#1565C0', sem_classificacao: '#59636e'};
function barraBlocosPainel(por, total, marca) {
  const b = el('div', {style: 'position:relative;display:flex;height:14px;'
    + 'border-radius:4px;overflow:hidden;background:#2a313d;min-width:120px'});
  for (const k of ['esquerda', 'centro', 'direita', 'sem_classificacao']) {
    const n = (por[k] || {}).total || 0;
    if (n) b.append(el('i', {style: `display:block;width:${100 * n / total}%;`
      + `background:${COR_BLOCO_PAINEL[k]}`}));
  }
  if (marca) b.append(el('i', {style: 'position:absolute;top:0;bottom:0;'
    + `left:${100 * marca / total}%;width:2px;background:#f2f5f9`}));
  return b;
}

async function viewAssembleias() {
  const r = await get('/composicao?casa=assembleia'
    + (st.uf ? `&uf=${st.uf}` : ''));
  rodape(r);
  const d = r.dados;
  const comIdeo = d.classificacao.estado === 'disponivel';
  const out = [];
  const numBloco = (por, k) => el('span', {style:
    `color:${COR_BLOCO_PAINEL[k]};font-weight:700`}, String(por[k].total));

  if (!st.uf) {
    if (!(d.ufs || []).length) {
      return el('div', {cls: 'estado'}, r.status_motivo
        || 'Nenhum arquivo de deputado estadual coletado ainda.');
    }
    const tot = d.total || 1;
    out.push(el('div', {cls: 'resumo'},
      el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, 'Cadeiras'),
        el('div', {cls: 'v'}, fmt(d.total)),
        el('div', {cls: 'n'}, `em ${d.ufs_com_dado} casas`)),
      el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, 'Eleitos segundo o TSE'),
        el('div', {cls: 'v'}, fmt(d.eleitos)),
        el('div', {cls: 'n'}, d.provisorios
          ? `${fmt(d.provisorios)} vagas provisórias`
          : `${d.ufs_encerradas} casas encerradas`)),
      el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, 'Maior bancada do país'),
        el('div', {cls: 'v'}, d.partidos.length
          ? `${d.partidos[0].partido.sigla} ${d.partidos[0].total}` : '—'),
        el('div', {cls: 'n'}, d.partidos.length
          ? `em ${d.partidos[0].assembleias} casas` : ''))));
    out.push(el('div', {cls: 'nota'}, el('b', {}, 'Só o resultado. '),
      d.nota));
    if (comIdeo) {
      out.push(el('h2', {}, 'O país por bloco'),
        barraBlocosPainel(d.por_bloco, tot),
        el('div', {style: 'display:flex;gap:18px;margin:6px 0 14px;'
          + 'font-size:13px'},
          ...['esquerda', 'centro', 'direita'].map(k => el('span', {},
            el('b', {style: `color:${COR_BLOCO_PAINEL[k]}`},
              k[0].toUpperCase() + k.slice(1) + ' '),
            `${fmt(d.por_bloco[k].total)} (${pct(100 * d.por_bloco[k].total
              / tot, 1)})`))));
    }
    out.push(el('h2', {}, 'As 27 casas'),
      el('div', {cls: 'nota'}, 'Clique num estado para abrir o plenário '
        + 'dele. O traço branco marca a maioria da casa.'),
      el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'UF'),
        el('th', {cls: 'num'}, 'Cadeiras'),
        comIdeo ? el('th', {}, 'Blocos') : null,
        comIdeo ? el('th', {cls: 'num'}, 'Esq.') : null,
        comIdeo ? el('th', {cls: 'num'}, 'Centro') : null,
        comIdeo ? el('th', {cls: 'num'}, 'Dir.') : null,
        comIdeo ? el('th', {}, 'Maioria de bloco') : null,
        el('th', {}, 'Maior bancada'))),
        el('tbody', {}, ...d.ufs.map(u => el('tr', {
            style: 'cursor:pointer',
            onclick: () => { st.uf = u.uf; }},
          el('td', {}, el('b', {}, u.uf.toUpperCase())),
          el('td', {cls: 'num'}, String(u.vagas)),
          comIdeo ? el('td', {}, barraBlocosPainel(u.por_bloco,
            u.vagas || 1, u.maioria)) : null,
          comIdeo ? el('td', {cls: 'num'}, numBloco(u.por_bloco,
                                                    'esquerda')) : null,
          comIdeo ? el('td', {cls: 'num'}, numBloco(u.por_bloco,
                                                    'centro')) : null,
          comIdeo ? el('td', {cls: 'num'}, numBloco(u.por_bloco,
                                                    'direita')) : null,
          comIdeo ? el('td', {}, u.bloco_com_maioria
            || el('span', {cls: 'null'}, 'nenhum')) : null,
          el('td', {}, u.maior_bancada ? el('span', {},
            el('span', {cls: 'sw', style: 'margin-right:6px;background:'
              + u.maior_bancada.partido.cor}),
            `${u.maior_bancada.partido.sigla} ${u.maior_bancada.total}`)
            : '—'))))));
    out.push(el('h2', {}, 'Bancadas somadas'),
      el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Partido'),
        el('th', {cls: 'num'}, 'Cadeiras'), el('th', {cls: 'num'}, 'Casas'),
        el('th', {}, 'Ideologia'))),
        el('tbody', {}, ...d.partidos.map(p => el('tr', {},
          el('td', {}, el('span', {cls: 'sw', style:
            `background:${p.partido.cor};margin-right:6px`}),
            p.partido.sigla),
          el('td', {cls: 'num'}, el('b', {}, String(p.total))),
          el('td', {cls: 'num'}, String(p.assembleias)),
          el('td', {}, p.ideologia ? p.ideologia.rotulo
                                   : el('span', {cls: 'null'}, '—')))))));
    return el('div', {}, ...out);
  }

  const UF = st.uf.toUpperCase();
  const casa = st.uf === 'df' ? 'Câmara Legislativa' : 'Assembleia Legislativa';
  if (!d.vagas) {
    return el('div', {cls: 'estado'},
      `Arquivo de deputado estadual de ${UF} ainda não coletado.`);
  }
  out.push(el('div', {cls: 'resumo'},
    el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, casa + ' — ' + UF),
      el('div', {cls: 'v'}, `${d.eleitos}/${d.vagas}`),
      el('div', {cls: 'n'}, 'eleitos segundo o TSE')),
    el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, 'Maioria'),
      el('div', {cls: 'v'}, String(d.maioria)),
      el('div', {cls: 'n'}, `3/5: ${Math.ceil(d.vagas * 3 / 5)}`)),
    el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, 'Maior bancada'),
      el('div', {cls: 'v'}, d.partidos.length
        ? `${d.partidos[0].partido.sigla} ${d.partidos[0].total}` : '—'),
      el('div', {cls: 'n'}, `${d.partidos.length} partidos com cadeira`))));
  out.push(el('div', {cls: 'nota'}, el('b', {}, 'Só o resultado. '), d.nota));
  if (d.provisorios) {
    out.push(el('div', {cls: 'nota aten'}, el('b', {}, 'Provisório. '),
      `${d.provisorios} cadeiras são as vagas que o TSE já distribuiu às `
      + 'listas, com os mais votados de cada uma. Mudam a cada boletim.'));
  }
  if (typeof POLITICO !== 'undefined') {
    const caixa = el('div', {style: 'background:#0b0e13;border:1px solid '
      + 'var(--line);border-radius:var(--radius);padding:10px;'
      + 'max-width:760px'});
    caixa.append(POLITICO.hemiciclo(d.cadeiras, {largura: 1000, altura: 540,
      comIdeologia: comIdeo, maioria: d.maioria, centro: String(d.vagas),
      subcentro: `maioria ${d.maioria}`}));
    out.push(caixa);
  }
  if (comIdeo) {
    out.push(el('div', {style: 'max-width:760px;margin-top:10px'},
      barraBlocosPainel(d.por_bloco, d.vagas, d.maioria)),
      el('div', {style: 'display:flex;gap:18px;margin:6px 0 4px;'
        + 'font-size:13px'},
        ...['esquerda', 'centro', 'direita'].map(k => el('span', {},
          el('b', {style: `color:${COR_BLOCO_PAINEL[k]}`},
            k[0].toUpperCase() + k.slice(1) + ' '),
          String(d.por_bloco[k].total)))));
  }
  out.push(el('h2', {}, 'Bancadas'),
    el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Partido'),
      el('th', {cls: 'num'}, 'Cadeiras'), el('th', {}, 'Ideologia'))),
      el('tbody', {}, ...d.partidos.map(p => el('tr', {},
        el('td', {}, el('span', {cls: 'sw', style:
          `background:${p.partido.cor};margin-right:6px`}), p.partido.sigla),
        el('td', {cls: 'num'}, el('b', {}, String(p.total))),
        el('td', {}, p.ideologia ? p.ideologia.rotulo
                                 : el('span', {cls: 'null'}, '—')))))));
  const nomes = d.cadeiras.filter(c => c.nome);
  out.push(el('h2', {}, `Deputados — ${UF}`),
    el('table', {}, el('thead', {}, el('tr', {}, el('th', {cls: 'num'}, '#'),
      el('th', {}, 'Nome'), el('th', {}, 'Partido'),
      el('th', {cls: 'num'}, 'Votos'), el('th', {}, 'Situação'))),
      el('tbody', {}, ...nomes.map((c, i) => el('tr', {},
        el('td', {cls: 'num'}, String(i + 1)),
        el('td', {}, c.nome),
        el('td', {}, el('span', {cls: 'sw', style:
          `background:${c.partido.cor};margin-right:6px`}), c.partido.sigla),
        el('td', {cls: 'num'}, fmt(c.votos)),
        el('td', {}, c.estado === 'eleito' ? 'eleito'
          : el('span', {cls: 'null'}, 'provisório')))))));
  return el('div', {}, ...out);
}

      'UF encerrada com número de eleitos diferente das vagas — ',
      d.vagas_divergentes.map(u => u.toUpperCase()).join(', ')));
  }

  // Hemiciclo da Câmara se formando: eleitos oficiais cheios; onde o TSE
  // ainda não marcou eleitos, as vagas que ele já distribuiu às listas,
  // ocupadas pelos mais votados — claras, provisórias. Sem projeção.
  const f = d.em_formacao;
  // Com UF escolhida, a lista dela vem primeiro; o nacional fica embaixo.
  const inicioNacional = out.length;
  if (f.provisorio) {
    out.push(el('div', {cls: 'nota'}, el('b', {}, 'A Câmara se formando. '),
      f.nota));
  }
  if (f.vagas_declaradas && f.vagas_declaradas !== 513) {
    out.push(el('div', {cls: 'nota aten'}, el('b', {}, 'Dado de teste: '),
      `os arquivos das UFs somam ${f.vagas_declaradas} vagas, não 513; o `
      + 'hemiciclo mostra as primeiras 513.'));
  }
  if (typeof POLITICO !== 'undefined') {
    let cad = [];
    for (const p of f.partidos) {
      for (let i = 0; i < p.eleito; i++)
        cad.push({partido: p.partido, ideologia: p.ideologia, estado: 'eleito'});
      for (let i = 0; i < p.provisorio; i++)
        cad.push({partido: p.partido, ideologia: p.ideologia,
                  estado: 'liderando'});
    }
    cad = cad.slice(0, 513);
    while (cad.length < 513)
      cad.push({partido: null, ideologia: null, estado: 'aguardando'});
    const caixa = el('div', {style: 'background:#0b0e13;border:1px solid '
      + 'var(--line);border-radius:var(--radius);padding:10px;'
      + 'max-width:760px'});
    caixa.append(POLITICO.hemiciclo(cad, {largura: 1000, altura: 540,
      comIdeologia: d.classificacao.estado === 'disponivel', maioria: 257,
      centro: '513', subcentro: 'maioria 257 · 3/5 308'}));
    caixa.append(POLITICO.legendaEstados([['eleito', f.eleito],
      ['liderando', f.provisorio], ['aguardando', f.sem_dado]],
      {liderando: 'provisório — vaga do TSE, pode mudar'}));
    out.push(caixa);
  }

  if (f.partidos.length) {
    out.push(el('h2', {}, 'Bancadas'),
      el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Partido'),
        el('th', {cls: 'num'}, 'Total'), el('th', {cls: 'num'}, 'Eleitos'),
        el('th', {cls: 'num'}, 'Provisórios'), el('th', {}, 'Ideologia'))),
        el('tbody', {}, ...f.partidos.map(p => el('tr', {},
          el('td', {}, el('span', {cls: 'sw', style:
            `background:${p.partido.cor};margin-right:6px`}), p.partido.sigla),
          el('td', {cls: 'num'}, el('b', {}, String(p.total))),
          el('td', {cls: 'num'}, String(p.eleito)),
          el('td', {cls: 'num'}, p.provisorio ? String(p.provisorio)
                                              : el('span', {cls: 'null'}, '—')),
          el('td', {}, p.ideologia ? p.ideologia.rotulo
                                   : el('span', {cls: 'null'}, '—')))))));
  }

  const sel = d.uf_detalhe;
  if (st.uf) {
    const nacional = out.splice(inicioNacional);
    const UF = st.uf.toUpperCase();
    if (!sel) {
      out.push(el('h2', {}, `Deputados federais — ${UF}`), el('div',
        {cls: 'estado'}, `Arquivo de ${UF} ainda não coletado.`));
    } else {
      const oficial = sel.eleitos.length > 0;
      out.push(el('h2', {}, `Deputados federais — ${UF}`),
        el('div', {cls: 'nota'}, `${sel.vagas} vagas · quociente eleitoral `
          + `${fmt(sel.quociente_eleitoral)} · `
          + `${pct(sel.apurado_pct, 1) || '0%'} apurado · `
          + (sel.andamento === 'f' ? 'totalização encerrada'
             : 'em andamento: tudo pode mudar')));
      if (!oficial) {
        out.push(el('div', {cls: 'nota aten'}, el('b', {}, 'Provisório. '),
          `Vagas por lista: distribuição que o próprio TSE publica com os `
          + `votos contados até agora (${sel.vagas_distribuidas_tse} de `
          + `${sel.vagas}). Nomes: os mais votados de cada lista ocupam as `
          + 'vagas dela. Não é projeção — o TSE só marca eleito no fim.'));
      }
      // Uma tabela por lista (partido isolado ou federação): quem está nas
      // vagas e os dois seguintes da fila.
      const listas = sel.listas.filter(x => x.vagas_tse > 0
        || x.candidatos.some(c => c.eleito_tse));
      const semVaga = sel.listas.filter(x => !listas.includes(x));
      const linhas = [];
      for (const x of listas) {
        linhas.push(el('tr', {style: 'background:#141a23'},
          el('td', {colspan: 2}, el('b', {}, x.nome),
            el('span', {cls: 'null', style: 'margin-left:6px'},
              x.tipo + (x.partidos.length > 1 ? ' · '
                + x.partidos.map(p => p.sigla).join(', ') : ''))),
          el('td', {cls: 'num'}, fmt(x.votos)),
          el('td', {cls: 'num'}, el('b', {},
            `${x.vagas_tse} vaga${x.vagas_tse === 1 ? '' : 's'}`))));
        for (const c of x.candidatos) {
          const dentro = oficial ? c.eleito_tse : c.dentro_das_vagas;
          linhas.push(el('tr', {style: dentro ? '' : 'opacity:.5'},
            el('td', {cls: 'num', style: 'width:36px;color:var(--muted)'},
              `${c.posicao}º`),
            el('td', {}, c.nome, ' ',
              el('span', {cls: 'sw', style: `background:${c.partido.cor};`
                + 'margin:0 4px 0 8px'}),
              el('span', {style: 'font-size:12px;color:var(--muted)'},
                c.partido.sigla),
              c.abaixo_10pct_qe && dentro ? el('span', {cls: 'tag warn',
                style: 'margin-left:6px', title: 'Abaixo de 10% do quociente '
                + 'eleitoral: pela regra, não ocupa a vaga'}, '< 10% QE') : ''),
            el('td', {cls: 'num'}, fmt(c.votos)),
            el('td', {}, oficial ? (c.situacao || '—')
              : dentro ? el('span', {cls: 'tag info'}, 'na vaga')
              : el('span', {cls: 'null'}, 'próximo'))));
        }
      }
      out.push(el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, ''),
        el('th', {}, 'Lista / candidato'), el('th', {cls: 'num'}, 'Votos'),
        el('th', {}, oficial ? 'Situação' : 'Vagas'))),
        el('tbody', {}, ...linhas)));
      if (semVaga.length) {
        out.push(el('div', {cls: 'nota'}, el('b', {}, 'Sem vaga até agora: '),
          semVaga.map(x => `${x.nome} (${fmt(x.votos)})`).join(' · ')));
      }
    }
    out.push(el('h2', {}, 'Câmara — Brasil'), ...nacional);
  }

  out.push(el('h2', {}, 'Por UF'),
    el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'UF'),
      el('th', {cls: 'num'}, 'Vagas'), el('th', {cls: 'num'}, 'Eleitos'),
      el('th', {cls: 'num'}, 'Apurado'), el('th', {}, 'Andamento'))),
      el('tbody', {}, ...d.ufs.map(u => el('tr', {
          style: 'cursor:pointer', onclick: () => { st.uf = u.uf; }},
        el('td', {}, el('b', {}, u.uf.toUpperCase())),
        el('td', {cls: 'num'}, String(u.vagas)),
        el('td', {cls: 'num'}, String(u.eleitos)),
        el('td', {cls: 'num'}, pct(u.apurado_pct, 1) || '—'),
        el('td', {}, u.andamento === 'f' ? el('span', {cls: 'tag ok'},
            'encerrada') : u.andamento === 'p' ? el('span', {cls: 'tag info'},
            'em andamento') : el('span', {cls: 'null'}, 'não recebida')))))));
  return el('div', {}, ...out);
}

/* ------------------------------------------------ atualização automática
 *
 * A cada 10 s a visão aberta é refeita e trocada de uma vez, sem o
 * "carregando…" e sem mexer na rolagem: quem está lendo a tabela não é
 * jogado para o topo. Consulta periódica (Fetch), e não SSE ou WebSocket:
 * a própria fonte é consultada periodicamente — o coletor puxa do TSE —,
 * então um canal empurrado pelo servidor não traria o dado antes, e seria
 * mais uma peça para cair na noite.
 *
 * Não atualiza: Telão e Configuração (formulários — apagaria o que se
 * digita), com um campo em foco, com a aba do navegador escondida, ou com
 * a chave desligada. O mapa, que é pesado, a cada 30 s. */
const AUTO = {
  ligado: (() => { try { return localStorage.getItem('auto-atualizar')
                               !== '0'; } catch (e) { return true; } })(),
  ultima: null, rodando: false, ultimoMapa: 0,
};
const VISOES_AUTO = new Set(['resultado', 'mapa', 'projecao',
                             'convergencia', 'auditoria']);

async function atualizarSilencioso() {
  if (!AUTO.ligado || AUTO.rodando || document.hidden) return;
  const visao = st.visao || 'resultado';
  if (!VISOES_AUTO.has(visao)) return;
  const foco = document.activeElement;
  if (foco && /^(INPUT|SELECT|TEXTAREA)$/.test(foco.tagName)) return;
  if (visao === 'mapa' && Date.now() - AUTO.ultimoMapa < 30000) return;
  AUTO.rodando = true;
  try {
    const geracao = renderAtual;
    const fn = escolherVisao();
    const novo = await fn();
    // Outra navegação aconteceu enquanto buscava (aba OU cargo/UF, que
    // passam por render): descarta.
    if ((st.visao || 'resultado') !== visao || geracao !== renderAtual) return;
    const main = document.getElementById('main');
    const abertos = [...main.querySelectorAll('details')].map(x => x.open);
    const y = window.scrollY;
    poe(main, novo);
    [...main.querySelectorAll('details')].forEach((x, i) => {
      if (abertos[i] !== undefined) x.open = abertos[i];
    });
    window.scrollTo(0, y);
    if (visao === 'mapa') AUTO.ultimoMapa = Date.now();
    AUTO.ultima = new Date();
    marcarAuto();
  } catch (e) { /* a próxima volta tenta de novo */ }
  finally { AUTO.rodando = false; }
}

function marcarAuto() {
  const alvo = document.getElementById('auto');
  if (!alvo) return;
  poe(alvo, el('label', {style: 'display:inline-flex;align-items:center;'
      + 'gap:5px;text-transform:none;letter-spacing:0;font-size:11.5px;'
      + 'margin:0;cursor:pointer'},
    el('input', {type: 'checkbox', checked: AUTO.ligado ? '' : null,
      onchange: e => {
        AUTO.ligado = e.target.checked;
        try { localStorage.setItem('auto-atualizar',
                                   AUTO.ligado ? '1' : '0'); } catch (x) {}
        marcarAuto();
      }}),
    'atualizar sozinho',
    AUTO.ligado && document.hidden
      ? el('span', {style: 'color:var(--alerta)'},
           ' · pausado (janela em segundo plano)')
      : AUTO.ligado && AUTO.ultima
        ? el('span', {style: 'color:var(--muted)'}, ' · '
            + AUTO.ultima.toLocaleTimeString('pt-BR')) : null));
}
setInterval(atualizarSilencioso, 10000);
/* Janela em segundo plano não atualiza (o navegador estrangula o tempo e
 * não faz sentido gastar CPU do notebook do telão). Mas voltar a ela tem de
 * trazer o número de agora, não o de quando saiu: sem isto, a tela ficava
 * parada por até 10 s depois do clique e parecia travada — visto no
 * simulado de 23/09, entre reuniões. */
document.addEventListener('visibilitychange', () => {
  marcarAuto();
  if (!document.hidden) atualizarSilencioso();
});

    el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, ROT_REM),
      el('div', {cls: 'v'}, String(d.remanescentes.n)),
      el('div', {cls: 'n'}, d.remanescentes.eleitos_em
        ? 'pelo partido da eleição'
        : d.remanescentes.referencia_em

      + 'lista no lugar.'));

  if (typeof POLITICO !== 'undefined') {

      + 'var(--line);border-radius:var(--radius);padding:10px;'

    caixa.append(POLITICO.hemiciclo(d.cadeiras, {largura: 1000, altura: 540,
      comIdeologia: d.classificacao.estado === 'disponivel', maioria: 41,
      centro: '81', subcentro: 'maioria 41 · 3/5 49'}));
    const leg = POLITICO.legendaEstados([
