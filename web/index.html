<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatório Eleitoral 2026</title>
<style>
/* A versão anterior tinha duas fileiras de pílulas de aparência idêntica
   (3 abas x 6 modos) e ninguém decifrava a matriz. A navegação agora segue a
   ordem em que a pergunta é feita de verdade:

       1. qual CARGO   presidente, governador, senador
       2. ONDE         Brasil, ou a UF que decide a disputa
       3. qual VISÃO   resultado, mapa, projeção, auditoria

   Cada nível tem peso visual próprio, então não se confundem entre si. */
:root{
  --bg:#fff; --fg:#14181f; --muted:#5b6472; --line:#e2e6ec; --linha2:#f0f3f7;
  --panel:#f7f9fb; --acento:#1a5fb4; --proj:#6b3fa0;
  --alerta:#b45309; --erro:#b91c1c; --ok:#15803d;
  --radius:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f1218; --fg:#e8ecf2; --muted:#98a2b0; --line:#252b35; --linha2:#1a1f27;
  --panel:#161b22; --acento:#6aa8f0; --proj:#c4a4ef;
  --alerta:#fbbf24; --erro:#f87171; --ok:#4ade80;
}}
:root[data-theme=dark]{
  --bg:#0f1218; --fg:#e8ecf2; --muted:#98a2b0; --line:#252b35; --linha2:#1a1f27;
  --panel:#161b22; --acento:#6aa8f0; --proj:#c4a4ef;
  --alerta:#fbbf24; --erro:#f87171; --ok:#4ade80;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
 font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 72px}
a{color:var(--acento)}

.topo{border-bottom:1px solid var(--line)}
.marca{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
 padding:16px 0 4px}
.marca h1{font-size:18px;margin:0;letter-spacing:-.01em}
.marca .sub{color:var(--muted);font-size:12px}
.aviso{background:#fff4e5;color:#7c2d12;border:1px solid #fdba74;
 border-radius:8px;padding:9px 13px;margin:8px 0 12px;font-size:12.5px;
 font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .aviso{
 background:#2a1a0a;color:#fcd9a8;border-color:#7c4a11}}

/* nível 1 — cargo: a escolha primária, e por isso a maior */
.cargos{display:flex;flex-wrap:wrap}
.cargos button{background:none;border:0;border-bottom:3px solid transparent;
 padding:10px 2px;margin-right:22px;font:inherit;font-size:16px;
 color:var(--muted);cursor:pointer;letter-spacing:-.01em}
.cargos button[aria-selected=true]{color:var(--fg);font-weight:650;
 border-bottom-color:var(--acento)}

/* nível 2 — onde: trilha leve, não compete com o cargo */
.escopo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
 padding:11px 0;font-size:13px;color:var(--muted)}
.escopo .seta{opacity:.45}
.escopo select{background:var(--bg);color:var(--fg);border:1px solid var(--line);
 border-radius:6px;padding:4px 7px;font:inherit;font-size:13px}
.escopo .fixo{font-weight:600;color:var(--fg)}
/* Enviar para a lista do telão: discreto, mas alcançável de qualquer
 * pesquisa. Fica à direita da trilha, separado por margem automática. */
.escopo .prolista{margin-left:auto;background:var(--panel);
 border:1px solid var(--line);border-radius:999px;padding:5px 13px;
 font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer;
 display:inline-flex;align-items:center;gap:7px}
.escopo .prolista:hover{color:var(--fg);border-color:var(--muted)}
.escopo .prolista.vazio{margin-left:0}
.escopo .prolista .cont{background:var(--proj,#7c5cff);color:#fff;
 border-radius:999px;padding:0 7px;font-size:11px;font-weight:600;
 line-height:17px;min-width:17px;text-align:center}

/* nível 3 — visão: pílulas pequenas */
.visoes{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 18px}
.visoes button{background:var(--panel);border:1px solid var(--line);
 border-radius:999px;padding:5px 13px;font:inherit;font-size:13px;
 color:var(--muted);cursor:pointer}
.visoes button[aria-selected=true]{background:var(--fg);color:var(--bg);
 border-color:var(--fg);font-weight:600}

.resumo{display:grid;gap:9px;margin-bottom:18px;
 grid-template-columns:repeat(auto-fit,minmax(152px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);
 border-radius:var(--radius);padding:10px 12px}
.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
 color:var(--muted)}
.kpi .v{font-size:21px;font-weight:660;font-variant-numeric:tabular-nums;
 margin-top:1px;letter-spacing:-.02em}
.kpi .n{font-size:11px;color:var(--muted);margin-top:1px}

.cards{display:grid;gap:10px;
 grid-template-columns:repeat(auto-fill,minmax(315px,1fr))}
.cand{display:flex;gap:11px;background:var(--panel);border:1px solid var(--line);
 border-radius:var(--radius);padding:11px;align-items:flex-start}
.cand.lider{border-color:var(--acento)}
.cand .foto{width:52px;height:52px;border-radius:50%;object-fit:cover;
 background:var(--linha2);flex:0 0 52px;border:1px solid var(--line)}
.cand .numero{width:52px;height:52px;border-radius:50%;flex:0 0 52px;
 display:flex;align-items:center;justify-content:center;background:var(--linha2);
 border:1px solid var(--line);font-weight:700;font-size:17px;color:var(--muted);
 font-variant-numeric:tabular-nums}
.cand .corpo{min-width:0;flex:1}
.cand .nome{font-weight:640;font-size:14.5px;line-height:1.25;
 overflow-wrap:anywhere}
.cand .meta{font-size:11.5px;color:var(--muted);margin-top:1px}
.cand .votos{display:flex;align-items:baseline;gap:8px;margin-top:5px;
 font-variant-numeric:tabular-nums}
.cand .pct{font-size:19px;font-weight:660;letter-spacing:-.02em}
.cand .abs{font-size:12px;color:var(--muted)}
.cand .barra{height:5px;border-radius:3px;background:var(--linha2);
 margin-top:6px;overflow:hidden}
.cand .barra i{display:block;height:100%;background:var(--acento)}
.cand .selos{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}

.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;
 border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.warn{color:var(--alerta);border-color:var(--alerta)}
.tag.err{color:var(--erro);border-color:var(--erro)}
.tag.info{color:var(--acento);border-color:var(--acento)}
.null{color:var(--muted);font-style:italic}
.nota{background:var(--panel);border-left:3px solid var(--line);
 padding:9px 13px;margin:13px 0;font-size:12.5px;color:var(--muted);
 border-radius:0 7px 7px 0}
.nota b{color:var(--fg)}
.nota.aten{border-left-color:var(--alerta)}
h2{font-size:15px;margin:22px 0 9px;letter-spacing:-.01em}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
 color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--linha2)}
details{margin:12px 0}
summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:5px 0}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;margin:9px 0}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;
 border:1px solid rgba(128,128,128,.35)}
label{display:block;font-size:10.5px;text-transform:uppercase;
 letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
select{background:var(--bg);color:var(--fg);border:1px solid var(--line);
 border-radius:6px;padding:5px 8px;font:inherit;font-size:13px}
.rodape{font-size:11.5px;color:var(--muted);display:flex;gap:14px;
 flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--line);margin-top:22px}
.rodape code{font-size:10.5px}
.estado{padding:34px;text-align:center;color:var(--muted)}
footer{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);
 font-size:11.5px;color:var(--muted)}
@media (max-width:560px){
 .wrap{padding:0 12px 52px}
 .cargos button{font-size:15px;margin-right:14px}
 .cards{grid-template-columns:1fr}
 table{font-size:12.5px} th,td{padding:5px 4px}
 .hide-sm{display:none}
}
</style>
</head>
<body>
<div class="wrap">
<header class="topo">
  <div class="marca">
    <h1>Observatório Eleitoral 2026</h1>
    <span class="sub" id="sub"></span>
  </div>
  <div id="aviso"></div>
  <nav class="cargos" role="tablist" id="cargos"></nav>
</header>
<div class="escopo" id="escopo"></div>
<nav class="visoes" role="tablist" id="visoes"></nav>
<main id="main"><div class="estado">carregando…</div></main>
<div class="rodape" id="meta"></div>
<footer>
  Apuração oficial, projeção e definição matemática são três coisas distintas
  e nunca se somam no mesmo número. Liderar um território não é ser eleito por
  ele: presidente é decidido no Brasil, governador e senador em cada UF.
</footer>
</div>

<script src="/mapa.js"></script>
<script>
const API = '/api/v1';
const fmt = n => n == null ? '—' : n.toLocaleString('pt-BR');
const pct = (v, d = 2) => v == null ? null
  : v.toFixed(d).replace('.', ',') + '%';
const brt = s => s ? new Date(s).toLocaleString('pt-BR',
  {timeZone: 'America/Sao_Paulo'}) : '—';

const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (v == null) continue;
    if (k === 'cls') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null)
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
};
// replaceChildren insere a string "null" se receber null; el() os descarta.
const poe = (alvo, ...kids) => alvo.replaceChildren(
  ...kids.flat().filter(x => x != null));

const CARGOS = [
  {cd: '1', nome: 'Presidente', abr: 'br', vagas: 1},
  {cd: '3', nome: 'Governador', abr: 'uf', vagas: 1},
  {cd: '5', nome: 'Senador', abr: 'uf', vagas: 2},
];
const VISOES = [
  {id: 'resultado', nome: 'Resultado'},
  {id: 'mapa', nome: 'Mapa'},
  {id: 'projecao', nome: 'Projeção'},
  {id: 'convergencia', nome: 'Convergência'},
  {id: 'auditoria', nome: 'Auditoria'},
  {id: 'telao', nome: 'Telão'},
];
const UFS = ['ac','al','ap','am','ba','ce','df','es','go','ma','mt','ms','mg',
             'pa','pb','pr','pe','pi','rj','rn','rs','ro','rr','sc','sp','se',
             'to'];

// §4.7: "projetado", "matematicamente definido" e "eleito segundo TSE" são
// rótulos distintos e nunca se fundem. Este mapa cobre só o do meio.
const DEF = {
  matematicamente_eleito: {cls: 'ok', txt: 'definido matematicamente'},
  matematicamente_no_segundo_turno: {cls: 'info', txt: '2º turno garantido'},
  matematicamente_eliminado: {cls: '', txt: 'sem chance aritmética'},
  em_aberto: null,
};

// Estado na URL (§5.1): recarregar ou compartilhar preserva o recorte.
const st = new Proxy({}, {
  get: (_, k) => new URLSearchParams(location.search).get(k),
  set: (_, k, v) => {
    const u = new URLSearchParams(location.search);
    (v == null || v === '') ? u.delete(k) : u.set(k, v);
    history.replaceState(null, '', location.pathname + '?' + u);
    render();
    return true;
  },
});
const cargoAtual = () => CARGOS.find(c => c.cd === (st.cargo || '1'));

/* Telão: esta janela conduz a projeção. BroadcastChannel liga as duas
 * janelas do mesmo navegador sem passar pelo servidor, então trocar de cargo
 * aqui muda a projeção na hora. Se esta janela fechar, o telão mantém o
 * último recorte e segue atualizando sozinho. */
let canalTelao = null;
try { canalTelao = new BroadcastChannel('observatorio-telao'); }
catch (e) { /* navegador sem suporte: o telão fica autônomo */ }

/* Último recorte enviado, para não reenviar o mesmo.
 *
 * Importa porque no telão um comando de recorte **interrompe o carrossel** —
 * é o comportamento certo quando alguém troca de UF de propósito, e é
 * destrutivo quando a janela apenas se redesenhou. Editar o tempo de uma
 * tela na lista redesenha o painel; sem este guarda, isso apagaria do telão
 * a lista que estava sendo editada. */
let ultimoRecorte = null;

function conduzirTelao() {
  if (!canalTelao) return;
  const r = {cargo: st.cargo || '1', uf: st.uf || null,
             camada: st.camada || 'definicao'};
  const chave = JSON.stringify(r);
  if (chave === ultimoRecorte) return;
  // Com a lista em uso, quem manda no telão é ela: navegar pelas pesquisas
  // não pode derrubar a sequência que o operador montou.
  if (LISTA.ativa) { ultimoRecorte = chave; return; }
  ultimoRecorte = chave;
  canalTelao.postMessage({tipo: 'recorte', recorte: r});
}

function abrirTelao() {
  const q = new URLSearchParams({
    cargo: st.cargo || '1', camada: st.camada || 'definicao',
  });
  if (st.uf) q.set('uf', st.uf);
  window.open('/telao?' + q, 'telao-observatorio');
}

function comandarTelao(acao, indice) {
  if (!canalTelao) return;
  canalTelao.postMessage({tipo: 'comando', acao, indice});
}

/* --------------------------------------------- lista da sessão do telão
 *
 * Durante a apuração uma disputa esquenta e o roteiro do arquivo deixa de
 * servir. Parar, editar YAML e recarregar, com o projetor ligado na sala,
 * não é opção. Daqui o operador monta a sequência enquanto pesquisa: achou
 * algo que merece ir ao telão, clica em "enviar para a lista".
 *
 * A lista vive no navegador, não no servidor. **Não existe endpoint que
 * grave o roteiro** — o §10 manda separar administração autenticada de
 * leitura pública, e uma rota de escrita aberta seria o contrário disso.
 * Então a lista é do operador, e o arquivo continua sendo a base
 * versionada.
 *
 * Para que uma boa sequência improvisada não morra quando o navegador
 * fechar, existe "copiar como YAML": o texto vai para a área de
 * transferência pronto para colar em `config/telao.yaml`. É também o único
 * jeito de a lista chegar à captura de imagens, que lê o arquivo — nada que
 * sai do navegador depende do que só existe dentro dele.
 */
const LISTA = {
  itens: [],
  ativa: false,
  ler() {
    try {
      this.itens = JSON.parse(localStorage.getItem('telao-lista') || '[]');
      this.ativa = localStorage.getItem('telao-lista-ativa') === '1';
    } catch (e) { this.itens = []; this.ativa = false; }
    if (!Array.isArray(this.itens)) this.itens = [];
    return this.itens;
  },
  salvar() {
    try {
      localStorage.setItem('telao-lista', JSON.stringify(this.itens));
      localStorage.setItem('telao-lista-ativa', this.ativa ? '1' : '0');
    } catch (e) { /* sem armazenamento: a lista vale só nesta janela */ }
    if (this.ativa) this.enviar();
  },
  titulo(it) {
    const c = CARGOS.find(x => x.cd === it.cargo) || CARGOS[0];
    return `${c.nome} — ${it.uf ? it.uf.toUpperCase() : 'Brasil'}`;
  },
  /* Forma que o telão consome — a mesma que a API devolve, para os dois
   * caminhos caírem no mesmo código de exibição. */
  resolvidas() {
    return this.itens.map((it, i) => ({
      indice: i, titulo: this.titulo(it), cargo: it.cargo,
      cargo_nome: (CARGOS.find(x => x.cd === it.cargo) || {}).nome,
      uf: it.uf || null, municipio: null, municipio_nome: null,
      camada: it.camada || 'definicao', segundos: it.segundos || 20,
      recorte_nao_decisorio: false, aviso_recorte: null, erro: null,
    }));
  },
  enviar() {
    if (!canalTelao) return false;
    canalTelao.postMessage({tipo: 'roteiro', roteiro: this.resolvidas(),
                            daSessao: true});
    return true;
  },
  add(it) {
    this.ler();
    this.itens.push(it);
    this.salvar();
  },
  yaml() {
    const l = ['# Colado de "copiar como YAML" no painel.',
               'padrao_segundos: 20',
               'camada_padrao: definicao',
               'roteiro:'];
    const nomes = {1: 'presidente', 3: 'governador', 5: 'senador'};
    for (const it of this.itens) {
      l.push(`  - {cargo: ${nomes[it.cargo]}`
        + (it.uf ? `, uf: ${it.uf}` : '')
        + `, camada: ${it.camada || 'definicao'}`
        + `, segundos: ${it.segundos || 20}}`);
    }
    return l.join('\n') + '\n';
  },
};
LISTA.ler();

function enviarParaLista() {
  const cargo = cargoAtual();
  if (cargo.abr === 'uf' && !st.uf) {
    alert(`${cargo.nome} é decidido em cada estado. Escolha a UF antes de `
        + 'mandar para a lista.');
    return;
  }
  LISTA.add({cargo: cargo.cd, uf: st.uf || null,
             camada: st.camada || 'definicao', segundos: 20});
  navegacao();
}

/* A lista montada nesta sessão: montar, reordenar, cronometrar e mandar ao
 * telão sem tocar no arquivo nem parar a projeção. */
function blocoLista(roteiroArquivo) {
  LISTA.ler();
  const itens = LISTA.itens;
  const mexeu = () => { LISTA.salvar(); render(); };

  if (!itens.length) {
    return el('div', {cls: 'nota'},
      el('b', {}, 'Lista desta sessão. '),
      'Vazia. Em qualquer pesquisa, "＋ enviar para a lista do telão" '
      + 'acrescenta o recorte que estiver na tela. Serve para montar a '
      + 'sequência durante a apuração, quando o roteiro do arquivo deixa de '
      + 'dar conta.');
  }

  const total = itens.reduce((s, it) => s + (it.segundos || 20), 0);
  const cab = el('div', {cls: 'visoes'},
    el('button', {
      onclick: () => {
        LISTA.ativa = !LISTA.ativa;
        if (LISTA.ativa) { LISTA.salvar(); }
        else {
          LISTA.salvar();
          // Voltar ao arquivo é explícito: o telão não adivinha que a lista
          // saiu de cena.
          if (canalTelao) canalTelao.postMessage(
            {tipo: 'roteiro', roteiro: roteiroArquivo.dados, daSessao: false});
        }
        render();
      },
      style: LISTA.ativa
        ? 'border-color:var(--proj,#7c5cff);color:var(--fg)' : null,
    }, LISTA.ativa ? '● em uso no telão — voltar ao arquivo'
                   : '▸ usar esta lista no telão'),
    el('button', {
      onclick: async () => {
        try {
          await navigator.clipboard.writeText(LISTA.yaml());
          alert('YAML na área de transferência. Cole em config/telao.yaml '
              + 'para a lista virar permanente — e para a captura de '
              + 'imagens enxergá-la, já que ela lê o arquivo.');
        } catch (e) { prompt('Copie o YAML:', LISTA.yaml()); }
      },
      title: 'A lista só existe neste navegador. Colada no arquivo, ela '
           + 'passa a valer para todos e fica versionada.',
    }, 'copiar como YAML'),
    el('button', {
      onclick: () => {
        if (!confirm(`Apagar as ${itens.length} telas da lista?`)) return;
        LISTA.itens = []; LISTA.ativa = false; mexeu();
      },
    }, 'limpar lista'));

  const botao = (txt, acao, titulo) => el('button', {
    style: 'font-size:11px;padding:2px 8px;border-radius:6px;'
         + 'border:1px solid var(--line);background:var(--panel);'
         + 'color:var(--muted);cursor:pointer;margin-right:4px',
    onclick: acao, title: titulo || '',
  }, txt);

  const tabela = el('table', {},
    el('thead', {}, el('tr', {}, el('th', {}, '#'), el('th', {}, 'Tela'),
      el('th', {}, 'Camada'), el('th', {cls: 'num'}, 'Tempo'),
      el('th', {}, ''))),
    el('tbody', {}, ...itens.map((it, i) => el('tr', {},
      el('td', {}, String(i + 1)),
      el('td', {}, LISTA.titulo(it)),
      el('td', {}, el('select', {
        onchange: e => { it.camada = e.target.value; mexeu(); },
      }, ...['definicao', 'lider', 'margem', 'cobertura'].map(c =>
        el('option', {value: c,
                      selected: (it.camada || 'definicao') === c ? '' : null},
           c)))),
      el('td', {cls: 'num'}, el('input', {
        type: 'number', min: '5', max: '300',
        value: String(it.segundos || 20),
        style: 'width:58px;background:var(--bg);color:var(--fg);'
             + 'border:1px solid var(--line);border-radius:6px;padding:3px 6px;'
             + 'font:inherit;font-size:12px;text-align:right',
        onchange: e => {
          // Tela de 2 s não é tela: ninguém lê um mapa nesse tempo. O telão
          // já impõe o piso de 5 s; aqui o operador vê o piso acontecer.
          it.segundos = Math.max(5, Math.min(300,
            parseInt(e.target.value, 10) || 20));
          mexeu();
        },
      }), ' s'),
      el('td', {},
        botao('▲', () => {
          if (i === 0) return;
          [itens[i - 1], itens[i]] = [itens[i], itens[i - 1]]; mexeu();
        }, 'subir'),
        botao('▼', () => {
          if (i === itens.length - 1) return;
          [itens[i + 1], itens[i]] = [itens[i], itens[i + 1]]; mexeu();
        }, 'descer'),
        botao('ir para', () => comandarTelao('ir', i),
              LISTA.ativa ? 'Salta para esta tela no telão'
                          : 'Só funciona com a lista em uso no telão'),
        botao('✕', () => { itens.splice(i, 1); mexeu(); }, 'remover'))))));

  return el('div', {},
    el('h3', {style: 'margin:22px 0 4px;font-size:15px'},
      `Lista desta sessão · ${itens.length} tela(s) · `
      + `${Math.floor(total / 60)}min ${total % 60}s`),
    el('div', {cls: 'nota', style: 'margin:0 0 10px'},
      LISTA.ativa
        ? 'Em uso no telão agora. O roteiro do arquivo volta quando você '
          + 'clicar em "voltar ao arquivo" — a releitura periódica do '
          + 'arquivo não derruba a lista no meio da apuração.'
        : 'Montada, mas o telão ainda está no roteiro do arquivo.'),
    cab, tabela,
    el('div', {cls: 'nota aten'},
      el('b', {}, 'A lista vive neste navegador. '),
      'Não existe rota que grave o roteiro no servidor — administração com '
      + 'escrita aberta a qualquer um seria o oposto do §10. Consequências '
      + 'práticas: outra máquina não vê esta lista, e a captura de imagens '
      + '(`obs2026 compartilhar`) lê o arquivo, não daqui. Para que valha '
      + 'em todo lugar, "copiar como YAML" e colar em config/telao.yaml.'));
}

  out.push(blocoLista(r));

  out.push(el('table', {},
    el('thead', {}, el('tr', {}, el('th', {}, '#'), el('th', {}, 'Tela'),
      el('th', {}, 'Cargo'), el('th', {}, 'Onde'), el('th', {}, 'Camada'),
      el('th', {cls: 'num'}, 'Tempo'), el('th', {}, ''))),
    el('tbody', {}, ...r.dados.map((t, i) => el('tr', {},
      el('td', {}, String(i + 1)),

        t.recorte_nao_decisorio

              title: t.aviso_recorte}, 'recorte não decisório')]

      el('td', {}, t.municipio_nome

        : el('button', {
            style: 'font-size:11px;padding:2px 9px;border-radius:999px;'
                 + 'border:1px solid var(--line);background:var(--panel);'
                 + 'color:var(--muted);cursor:pointer',
            onclick: () => comandarTelao('ir', validas.indexOf(t)),
          }, 'ir para')))))));

  const ruins = r.dados.filter(t => t.erro);
  if (ruins.length) {
    out.push(el('div', {cls: 'nota aten'},
      el('b', {}, 'Telas que não resolveram. '),
      'O telão pula estas: projetar o município errado é pior do que pular a '
      + 'tela. ',
      ...ruins.map(t => el('div', {}, `· ${t.titulo}: ${t.erro}`))));
  }
  out.push(el('div', {cls: 'nota'}, el('b', {}, 'Como operar. '),

async function get(p) {
  const r = await fetch(API + p);
  if (!r.ok) throw new Error(`${r.status} em ${p}`);
  return r.json();
}

/* ------------------------------------------------------------ resultado */

function kpis(u, def) {
  const e = u.eleitorado, v = u.votos, s = u.secoes;
  const cob = e.total ? 100 * e.apurado / e.total : null;
  const cards = [
    ['Eleitorado apurado', pct(cob) || '—',
     `${fmt(e.apurado)} de ${fmt(e.total)}`],
    ['Seções totalizadas', fmt(s.totalizadas),
     `de ${fmt(s.total)} · ${s.total ? pct(100*s.totalizadas/s.total,1) : '—'}`],
    ['Comparecimento', pct(e.comparecimento_pct) || '—',
     'sobre o eleitorado já apurado'],
    ['Votos a concorrentes', fmt(v.validos_computados),
     `brancos ${fmt(v.brancos)} · nulos ${fmt(v.nulos)}`],
  ];
  if (u.pendente.max > 0) {
    cards.push(['Ainda podem entrar',
      u.pendente.ambiguo ? `${fmt(u.pendente.min)}–${fmt(u.pendente.max)}`
                         : fmt(u.pendente.max),
      u.pendente.ambiguo
        ? 'intervalo: o contrato não separa não-totalizado de não-instalado'
        : 'eleitores']);
  } else if (def) {
    cards.push(['Situação',
      def.disputa_matematicamente_definida ? 'disputa definida'
      : def.segundo_turno_matematicamente_definido ? '2º turno definido'
      : def.sub_judice_em_jogo ? 'suspensa (sub judice)' : 'em aberto',
      def.encerrada ? 'apuração encerrada' : 'apuração em andamento']);
  }
  return el('div', {cls: 'resumo'}, ...cards.map(([k, v2, n]) =>
    el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, k),
       el('div', {cls: 'v'}, v2), el('div', {cls: 'n'}, n))));
}

function cartao(c, i, maxPct, estados) {
  const o = c.oficial, p = c.enriquecimento;
  const est = estados[o.sqcand];
  const d = est ? DEF[est.estado] : null;
  const retrato = p && p.foto_url
    ? el('img', {cls: 'foto', src: p.foto_url, alt: '', loading: 'lazy'})
    : el('div', {cls: 'numero', 'aria-hidden': 'true'}, o.numero);

  const selos = [];
  if (o.eleito_segundo_tse === true)
    selos.push(el('span', {cls: 'tag ok'}, 'eleito segundo TSE'));
  else if (o.situacao)
    selos.push(el('span', {cls: 'tag'}, o.situacao));
  if (d) selos.push(el('span', {cls: 'tag ' + d.cls,
    title: est.motivo || ''}, d.txt));
  if (o.destinacao_voto !== 'Válido')
    selos.push(el('span', {cls: 'tag warn',
      title: 'Destinação oficial do voto'}, o.destinacao_voto));
  if (p && !p.juncao_confiavel)
    selos.push(el('span', {cls: 'tag',
      title: 'Correspondência por número e partido, ainda não confirmada por '
           + 'código oficial'}, 'perfil a confirmar'));

  const larg = maxPct > 0 && o.pct != null ? 100 * o.pct / maxPct : 0;
  return el('div', {cls: 'cand' + (i === 0 ? ' lider' : '')},
    retrato,
    el('div', {cls: 'corpo'},
      el('div', {cls: 'nome'}, (p && p.nome) || o.nome_urna),
      el('div', {cls: 'meta'},
        o.partido,
        p && p.vice_nome ? ` · vice ${p.vice_nome}` : '',
        p && p.profissao ? ` · ${p.profissao}` : ''),
      el('div', {cls: 'votos'},
        el('span', {cls: 'pct'}, o.pct == null
          ? el('span', {cls: 'null',
                        title: o.pct_indisponivel_motivo || ''}, 'n/d')
          : pct(o.pct)),
        el('span', {cls: 'abs'}, fmt(o.votos) + ' votos')),
      el('div', {cls: 'barra'},
        el('i', {style: `width:${Math.max(0, Math.min(100, larg))}%`})),
      selos.length ? el('div', {cls: 'selos'}, ...selos) : null,
      p && p.perfil_url
        ? el('div', {cls: 'meta', style: 'margin-top:5px'},
            el('a', {href: p.perfil_url, target: '_blank', rel: 'noopener'},
               'perfil, bens e contas ↗'))
        : null));
}

async function viewResultado() {
  const cargo = cargoAtual();
  if (cargo.abr === 'uf' && !st.uf) {
    return el('div', {cls: 'estado'},
      `Escolha uma UF acima. ${cargo.nome} é decidido em cada estado, `
      + 'não no total nacional.');
  }
  const qs = `cargo=${cargo.cd}` + (st.uf ? `&uf=${st.uf}` : '');
  const [res, cands, def] = await Promise.all([
    get(`/results?abrangencia=${cargo.abr}&${qs}`),
    get(`/candidates?${qs}`),
    get(`/decided?${qs}`).catch(() => null),
  ]);
  rodape(res);
  if (!res.dados.length) {
    return el('div', {cls: 'estado'}, res.status_motivo || 'sem dados');
  }

  const u = res.dados[0];
  const bloco = cands.dados[0];
  const dfn = def && def.dados && def.dados[0];
  const estados = {};
  if (dfn) for (const c of dfn.candidatos) estados[c.sqcand] = c;

  const lista = ((bloco && bloco.candidatos) || [])
    .slice().sort((a, b) => b.oficial.votos - a.oficial.votos);
  const maxPct = Math.max(...lista.map(c => c.oficial.pct || 0), 0);

  const out = [kpis(u, dfn)];

  if (dfn && dfn.sub_judice_em_jogo) {
    out.push(el('div', {cls: 'nota aten'},
      el('b', {}, 'Definição matemática suspensa. '),
      dfn.avisos[0] || 'há votos sub judice em jogo.'));
  }
  if (dfn && dfn.disputa_matematicamente_definida) {
    out.push(el('div', {cls: 'nota'},
      el('b', {}, 'Disputa matematicamente definida. '),
      'Nenhuma distribuição possível dos votos que faltam muda o resultado. '
      + 'Isto não é proclamação — essa é do TSE.'));
  } else if (dfn && dfn.segundo_turno_matematicamente_definido) {
    out.push(el('div', {cls: 'nota'},
      el('b', {}, 'Segundo turno matematicamente definido. '),
      'Os dois nomes já não podem mudar, mas ninguém tem maioria absoluta '
      + 'garantida.'));
  }

  out.push(el('div', {cls: 'cards'},
    ...lista.map((c, i) => cartao(c, i, maxPct, estados))));

  const en = cands.enriquecimento || {};
  out.push(el('div', {cls: 'nota'},
    el('b', {}, 'De onde vem cada coisa. '),
    'Votos, destinação e situação vêm do TSE. Foto, vice e perfil vêm de ',
    el('a', {href: 'https://eleicoes.osidosos.com.br', target: '_blank',
             rel: 'noopener'}, 'eleicoes.osidosos.com.br'),
    ' (dados abertos, MIT). ',
    en.casados
      ? `${en.casados} de ${en.total_candidatos} candidatos com perfil, `
        + `${en.casados_por_codigo_oficial} deles por código oficial.`
      : (en.aviso || en.erro
         || 'Nenhum perfil correspondeu: no ambiente de simulado os '
          + 'candidatos são fictícios.')));

  out.push(detalhesTecnicos(res, u));
  return el('div', {}, ...out);
}

function detalhesTecnicos(res, u) {
  const v = u.votos;
  const linhas = [
    ['Votos a concorrentes (vvc)', v.validos_computados,
     'válidos + anulados + sub judice — base da maioria absoluta'],
    ['Votos válidos (vv)', v.validos, 'só destinação "Válido"'],
    ['Votos nominais (Σ vap)', v.nominal_tse,
     'soma dos votos de candidatos — é o denominador que o TSE exibe'],
    ['Anulados', v.anulados, ''],
    ['Anulados sub judice', v.anulados_sub_judice, ''],
    ['Brancos', v.brancos, ''],
    ['Nulos', v.nulos, ''],
    ['Total de votos (tv)', v.total, 'no Senado chega a 2x o comparecimento'],
  ];
  return el('details', {},
    el('summary', {}, 'Denominadores e definições técnicas'),
    el('div', {cls: 'nota'},
      el('b', {}, 'Os percentuais desta tela usam '), res.denominador.rotulo,
      '. O TSE exibe percentual sobre votos nominais, que é outro número, e '
      + 'não é o que decide o primeiro turno.'),
    el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, 'Medida'),
        el('th', {cls: 'num'}, 'Votos'),
        el('th', {cls: 'hide-sm'}, 'O que é'))),
      el('tbody', {}, ...linhas.map(([k, n, nota]) => el('tr', {},
        el('td', {}, k), el('td', {cls: 'num'}, fmt(n)),
        el('td', {cls: 'hide-sm'}, el('span', {cls: 'null'}, nota)))))));
}

async function viewMapa() {
  const cargo = cargoAtual();
  const abr = st.detalhe === 'mu' ? 'mu' : 'uf';
  const uf = (abr === 'mu' && st.uf) ? `&uf=${st.uf}` : '';
  const m = await get(
    `/map-layers?cargo=${cargo.cd}&abrangencia=${abr}${uf}`);
  rodape(m);
  if (!m.dados.length) {
    return el('div', {cls: 'estado'}, m.status_motivo || 'sem dados');
  }

  const camadaId = st.camada || 'definicao';
  const camada = MAPA.CAMADAS[camadaId];
  const wrap = el('div', {});

  wrap.append(el('div', {cls: 'visoes'},
    ...Object.entries(MAPA.CAMADAS).map(([id, c]) => el('button', {
      'aria-selected': String(id === camadaId),
      onclick: () => { st.camada = id; },
    }, c.rotulo)),
    el('button', {
      'aria-selected': 'false', disabled: '',
      title: 'Classificação ideológica pendente de curadoria com autoria',
      style: 'opacity:.45;cursor:not-allowed',
    }, 'Bloco ideológico'),
    el('button', {
      'aria-selected': String(abr === 'mu'),
      onclick: () => { st.detalhe = abr === 'mu' ? '' : 'mu'; },
    }, abr === 'mu' ? '◂ voltar a estados' : 'ver municípios')));

  wrap.append(el('div', {cls: 'nota'}, el('b', {}, camada.rotulo + '. '),
                 camada.nota));

  const caixa = el('div', {style: 'background:var(--panel);border:1px solid '
    + 'var(--line);border-radius:var(--radius);padding:5px'});
  caixa.append(el('div', {cls: 'estado'}, 'desenhando o mapa…'));
  const barra = el('div', {style: 'margin-top:13px'});
  const pe = el('div', {});
  wrap.append(caixa, barra, pe);

  (async () => {
    try {
      const r = await MAPA.desenhar(caixa, m.dados, {
        malha: m.malha, camada: camadaId, recorte: m.recorte_ibge,
        largura: 760, altura: abr === 'mu' ? 640 : 540,
        aoClicar: d => {
          if (abr === 'uf' && cargoAtual().abr === 'uf') {
            st.uf = d.uf; st.visao = 'resultado';
          } else if (abr === 'uf') { st.uf = d.uf; st.detalhe = 'mu'; }
        },
      });
      poe(pe,
        MAPA.legenda(r.camada, r.ctx, m.dados),
        el('div', {cls: 'nota'}, el('b', {}, 'Área não é eleitorado. '),
           m.aviso_cartografico),
        el('div', {cls: 'nota'},
           `${fmt(m.dados.length)} territórios com dado`
           + (r.semDado ? ` · ${fmt(r.semDado)} sem dado (hachura)` : '')),
        m.nota_territorial
          ? el('div', {cls: 'nota'}, el('b', {}, 'Atenção. '),
               m.nota_territorial) : null,
        m.quality_flags && m.quality_flags.length
          ? el('div', {cls: 'nota aten'},
               el('b', {}, 'Divergência territorial. '),
               m.quality_flags.join(' · ')) : null,
        tabelaMapa(m, r.camada, r.ctx));
      poe(barra,
        el('label', {}, 'Mesma informação, ponderada por eleitores'),
        MAPA.barraPonderada(m.dados, r.camada, r.ctx));
    } catch (e) {
      poe(caixa, el('div', {cls: 'estado'},
        el('span', {cls: 'tag err'}, 'erro no mapa'), ' ' + e.message));
    }
  })();
  return wrap;
}

function tabelaMapa(m, camada, ctx) {
  const linhas = [...m.dados].sort((a, b) => b.eleitorado - a.eleitorado);
  return el('details', {open: m.abrangencia === 'uf' ? '' : null},
    el('summary', {}, `Tabela equivalente (${fmt(linhas.length)} territórios)`),
    el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, 'Território'),
        el('th', {}, 'UF'), el('th', {cls: 'num'}, 'Eleitorado'),
        el('th', {}, camada.rotulo), el('th', {}, 'Líder'),
        el('th', {cls: 'num'}, 'Margem'), el('th', {cls: 'num'}, 'Apurado'))),

/* --------------------------------------------------------- convergência */

/* Gráfico de convergência. SVG inline, sem biblioteca: um gráfico de linha
 * com faixa é pouca geometria, e uma dependência externa numa tela que vai
 * ao ar na noite da apuração é risco sem retorno.
 *
 * Leitura: apurado em linha cheia, projetado em tracejado com faixa de 80%.
 * O par cheio/tracejado importa — a leitura não pode depender só de cor. */
function grafConvergencia(cand) {
  const W = 680, H = 210, ml = 48, mr = 12, mt = 10, mb = 26;
  const pts = cand.pontos.filter(p => p.pct_projetado != null);
  if (pts.length < 2) {
    return el('div', {cls: 'nota'},
      'série curta demais para um gráfico: ' + pts.length + ' ponto(s).');
  }

  const ys = [];
  for (const p of pts) {
    ys.push(p.pct_q100, p.pct_q900, p.pct_projetado);
    if (p.pct_apurado != null) ys.push(p.pct_apurado);
  }
  if (cand.pct_final != null) ys.push(cand.pct_final);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const folga = Math.max(0.4, (y1 - y0) * 0.14);
  y0 -= folga; y1 += folga;

  const X = c => ml + (Math.max(0, Math.min(100, c)) / 100) * (W - ml - mr);
  const Y = v => mt + (1 - (v - y0) / (y1 - y0 || 1)) * (H - mt - mb);
  const S = (t, a = {}) => {
    const n = document.createElementNS('http://www.w3.org/2000/svg', t);
    for (const [k, v] of Object.entries(a)) if (v != null) n.setAttribute(k, v);
    return n;
  };

  const svg = S('svg', {viewBox: '0 0 ' + W + ' ' + H, width: '100%',
    role: 'img', style: 'max-width:100%;height:auto;display:block',
    'aria-label': 'Convergência de ' + cand.nome});

  for (const v of [y0, (y0 + y1) / 2, y1]) {
    svg.append(S('line', {x1: ml, x2: W - mr, y1: Y(v), y2: Y(v),
      stroke: 'var(--line)', 'stroke-width': 1}));
    const t = S('text', {x: ml - 6, y: Y(v) + 3, 'text-anchor': 'end',
      'font-size': 10, fill: 'var(--muted)'});
    t.textContent = v.toFixed(1).replace('.', ',') + '%';
    svg.append(t);
  }
  for (const c of [0, 25, 50, 75, 100]) {
    const t = S('text', {x: X(c), y: H - 8, 'text-anchor': 'middle',
      'font-size': 10, fill: 'var(--muted)'});
    t.textContent = c + '%';
    svg.append(t);
  }
  const rot = S('text', {x: ml, y: H - 8, 'text-anchor': 'start',
    'font-size': 9, fill: 'var(--muted)', opacity: 0});
  svg.append(rot);

  const cima = pts.map(p => X(p.cobertura_pct) + ',' + Y(p.pct_q900));
  const baixo = pts.slice().reverse()
    .map(p => X(p.cobertura_pct) + ',' + Y(p.pct_q100));
  svg.append(S('polygon', {points: cima.concat(baixo).join(' '),
    fill: 'var(--proj)', opacity: 0.22}));

  if (cand.pct_final != null) {
    svg.append(S('line', {x1: ml, x2: W - mr,
      y1: Y(cand.pct_final), y2: Y(cand.pct_final),
      stroke: 'var(--fg)', 'stroke-width': 1, 'stroke-dasharray': '1 4',
      opacity: 0.5}));
  }

  const linha = (campo, cor, tracejado, largura) => {
    const d = pts.filter(p => p[campo] != null)
      .map((p, i) => (i ? 'L' : 'M') + X(p.cobertura_pct) + ' '
           + Y(p[campo])).join(' ');
    return S('path', {d, fill: 'none', stroke: cor,
      'stroke-width': largura || 2,
      'stroke-linejoin': 'round', 'stroke-dasharray': tracejado});
  };
  // Projetado primeiro, por baixo; apurado por cima e mais grosso: o
  // apurado e fato, a projecao e estimativa, e a hierarquia visual diz isso.
  svg.append(linha('pct_projetado', 'var(--proj)', '7 4', 2));
  svg.append(linha('pct_apurado', 'var(--acento)', null, 2.6));

  for (const p of pts) {
    if (p.pct_apurado == null) continue;
    const c = S('circle', {cx: X(p.cobertura_pct), cy: Y(p.pct_apurado),
      r: 2.5, fill: 'var(--acento)'});
    const t = S('title');
    t.textContent = p.cobertura_pct.toFixed(1) + '% apurado\n'
      + 'contado: ' + p.pct_apurado.toFixed(2) + '%\n'
      + 'projetado: ' + p.pct_projetado.toFixed(2) + '% ('
      + p.pct_q100.toFixed(1) + '–' + p.pct_q900.toFixed(1) + ')';
    c.append(t);
    svg.append(c);
  }
  return svg;
}

function legendaConvergencia() {
  const item = (estilo, txt) => el('span', {},
    el('i', {cls: 'sw', style: estilo}), txt);
  return el('div', {cls: 'legend'},
    item('background:var(--acento)', 'apurado (linha cheia)'),
    item('background:var(--proj)', 'projetado (tracejado)'),
    item('background:var(--proj);opacity:.3', 'intervalo de 80%'),
    item('background:var(--fg);opacity:.5', 'resultado final'));
}

async function viewConvergencia() {
  const amb = st.diario ? 'ambiente=' + st.diario + '&' : '';
  const d = await get('/convergencia?' + amb + 'top=4');
  rodape(d);
  const cabeca = [
    el('div', {cls: 'visoes'},
      el('button', {'aria-selected': String(!st.diario),
        onclick: () => { st.diario = ''; }}, 'Apuração real'),
      el('button', {
        'aria-selected': String(st.diario === 'ensaio-simulado2026'),
        title: 'Série produzida por "obs2026 ensaiar-auditoria", com ordem '
             + 'de chegada sintética',
        onclick: () => { st.diario = 'ensaio-simulado2026'; }}, 'Ensaio')),
  ];
  if (!d.dados.length) {
    return el('div', {}, ...cabeca,
      el('div', {cls: 'estado'}, d.status_motivo || 'sem registros'));
  }
  const out = [
    ...cabeca,
    el('div', {cls: 'nota'}, el('b', {}, 'O que este gráfico responde. '),
       d.nota),
    legendaConvergencia(),
  ];

  for (const s2 of d.dados) {
    out.push(el('h2', {}, s2.serie));
    out.push(el('div', {cls: 'nota'},
      s2.execucoes + ' projeções registradas · cobertura de '
      + pct(s2.cobertura_min, 1) + ' a ' + pct(s2.cobertura_max, 1)
      + ' · modelo ', el('code', {}, s2.model_version),
      s2.encerrada ? ' · disputa encerrada' : ' · apuração em andamento',
      s2.dispersao_fonte_max_s != null && s2.dispersao_fonte_max_s > 0
        ? ` · dispersão máxima da fonte: `
          + `${Math.round(s2.dispersao_fonte_max_s / 60)} min`
        : ''));

    for (const cand of s2.candidatos) {
      out.push(el('div', {style: 'margin:14px 0'},
        el('div', {style: 'display:flex;justify-content:space-between;'
                 + 'align-items:baseline;gap:10px;flex-wrap:wrap'},
          el('b', {}, cand.nome),
          el('span', {style: 'font-size:12px;color:var(--muted)'},
            cand.pct_final != null ? 'final ' + pct(cand.pct_final) : '',
            cand.distancia_final_pp != null
              ? ' · distância no último ponto: '
                + cand.distancia_final_pp.toFixed(2).replace('.', ',') + ' pp'
              : '')),
        grafConvergencia(cand)));
    }

    out.push(el('details', {},
      el('summary', {}, 'Tabela equivalente'),
      el('table', {},
        el('thead', {}, el('tr', {}, el('th', {}, 'Candidato'),
          el('th', {cls: 'num'}, 'Cobertura'),
          el('th', {cls: 'num'}, 'Apurado'),
          el('th', {cls: 'num'}, 'Projetado'),
          el('th', {cls: 'num'}, 'Faixa 80%'), el('th', {}, 'Estado'))),
        el('tbody', {}, ...s2.candidatos.flatMap(cand =>
          cand.pontos.map(p => el('tr', {},
            el('td', {}, cand.nome),
            el('td', {cls: 'num'}, pct(p.cobertura_pct, 1)),
            el('td', {cls: 'num'}, p.pct_apurado == null
              ? el('span', {cls: 'null'}, 'n/d') : pct(p.pct_apurado)),
            el('td', {cls: 'num'}, pct(p.pct_projetado)),
            el('td', {cls: 'num'}, p.pct_q100.toFixed(1) + '–'
              + p.pct_q900.toFixed(1)),
            el('td', {}, el('span', {cls: 'tag'}, p.estado_publicacao)))))))));
  }
  out.push(el('div', {cls: 'nota'}, el('b', {}, 'Nada é recalculado. '),
    d.aviso));
  out.push(el('div', {cls: 'nota'},
    el('b', {}, 'Por que não esperamos "terminar de carregar". '),
    d.nota_dispersao));
  return el('div', {}, ...out);
}

/* ------------------------------------------------------------ auditoria */

async function viewAuditoria() {
  const d = await get('/forecast-audit');
  rodape(d);
  if (!d.dados.length) {
    return el('div', {cls: 'estado'},
      'Nenhuma projeção registrada ainda. Rode "obs2026 prever".');
  }
  const out = [el('div', {cls: 'nota'},
    el('b', {}, 'O que dissemos, e quando. '), d.nota)];
  for (const s of d.dados) {
    out.push(el('h2', {}, s.serie));
    out.push(el('div', {cls: 'nota'},
      `${s.execucoes} execuções · de ${brt(s.primeira)} a ${brt(s.ultima)}`));
    out.push(el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, 'Momento'),
        el('th', {cls: 'num'}, 'Cobertura'), el('th', {}, 'Estado'),
        el('th', {}, 'Líder projetado'), el('th', {cls: 'num'}, '% (80%)'),
        el('th', {cls: 'hide-sm'}, 'Modelo'),
        el('th', {cls: 'hide-sm num'}, 'Semente'), el('th', {}, 'Definida'))),
      el('tbody', {}, ...s.registros.map(r => {
        const t = r.candidatos[0];
        return el('tr', {},
          el('td', {}, r.momento.slice(0, 19).replace('T', ' ')),
          el('td', {cls: 'num'}, pct(r.cobertura_eleitorado_pct)),
          el('td', {}, el('span', {cls: 'tag'}, r.estado_publicacao)),
          el('td', {}, t ? t.nome : '—'),
          el('td', {cls: 'num'}, t
            ? `${pct(t.pct_q500)} (${t.pct_q100.toFixed(1)}–`
              + `${t.pct_q900.toFixed(1)})` : '—'),
          el('td', {cls: 'hide-sm'}, el('code', {}, r.model_version)),
          el('td', {cls: 'hide-sm num'}, el('code', {}, String(r.semente))),
          el('td', {}, r.disputa_definida
            ? el('span', {cls: 'tag ok'}, 'sim') : ''));
      }))));
  }
  out.push(el('div', {cls: 'nota'}, el('b', {}, 'Como ler. '),
    'Erro grande com 2% apurado não é falha; intervalo que não cobre o '
    + 'resultado com 60% apurado é. A consolidação por faixa, com intervalo '
    + 'de confiança das próprias métricas, sai em "obs2026 '
    + 'auditar-previsoes".'));
  return el('div', {}, ...out);
}

/* --------------------------------------------------------------- render */

async function render() {
  navegacao();
  const main = document.getElementById('main');
  poe(main, el('div', {cls: 'estado'}, 'carregando…'));
  try {
    const cat = await get('/elections');
    document.getElementById('sub').textContent =
      cat.dados.map(e => e.nome.split(' - ')[0]).join(' · ');
    if (cat.ambiente.aviso) {
      poe(document.getElementById('aviso'),
        el('div', {cls: 'aviso'}, cat.ambiente.aviso));
    }
    const fn = {resultado: viewResultado, mapa: viewMapa,
                projecao: viewProjecao, auditoria: viewAuditoria,
                convergencia: viewConvergencia, telao: viewTelao
               }[st.visao || 'resultado'];
    poe(main, await fn());
  } catch (e) {
    poe(main, el('div', {cls: 'estado'},
      el('span', {cls: 'tag err'}, 'erro'), ' ' + e.message));
  }
}
render();
