<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatório Eleitoral 2026</title>
<style>
/* A versão anterior tinha duas fileiras de pílulas de aparência idêntica
   (3 abas x 6 modos) e ninguém decifrava a matriz. A navegação agora segue a
   ordem em que a pergunta é feita de verdade:

       1. qual CARGO   presidente, governador, senador
       2. ONDE         Brasil, ou a UF que decide a disputa
       3. qual VISÃO   resultado, mapa, projeção, auditoria

   Cada nível tem peso visual próprio, então não se confundem entre si. */
:root{
  --bg:#fff; --fg:#14181f; --muted:#5b6472; --line:#e2e6ec; --linha2:#f0f3f7;
  --panel:#f7f9fb; --acento:#1a5fb4; --proj:#6b3fa0;
  --alerta:#b45309; --erro:#b91c1c; --ok:#15803d;
  --radius:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f1218; --fg:#e8ecf2; --muted:#98a2b0; --line:#252b35; --linha2:#1a1f27;
  --panel:#161b22; --acento:#6aa8f0; --proj:#c4a4ef;
  --alerta:#fbbf24; --erro:#f87171; --ok:#4ade80;
}}
:root[data-theme=dark]{
  --bg:#0f1218; --fg:#e8ecf2; --muted:#98a2b0; --line:#252b35; --linha2:#1a1f27;
  --panel:#161b22; --acento:#6aa8f0; --proj:#c4a4ef;
  --alerta:#fbbf24; --erro:#f87171; --ok:#4ade80;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
 font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 72px}
a{color:var(--acento)}

.topo{border-bottom:1px solid var(--line)}
.marca{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
 padding:16px 0 4px}
.marca h1{font-size:18px;margin:0;letter-spacing:-.01em}
.marca .sub{color:var(--muted);font-size:12px}
.aviso{background:#fff4e5;color:#7c2d12;border:1px solid #fdba74;
 border-radius:8px;padding:9px 13px;margin:8px 0 12px;font-size:12.5px;
 font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .aviso{
 background:#2a1a0a;color:#fcd9a8;border-color:#7c4a11}}

/* nível 1 — cargo: a escolha primária, e por isso a maior */
.cargos{display:flex;flex-wrap:wrap}
.cargos button{background:none;border:0;border-bottom:3px solid transparent;
 padding:10px 2px;margin-right:22px;font:inherit;font-size:16px;
 color:var(--muted);cursor:pointer;letter-spacing:-.01em}
.cargos button[aria-selected=true]{color:var(--fg);font-weight:650;
 border-bottom-color:var(--acento)}

/* nível 2 — onde: trilha leve, não compete com o cargo */
.escopo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
 padding:11px 0;font-size:13px;color:var(--muted)}
.escopo .seta{opacity:.45}
.escopo select{background:var(--bg);color:var(--fg);border:1px solid var(--line);
 border-radius:6px;padding:4px 7px;font:inherit;font-size:13px}
.escopo .fixo{font-weight:600;color:var(--fg)}
/* Enviar para a lista do telão: discreto, mas alcançável de qualquer
 * pesquisa. Fica à direita da trilha, separado por margem automática. */
.escopo .prolista{margin-left:auto;background:var(--panel);
 border:1px solid var(--line);border-radius:999px;padding:5px 13px;
 font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer;
 display:inline-flex;align-items:center;gap:7px}
.escopo .prolista:hover{color:var(--fg);border-color:var(--muted)}
.escopo .prolista.vazio{margin-left:0}
.escopo .prolista .cont{background:var(--proj,#7c5cff);color:#fff;
 border-radius:999px;padding:0 7px;font-size:11px;font-weight:600;
 line-height:17px;min-width:17px;text-align:center}

/* nível 3 — visão: pílulas pequenas */
.visoes{display:flex;gap:5px;flex-wrap:wrap;margin:2px 0 18px}
.visoes button{background:var(--panel);border:1px solid var(--line);
 border-radius:999px;padding:5px 13px;font:inherit;font-size:13px;
 color:var(--muted);cursor:pointer}
.visoes button[aria-selected=true]{background:var(--fg);color:var(--bg);
 border-color:var(--fg);font-weight:600}

.resumo{display:grid;gap:9px;margin-bottom:18px;
 grid-template-columns:repeat(auto-fit,minmax(152px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);
 border-radius:var(--radius);padding:10px 12px}
.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;
 color:var(--muted)}
.kpi .v{font-size:21px;font-weight:660;font-variant-numeric:tabular-nums;
 margin-top:1px;letter-spacing:-.02em}
.kpi .n{font-size:11px;color:var(--muted);margin-top:1px}

.cards{display:grid;gap:10px;
 grid-template-columns:repeat(auto-fill,minmax(315px,1fr))}
.cand{display:flex;gap:11px;background:var(--panel);border:1px solid var(--line);
 border-radius:var(--radius);padding:11px;align-items:flex-start}
.cand.lider{border-color:var(--acento)}
.cand .foto{width:52px;height:52px;border-radius:50%;object-fit:cover;
 background:var(--linha2);flex:0 0 52px;border:1px solid var(--line)}
.cand .numero{width:52px;height:52px;border-radius:50%;flex:0 0 52px;
 display:flex;align-items:center;justify-content:center;background:var(--linha2);
 border:1px solid var(--line);font-weight:700;font-size:17px;color:var(--muted);
 font-variant-numeric:tabular-nums}
.cand .corpo{min-width:0;flex:1}
.cand .nome{font-weight:640;font-size:14.5px;line-height:1.25;
 overflow-wrap:anywhere}
.cand .meta{font-size:11.5px;color:var(--muted);margin-top:1px}
.cand .votos{display:flex;align-items:baseline;gap:8px;margin-top:5px;
 font-variant-numeric:tabular-nums}
.cand .pct{font-size:19px;font-weight:660;letter-spacing:-.02em}
.cand .abs{font-size:12px;color:var(--muted)}
.cand .barra{height:5px;border-radius:3px;background:var(--linha2);
 margin-top:6px;overflow:hidden}
.cand .barra i{display:block;height:100%;background:var(--acento)}
.cand .selos{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}

.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;
 border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.warn{color:var(--alerta);border-color:var(--alerta)}
.tag.err{color:var(--erro);border-color:var(--erro)}
.tag.info{color:var(--acento);border-color:var(--acento)}
.null{color:var(--muted);font-style:italic}
.nota{background:var(--panel);border-left:3px solid var(--line);
 padding:9px 13px;margin:13px 0;font-size:12.5px;color:var(--muted);
 border-radius:0 7px 7px 0}
.nota b{color:var(--fg)}
.nota.aten{border-left-color:var(--alerta)}
h2{font-size:15px;margin:22px 0 9px;letter-spacing:-.01em}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
 color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--linha2)}
details{margin:12px 0}
summary{cursor:pointer;font-size:12.5px;color:var(--muted);padding:5px 0}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;margin:9px 0}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;
 border:1px solid rgba(128,128,128,.35)}
label{display:block;font-size:10.5px;text-transform:uppercase;
 letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
select{background:var(--bg);color:var(--fg);border:1px solid var(--line);
 border-radius:6px;padding:5px 8px;font:inherit;font-size:13px}
.rodape{font-size:11.5px;color:var(--muted);display:flex;gap:14px;
 flex-wrap:wrap;padding:11px 0;border-top:1px solid var(--line);margin-top:22px}
.rodape code{font-size:10.5px}
.estado{padding:34px;text-align:center;color:var(--muted)}
footer{margin-top:20px;padding-top:12px;border-top:1px solid var(--line);
 font-size:11.5px;color:var(--muted)}
@media (max-width:560px){
 .wrap{padding:0 12px 52px}
 .cargos button{font-size:15px;margin-right:14px}
 .cards{grid-template-columns:1fr}
 table{font-size:12.5px} th,td{padding:5px 4px}
 .hide-sm{display:none}
}
</style>
</head>
<body>
<div class="wrap">
<header class="topo">
  <div class="marca">
    <h1>Observatório Eleitoral 2026</h1>
    <span class="sub" id="sub"></span>
  </div>
  <div id="aviso"></div>
  <nav class="cargos" role="tablist" id="cargos"></nav>
</header>
<div class="escopo" id="escopo"></div>
<nav class="visoes" role="tablist" id="visoes"></nav>
<main id="main"><div class="estado">carregando…</div></main>
<div class="rodape" id="meta"></div>
<footer>
  Apuração oficial, projeção e definição matemática são três coisas distintas
  e nunca se somam no mesmo número. Liderar um território não é ser eleito por
  ele: presidente é decidido no Brasil, governador e senador em cada UF.
</footer>
</div>

<script src="/mapa.js"></script>
<script>
const API = '/api/v1';
const fmt = n => n == null ? '—' : n.toLocaleString('pt-BR');
const pct = (v, d = 2) => v == null ? null
  : v.toFixed(d).replace('.', ',') + '%';
const brt = s => s ? new Date(s).toLocaleString('pt-BR',
  {timeZone: 'America/Sao_Paulo'}) : '—';

const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (v == null) continue;
    if (k === 'cls') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null)
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
};
// replaceChildren insere a string "null" se receber null; el() os descarta.
const poe = (alvo, ...kids) => alvo.replaceChildren(
  ...kids.flat().filter(x => x != null));

const CARGOS = [
  {cd: '1', nome: 'Presidente', abr: 'br', vagas: 1},
  {cd: '3', nome: 'Governador', abr: 'uf', vagas: 1},
  {cd: '5', nome: 'Senador', abr: 'uf', vagas: 2},
];
const VISOES = [
  {id: 'resultado', nome: 'Resultado'},
  {id: 'mapa', nome: 'Mapa'},
  {id: 'projecao', nome: 'Projeção'},
  {id: 'convergencia', nome: 'Convergência'},
  {id: 'auditoria', nome: 'Auditoria'},
  {id: 'telao', nome: 'Telão'},
];
const UFS = ['ac','al','ap','am','ba','ce','df','es','go','ma','mt','ms','mg',
             'pa','pb','pr','pe','pi','rj','rn','rs','ro','rr','sc','sp','se',
             'to'];

// §4.7: "projetado", "matematicamente definido" e "eleito segundo TSE" são
// rótulos distintos e nunca se fundem. Este mapa cobre só o do meio.
const DEF = {
  matematicamente_eleito: {cls: 'ok', txt: 'definido matematicamente'},
  matematicamente_no_segundo_turno: {cls: 'info', txt: '2º turno garantido'},
  matematicamente_eliminado: {cls: '', txt: 'sem chance aritmética'},
  em_aberto: null,
};

// Estado na URL (§5.1): recarregar ou compartilhar preserva o recorte.
const st = new Proxy({}, {
  get: (_, k) => new URLSearchParams(location.search).get(k),
  set: (_, k, v) => {
    const u = new URLSearchParams(location.search);
    (v == null || v === '') ? u.delete(k) : u.set(k, v);
    history.replaceState(null, '', location.pathname + '?' + u);
    render();
    return true;
  },
});
const cargoAtual = () => CARGOS.find(c => c.cd === (st.cargo || '1'));

/* Telão: esta janela conduz a projeção. BroadcastChannel liga as duas
 * janelas do mesmo navegador sem passar pelo servidor. Se esta janela
 * fechar, o telão segue o roteiro sozinho. */
let canalTelao = null;
try { canalTelao = new BroadcastChannel('observatorio-telao'); }
catch (e) { /* navegador sem suporte: o telão fica autônomo */ }

function abrirTelao() {
  window.open('/telao', 'telao-observatorio');
}

function comandarTelao(acao, indice) {
  if (!canalTelao) return;
  canalTelao.postMessage({tipo: 'comando', acao, indice});
}

/* Mostrar um recorte no telão agora, fora do roteiro.
 *
 * Antes isto acontecia sozinho: qualquer troca de cargo ou UF no painel era
 * enviada ao projetor e interrompia o carrossel. Com o operador pesquisando
 * no notebook enquanto a sala olha o telão, isso é o contrário do que se
 * quer — cada clique de pesquisa virava uma troca de tela na parede. Agora
 * é um botão, e o telão fica no recorte até alguém mandar retomar. */
function mostrarNoTelaoAgora() {
  if (!canalTelao) return;
  canalTelao.postMessage({tipo: 'recorte', recorte: {
    cargo: st.cargo || '1', uf: st.uf || null,
    camada: MAPA.camadaCanonica(st.camada) || 'lider',
  }});
}

/* ------------------------------------------------------------ WhatsApp
 *
 * Fotografa telas do telão e oferece as formas de mandar. O envio é de quem
 * opera: o painel prepara tudo e para um passo antes.
 *
 * "Compartilhar…" usa a janela de compartilhamento do sistema. No Windows,
 * com o WhatsApp instalado, ele aparece ali, e imagem e legenda vão juntas.
 * Onde o navegador não oferece isso, sobram copiar imagem e copiar legenda,
 * para colar no WhatsApp Web.
 */
async function prepararWhatsApp(pedido, rotulo) {
  const caixa = el('div', {});
  const fundo = el('div', {
    style: 'position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);'
         + 'display:flex;align-items:flex-start;justify-content:center;'
         + 'overflow:auto;padding:5vh 16px',
    onclick: e => { if (e.target === fundo) fundo.remove(); },
  }, el('div', {
    style: 'background:var(--panel);border:1px solid var(--line);'
         + 'border-radius:12px;padding:18px 20px;max-width:760px;width:100%',
  }, el('div', {style: 'display:flex;align-items:center;gap:10px;'
                     + 'margin-bottom:12px'},
       el('b', {style: 'font-size:16px'}, '📷 Para o WhatsApp'),
       el('span', {style: 'color:var(--muted);font-size:13px'}, rotulo),
       el('button', {
         style: 'margin-left:auto;background:none;border:0;color:var(--muted);'
              + 'font-size:20px;cursor:pointer',
         onclick: () => fundo.remove(), title: 'fechar',
       }, '×')),
     caixa));
  document.body.append(fundo);
  poe(caixa, el('div', {cls: 'estado'},
    'Fotografando o telão… uns 3 segundos por tela.'));

  let r;
  try {
    const resp = await fetch(API + '/compartilhar', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(pedido),
    });
    r = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(
      (r && r.detail) ? String(r.detail) : `erro ${resp.status}`);
  } catch (e) {
    poe(caixa, el('div', {cls: 'nota aten'},
      el('b', {}, 'Não foi possível fotografar. '), e.message));
    return;
  }
  if (!r.fotos.length) {
    poe(caixa, el('div', {cls: 'nota aten'},
      el('b', {}, 'Nenhuma imagem gravada. '),
      ...r.puladas.map(p => el('div', {}, `· ${p.titulo}: ${p.motivo}`))));
    return;
  }

  const blobs = await Promise.all(r.fotos.map(f =>
    fetch(f.url).then(x => x.blob())));
  const arquivos = blobs.map((b, i) =>
    new File([b], r.fotos[i].arquivo, {type: 'image/png'}));

  const botao = (txt, acao, destaque) => el('button', {
    style: 'font-size:13px;padding:7px 14px;border-radius:999px;'
         + 'cursor:pointer;border:1px solid '
         + (destaque ? '#25d366;background:#25d366;color:#08140c;'
                       + 'font-weight:600'
                     : 'var(--line);background:var(--bg);color:var(--fg)'),
    onclick: acao,
  }, txt);
  const aviso = el('div', {style: 'font-size:12.5px;color:var(--muted);'
                                + 'min-height:18px;margin-top:6px'});
  const avisar = t => { aviso.textContent = t; };
  const n = r.fotos.length;
  const plural = n > 1 ? `as ${n} imagens` : 'a imagem';

  const passo = (num, ...conteudo) => el('div', {
    style: 'display:flex;gap:12px;align-items:flex-start;margin:10px 0'},
    el('div', {style: 'flex:0 0 26px;height:26px;border-radius:50%;'
      + 'background:#25d366;color:#08140c;font-weight:700;display:flex;'
      + 'align-items:center;justify-content:center'}, String(num)),
    el('div', {style: 'flex:1;font-size:14px;line-height:1.45'},
       ...conteudo));

  /* O caminho curto primeiro. Com tudo na área de transferência do
   * Windows, mandar vira dois Ctrl+V: um para as imagens, um para a
   * legenda. O resto fica embaixo, para quando esse caminho não servir. */
  const principal = r.na_area_de_transferencia
    ? el('div', {},
        passo(1, el('b', {}, `${plural[0].toUpperCase()}${plural.slice(1)} `
                             + `já ${n > 1 ? 'estão' : 'está'} copiada${n > 1 ? 's' : ''}.`),
          ' No WhatsApp, abra o grupo e aperte ', el('b', {}, 'Ctrl+V'),
          n > 1 ? ' — entram todas juntas.' : '.'),
        passo(2, botao('Copiar legenda', async () => {
            try {
              await navigator.clipboard.writeText(r.legenda);
              avisar('Legenda copiada. Cole no campo de legenda do '
                   + 'WhatsApp (Ctrl+V) e envie.');
            } catch (e) { avisar('Não consegui copiar: ' + e.message); }
          }, true),
          el('div', {style: 'font-size:12.5px;color:var(--muted);'
                          + 'margin-top:4px'},
            'Depois de colar as imagens — copiar a legenda substitui as '
            + 'imagens na área de transferência.')),
        aviso)
    : el('div', {cls: 'nota aten'},
        'Não consegui pôr as imagens na área de transferência do Windows. '
        + 'Use as opções abaixo.');

  const podeCompartilhar = !!(navigator.canShare
    && navigator.canShare({files: arquivos}));

  poe(caixa,
    principal,
    podeCompartilhar ? el('div', {style: 'margin-top:8px'},
      botao('Ou: janela de compartilhar do Windows', async () => {
        try {
          await navigator.share({files: arquivos, text: r.legenda});
        } catch (e) {
          if (e.name !== 'AbortError') avisar('Não abriu: ' + e.message);
        }
      })) : null,
    r.puladas.length ? el('div', {cls: 'nota aten'},
      el('b', {}, 'Telas que não saíram. '),
      ...r.puladas.map(p => el('div', {}, `· ${p.titulo}: ${p.motivo}`)))
      : null,
    ...r.fotos.map((f, i) => el('div', {
      style: 'margin-top:12px;border:1px solid var(--line);border-radius:8px;'
           + 'overflow:hidden'},
      el('img', {src: URL.createObjectURL(blobs[i]), alt: f.titulo,
                 style: 'display:block;width:100%'}),
      el('div', {style: 'display:flex;gap:8px;align-items:center;'
                      + 'padding:6px 10px;flex-wrap:wrap;font-size:13px'},
        el('b', {}, f.titulo),
        el('span', {style: 'margin-left:auto'}),
        el('a', {href: '#', style: 'color:var(--muted)', onclick: async e => {
          e.preventDefault();
          try {
            await navigator.clipboard.write(
              [new ClipboardItem({'image/png': blobs[i]})]);
            avisar(`Só "${f.titulo}" copiada.`);
          } catch (x) { avisar('Não consegui copiar: ' + x.message); }
        }}, 'copiar só esta'),
        el('a', {href: f.url, download: f.arquivo,
                 style: 'color:var(--muted)'}, 'baixar')))),
    el('details', {style: 'margin-top:12px'},
      el('summary', {}, 'ver a legenda'),
      el('pre', {style: 'white-space:pre-wrap;font-size:12.5px'},
         r.legenda)),
    el('div', {style: 'font-size:12px;color:var(--muted);margin-top:8px'},
      'Guardado também em ', el('code', {}, r.pasta)));
}

function whatsappDestaTela() {
  const cargo = cargoAtual();
  if (cargo.abr === 'uf' && !st.uf) {
    alert(`${cargo.nome} é decidido em cada estado. Escolha a UF antes.`);
    return;
  }
  prepararWhatsApp({recorte: {
    cargo: cargo.cd, uf: st.uf || null,
    camada: MAPA.camadaCanonica(st.camada) || 'lider',
  }}, `${cargo.nome} — ${st.uf ? st.uf.toUpperCase() : 'Brasil'}`);
}

function retomarRoteiro() {
  if (!canalTelao) return;
  canalTelao.postMessage({tipo: 'roteiro', roteiro: ROTEIRO.telasGravadas,
                          daSessao: false});
}

/* ------------------------------------------------------ roteiro do telão
 *
 * Uma lista só. Ela vem de config/telao.yaml, é editada aqui e gravada de
 * volta no mesmo arquivo — que é o que o telão, a captura de imagens e
 * qualquer outra janela leem.
 *
 * A versão anterior tinha duas listas, a do arquivo (só leitura) e a "da
 * sessão" (editável, só no navegador), e o caminho de volta era copiar YAML
 * e colar no arquivo. Duas listas com nomes parecidos, uma delas invisível
 * para o resto do sistema, é o tipo de coisa que dá errado com o projetor
 * ligado.
 *
 * Enquanto não se grava, as alterações ficam guardadas no navegador: fechar
 * a aba por engano não perde o trabalho.
 */
const ROTEIRO = {
  CHAVE: 'telao-rascunho',
  arquivo: [],          // como está gravado
  itens: [],            // como está na tela
  telasGravadas: [],    // resolvidas pela API, para mandar ao telão
  carregado: false,
  baseMudou: false,

  deTela(t) {
    return {
      cargo: t.cargo, uf: t.uf || null,
      municipio: t.municipio || null,
      municipio_nome: t.municipio_nome || null,
      camada: MAPA.camadaCanonica(t.camada) || 'lider',
      segundos: t.segundos || 20,
      titulo: t.titulo_livre || null,
    };
  },
  assinatura(lista) {
    return JSON.stringify(lista.map(i => [i.cargo, i.uf || null,
      i.municipio || null, i.camada, i.segundos, i.titulo || null]));
  },
  carregar(telas) {
    this.telasGravadas = telas.filter(t => !t.erro);
    this.arquivo = this.telasGravadas.map(t => this.deTela(t));
    let r = null;
    try { r = JSON.parse(localStorage.getItem(this.CHAVE) || 'null'); }
    catch (e) { r = null; }
    if (r && Array.isArray(r.itens)) {
      this.itens = r.itens;
      // O arquivo mudou por fora desde que o rascunho começou (outra
      // janela gravou, alguém editou o YAML). Não se descarta nada
      // sozinho, mas o operador precisa saber.
      this.baseMudou = r.base !== this.assinatura(this.arquivo);
    } else {
      this.itens = this.arquivo.map(x => ({...x}));
      this.baseMudou = false;
    }
    this.carregado = true;
  },
  async garantir() {
    if (!this.carregado) this.carregar((await get('/telao/roteiro')).dados);
  },
  get sujo() {
    return this.assinatura(this.itens) !== this.assinatura(this.arquivo);
  },
  guardar() {
    try {
      if (this.sujo) {
        localStorage.setItem(this.CHAVE, JSON.stringify(
          {base: this.assinatura(this.arquivo), itens: this.itens}));
      } else {
        localStorage.removeItem(this.CHAVE);
      }
    } catch (e) { /* sem armazenamento: vale só enquanto a aba viver */ }
  },
  descartar() {
    this.itens = this.arquivo.map(x => ({...x}));
    this.baseMudou = false;
    this.guardar();
  },
  titulo(it) {
    if (it.titulo) return it.titulo;
    const c = CARGOS.find(x => x.cd === it.cargo) || CARGOS[0];
    const onde = it.municipio_nome
      ? `${it.municipio_nome}/${(it.uf || '').toUpperCase()}`
      : it.uf ? it.uf.toUpperCase() : 'Brasil';
    return `${c.nome} — ${onde}`;
  },
  total() {
    return this.itens.reduce((s, it) => s + (it.segundos || 20), 0);
  },
  async gravar() {
    const r = await fetch(API + '/telao/roteiro', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({roteiro: this.itens.map(it => ({
        cargo: it.cargo, uf: it.uf, municipio: it.municipio,
        camada: it.camada, segundos: it.segundos, titulo: it.titulo,
      }))}),
    });
    const corpo = await r.json().catch(() => ({}));
    if (!r.ok) {
      const d = corpo.detail || {};
      const erros = Array.isArray(d.erros) ? d.erros
        : [typeof d === 'string' ? d : `erro ${r.status}`];
      throw Object.assign(new Error('não gravado'), {erros});
    }
    this.carregar(corpo.dados);         // o que o servidor resolveu
    this.itens = this.arquivo.map(x => ({...x}));
    this.guardar();
    // O telão passa ao roteiro novo na hora, sem esperar a releitura.
    retomarRoteiro();
    return corpo;
  },
};

async function enviarParaLista() {
  const cargo = cargoAtual();
  if (cargo.abr === 'uf' && !st.uf) {
    alert(`${cargo.nome} é decidido em cada estado. Escolha a UF antes de `
        + 'mandar para o telão.');
    return;
  }
  await ROTEIRO.garantir();
  ROTEIRO.itens.push({
    cargo: cargo.cd, uf: st.uf || null, municipio: null,
    municipio_nome: null,
    camada: MAPA.camadaCanonica(st.camada) || 'lider',
    segundos: 20, titulo: null,
  });
  ROTEIRO.guardar();
  navegacao();
}

/* Editor. Nada aqui chama `render()`: mudar um tempo ou uma camada mexe no
 * dado e no texto do resumo, e só. A versão anterior redesenhava a página
 * inteira a cada número alterado — o campo perdia o foco, a rolagem pulava
 * para o topo e a roteiro era buscado de novo no servidor. */
function editorRoteiro() {
  const raiz = el('div', {});
  const resumo = el('div', {cls: 'resumo'});
  const acoes = el('div', {cls: 'visoes'});
  const msg = el('div', {});
  const tabela = el('div', {});
  raiz.append(resumo, acoes, msg, tabela);

  const fmtTempo = s => `${Math.floor(s / 60)}min ${s % 60}s`;

  function desenharResumo() {
    const sujo = ROTEIRO.sujo;
    poe(resumo,
      el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, 'Telas'),
        el('div', {cls: 'v'}, String(ROTEIRO.itens.length)),
        el('div', {cls: 'n'}, 'na sequência')),
      el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, 'Volta completa'),
        el('div', {cls: 'v'}, fmtTempo(ROTEIRO.total())),
        el('div', {cls: 'n'}, 'somando os tempos de cada tela')),
      el('div', {cls: 'kpi', style: sujo
          ? 'border-color:var(--warn,#e3b341)' : null},
        el('div', {cls: 'k'}, 'Situação'),
        el('div', {cls: 'v', style: 'font-size:17px'},
          sujo ? 'alterações não gravadas' : 'gravado'),
        el('div', {cls: 'n'}, sujo
          ? 'o telão continua no roteiro gravado'
          : 'é o que o telão está usando')));
    poe(acoes,
      el('button', {
        onclick: salvar, disabled: sujo ? null : '',
        style: sujo ? 'border-color:var(--warn,#e3b341);color:var(--fg);'
                    + 'font-weight:600' : 'opacity:.5',
      }, 'Gravar'),
      el('button', {
        onclick: () => {
          if (!confirm('Descartar as alterações e voltar ao roteiro '
                     + 'gravado?')) return;
          ROTEIRO.descartar(); poe(msg); desenhar();
        },
        disabled: sujo ? null : '',
        style: sujo ? null : 'opacity:.5',
      }, 'Descartar alterações'));
  }

  async function salvar() {
    poe(msg, el('div', {cls: 'nota'}, 'gravando…'));
    try {
      await ROTEIRO.gravar();
      poe(msg, el('div', {cls: 'nota'}, el('b', {}, 'Gravado. '),
        'O telão já passou para a sequência nova. A versão anterior ficou '
        + 'em config/telao.anterior/.'));
      desenhar();
    } catch (e) {
      // Nada foi gravado: o servidor recusa o roteiro inteiro se uma tela
      // não resolve. Mostrar qual, e por quê.
      poe(msg, el('div', {cls: 'nota aten'},
        el('b', {}, 'Não gravado. '),
        ...(e.erros || [e.message]).map(x => el('div', {}, '· ' + x))));
    }
  }

  const botao = (txt, acao, titulo, desligado) => el('button', {
    style: 'font-size:12px;padding:3px 9px;border-radius:6px;'
         + 'border:1px solid var(--line);background:var(--panel);'
         + 'color:var(--muted);cursor:pointer;margin-right:4px'
         + (desligado ? ';opacity:.4;cursor:not-allowed' : ''),
    onclick: desligado ? null : acao, title: titulo || '',
    disabled: desligado ? '' : null,
  }, txt);

  function desenharTabela() {
    const itens = ROTEIRO.itens;
    const sujo = ROTEIRO.sujo;
    if (!itens.length) {
      poe(tabela, el('div', {cls: 'estado'},
        'Roteiro vazio. Em qualquer pesquisa, "＋ enviar para o telão" '
        + 'acrescenta o recorte que estiver na tela.'));
      return;
    }
    poe(tabela, el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, '#'), el('th', {}, 'Tela'),
        el('th', {}, 'Camada'), el('th', {cls: 'num'}, 'Tempo'),
        el('th', {}, ''))),
      el('tbody', {}, ...itens.map((it, i) => el('tr', {},
        el('td', {}, String(i + 1)),
        el('td', {}, ROTEIRO.titulo(it),
          it.municipio
            ? [' ', el('span', {cls: 'tag warn',
                title: 'Recorte do voto: liderar aqui não é ser eleito por '
                     + 'aqui. O telão mostra esse aviso junto.'},
                'recorte não decisório')]
            : null),
        el('td', {}, el('select', {
          onchange: e => { it.camada = e.target.value; mudou(); },
          style: 'background:var(--bg);color:var(--fg);border:1px solid '
               + 'var(--line);border-radius:6px;padding:4px 6px;font:inherit;'
               + 'font-size:13px',
        }, ...Object.entries(MAPA.CAMADAS).map(([id, c]) =>
          el('option', {value: id,
                        selected: it.camada === id ? '' : null},
             c.rotulo)))),
        el('td', {cls: 'num'}, el('input', {
          type: 'number', min: '5', max: '300', step: '5',
          value: String(it.segundos || 20),
          style: 'width:62px;background:var(--bg);color:var(--fg);'
               + 'border:1px solid var(--line);border-radius:6px;'
               + 'padding:4px 6px;font:inherit;font-size:13px;'
               + 'text-align:right',
          // Enquanto digita, só guarda se já for um número válido: digitar
          // "15" passa por "1", e prender o "1" no piso de 5 no meio da
          // digitação transformaria 15 em 55.
          oninput: e => {
            const v = parseInt(e.target.value, 10);
            if (v >= 5 && v <= 300) { it.segundos = v; mudou(); }
          },
          // Ao sair do campo, o piso e o teto valem. Tela de 2 s não é
          // tela: ninguém lê um mapa nesse tempo.
          onchange: e => {
            const v = Math.max(5, Math.min(300,
              parseInt(e.target.value, 10) || 20));
            e.target.value = String(v);
            it.segundos = v; mudou();
          },
        }), ' s'),
        el('td', {style: 'white-space:nowrap'},
          botao('▲', () => {
            [itens[i - 1], itens[i]] = [itens[i], itens[i - 1]];
            mudou(true);
          }, 'subir', i === 0),
          botao('▼', () => {
            [itens[i + 1], itens[i]] = [itens[i], itens[i + 1]];
            mudou(true);
          }, 'descer', i === itens.length - 1),
          // Com alterações pendentes a posição na tela não é a posição no
          // telão, e "ir para" saltaria para outra tela.
          botao('ir para', () => comandarTelao('ir', i),
                sujo ? 'Grave antes: o telão ainda está na sequência '
                       + 'gravada' : 'Salta para esta tela no telão', sujo),
          botao('✕', () => { itens.splice(i, 1); mudou(true); },
                'remover')))))));
  }

  // `estrutura`: a ordem ou o número de linhas mudou, e só então a tabela
  // é refeita. Tempo e camada não refazem nada.
  function mudou(estrutura) {
    ROTEIRO.guardar();
    poe(msg);
    desenharResumo();
    if (estrutura) desenharTabela();
    else {
      // O botão "ir para" depende de haver alteração pendente.
      for (const b of tabela.querySelectorAll('button')) {
        if (b.textContent === 'ir para') {
          const s = ROTEIRO.sujo;
          b.disabled = s;
          b.style.opacity = s ? '.4' : '';
          b.style.cursor = s ? 'not-allowed' : 'pointer';
        }
      }
    }
    navegacao();   // atualiza o contador na trilha, que é barato
  }

  function desenhar() { desenharResumo(); desenharTabela(); }
  desenhar();
  if (ROTEIRO.baseMudou) {
    poe(msg, el('div', {cls: 'nota aten'},
      el('b', {}, 'O arquivo mudou desde que estas alterações começaram. '),
      'Gravar agora substitui o que está no arquivo. Para partir do que '
      + 'está gravado, descarte as alterações.'));
  }
  return raiz;
}

async function viewTelao() {
  const r = await get('/telao/roteiro');
  rodape(r);
  ROTEIRO.carregar(r.dados);
  const out = [];

  out.push(el('div', {cls: 'visoes'},
    el('button', {onclick: abrirTelao}, 'Abrir telão ↗'),
    el('button', {onclick: () => comandarTelao('anterior')}, '◂ anterior'),
    el('button', {onclick: () => comandarTelao('pausar')}, '⏸ pausar'),
    el('button', {onclick: () => comandarTelao('seguir')}, '▸ seguir'),
    el('button', {onclick: () => comandarTelao('proxima')}, 'próxima ▸'),
    el('button', {
      onclick: retomarRoteiro,
      title: 'Depois de "mostrar no telão agora", volta à sequência gravada',
    }, '↻ retomar roteiro'),
    el('button', {
      onclick: () => prepararWhatsApp({telas: null},
        'todas as telas do roteiro gravado'),
      title: 'Fotografa cada tela do roteiro gravado, com a legenda dos '
           + 'números, pronto para mandar no WhatsApp',
      style: 'border-color:#25d366',
    }, '📷 WhatsApp: roteiro inteiro')));

  out.push(editorRoteiro());

  const ruins = r.dados.filter(t => t.erro);
  if (ruins.length) {
    out.push(el('div', {cls: 'nota aten'},
      el('b', {}, 'Telas do arquivo que não resolveram. '),
      'O telão pula estas, e elas ficaram fora da lista acima: projetar o '
      + 'município errado é pior do que pular a tela. ',
      ...ruins.map(t => el('div', {}, `· ${t.titulo}: ${t.erro}`))));
  }
  out.push(el('div', {cls: 'nota'}, el('b', {}, 'Como operar. '),
    'Abra o telão, arraste a janela para o projetor e deixe em tela cheia '
    + '(F11). No próprio telão: espaço pausa, setas navegam, R recarrega os '
    + 'dados. Para mexer na sequência, edite aqui e clique em Gravar — o '
    + 'telão passa à nova na hora. Para mostrar algo fora da sequência, use '
    + '"▸ mostrar no telão agora" em qualquer pesquisa, e "↻ retomar '
    + 'roteiro" para voltar.'));
  return el('div', {}, ...out);
}

async function get(p) {
  const r = await fetch(API + p);
  if (!r.ok) throw new Error(`${r.status} em ${p}`);
  return r.json();
}

/* --------------------------------------------------------------- chrome */

function navegacao() {
  const cargo = cargoAtual();
  poe(document.getElementById('cargos'),
    ...CARGOS.map(c => el('button', {
      role: 'tab', 'aria-selected': String(c.cd === cargo.cd),
      onclick: () => { st.cargo = c.cd; },
    }, c.nome)));

  const kids = [el('span', {cls: 'fixo'}, 'Brasil')];
  if (cargo.abr === 'uf') {
    kids.push(el('span', {cls: 'seta'}, '›'),
      el('select', {
        'aria-label': 'Unidade da Federação',
        onchange: e => { st.uf = e.target.value; },
      },
      el('option', {value: ''}, 'escolha a UF…'),
      ...UFS.map(u => el('option', {
        value: u, selected: st.uf === u ? '' : null,
      }, u.toUpperCase()))));
    if (st.uf) {
      kids.push(el('span', {cls: 'seta'}, '›'),
        el('span', {}, `${cargo.nome.toLowerCase()} em `,
           el('b', {}, st.uf.toUpperCase()),
           cargo.vagas > 1 ? ` · ${cargo.vagas} vagas` : ''));
    }
  } else {
    kids.push(el('span', {}, '· disputa nacional, inclui o exterior'));
  }

  // Os botões ficam na trilha, não na aba do telão: quem está pesquisando
  // descobre ali o recorte que vale a pena projetar, e não deveria ter que
  // trocar de aba e remontar o recorte de memória.
  const pendente = ROTEIRO.carregado && ROTEIRO.sujo;
  kids.push(el('button', {
    cls: 'prolista',
    onclick: enviarParaLista,
    title: 'Acrescenta este recorte ao fim do roteiro do telão. Vale '
         + 'depois de gravar, na aba Telão.',
  }, '＋ enviar para o telão',
     pendente ? el('span', {cls: 'cont', title: 'alterações não gravadas'},
                   'não gravado') : null));
  kids.push(el('button', {
    cls: 'prolista vazio',
    onclick: mostrarNoTelaoAgora,
    title: 'Mostra este recorte no projetor agora, fora da sequência. '
         + '"Retomar roteiro", na aba Telão, volta ao automático.',
  }, '▸ mostrar no telão agora'));
  kids.push(el('button', {
    cls: 'prolista vazio',
    onclick: whatsappDestaTela,
    title: 'Fotografa este recorte como ele aparece no telão, com a '
         + 'legenda dos números, pronto para mandar no WhatsApp.',
  }, '📷 WhatsApp'));
  if (pendente) {
    kids.push(el('button', {
      cls: 'prolista vazio',
      onclick: () => { st.visao = 'telao'; },
    }, 'gravar ›'));
  }
  poe(document.getElementById('escopo'), ...kids);

  poe(document.getElementById('visoes'),
    ...VISOES.map(v => el('button', {
      role: 'tab', 'aria-selected': String(v.id === (st.visao || 'resultado')),
      onclick: () => { st.visao = v.id; },
    }, v.nome)));
}

function rodape(d) {
  poe(document.getElementById('meta'),
    el('span', {}, 'Gerado na fonte: ', el('b', {}, brt(d.source_generated_at))),
    el('span', {}, 'Capturado: ', el('b', {}, brt(d.captured_at))),
    el('span', {}, 'Lote: ', el('code', {}, d.snapshot_set_id || '—'),
       ` (${d.snapshot_count})`),
    el('span', {}, 'Modelo: ', el('code', {}, d.model_version)),
    d.quality_flags && d.quality_flags.length
      ? el('span', {cls: 'tag warn'}, `${d.quality_flags.length} sinalizações`)
      : el('span', {cls: 'tag ok'}, 'sem divergência crítica'));
}

/* ------------------------------------------------------------ resultado */

function kpis(u, def) {
  const e = u.eleitorado, v = u.votos, s = u.secoes;
  const cob = e.total ? 100 * e.apurado / e.total : null;
  const cards = [
    ['Eleitorado apurado', pct(cob) || '—',
     `${fmt(e.apurado)} de ${fmt(e.total)}`],
    ['Seções totalizadas', fmt(s.totalizadas),
     `de ${fmt(s.total)} · ${s.total ? pct(100*s.totalizadas/s.total,1) : '—'}`],
    ['Comparecimento', pct(e.comparecimento_pct) || '—',
     'sobre o eleitorado já apurado'],
    ['Votos a concorrentes', fmt(v.validos_computados),
     `brancos ${fmt(v.brancos)} · nulos ${fmt(v.nulos)}`],
  ];
  if (u.pendente.max > 0) {
    cards.push(['Ainda podem entrar',
      u.pendente.ambiguo ? `${fmt(u.pendente.min)}–${fmt(u.pendente.max)}`
                         : fmt(u.pendente.max),
      u.pendente.ambiguo
        ? 'intervalo: o contrato não separa não-totalizado de não-instalado'
        : 'eleitores']);
  } else if (def) {
    cards.push(['Situação',
      def.disputa_matematicamente_definida ? 'disputa definida'
      : def.segundo_turno_matematicamente_definido ? '2º turno definido'
      : def.sub_judice_em_jogo ? 'suspensa (sub judice)' : 'em aberto',
      def.encerrada ? 'apuração encerrada' : 'apuração em andamento']);
  }
  return el('div', {cls: 'resumo'}, ...cards.map(([k, v2, n]) =>
    el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, k),
       el('div', {cls: 'v'}, v2), el('div', {cls: 'n'}, n))));
}

function cartao(c, i, maxPct, estados) {
  const o = c.oficial, p = c.enriquecimento;
  const est = estados[o.sqcand];
  const d = est ? DEF[est.estado] : null;
  const retrato = p && p.foto_url
    ? el('img', {cls: 'foto', src: p.foto_url, alt: '', loading: 'lazy'})
    : el('div', {cls: 'numero', 'aria-hidden': 'true'}, o.numero);

  const selos = [];
  if (o.eleito_segundo_tse === true)
    selos.push(el('span', {cls: 'tag ok'}, 'eleito segundo TSE'));
  else if (o.situacao)
    selos.push(el('span', {cls: 'tag'}, o.situacao));
  if (d) selos.push(el('span', {cls: 'tag ' + d.cls,
    title: est.motivo || ''}, d.txt));
  if (o.destinacao_voto !== 'Válido')
    selos.push(el('span', {cls: 'tag warn',
      title: 'Destinação oficial do voto'}, o.destinacao_voto));
  if (p && !p.juncao_confiavel)
    selos.push(el('span', {cls: 'tag',
      title: 'Correspondência por número e partido, ainda não confirmada por '
           + 'código oficial'}, 'perfil a confirmar'));

  const larg = maxPct > 0 && o.pct != null ? 100 * o.pct / maxPct : 0;
  return el('div', {cls: 'cand' + (i === 0 ? ' lider' : '')},
    retrato,
    el('div', {cls: 'corpo'},
      el('div', {cls: 'nome'}, (p && p.nome) || o.nome_urna),
      el('div', {cls: 'meta'},
        o.partido,
        p && p.vice_nome ? ` · vice ${p.vice_nome}` : '',
        p && p.profissao ? ` · ${p.profissao}` : ''),
      el('div', {cls: 'votos'},
        el('span', {cls: 'pct'}, o.pct == null
          ? el('span', {cls: 'null',
                        title: o.pct_indisponivel_motivo || ''}, 'n/d')
          : pct(o.pct)),
        el('span', {cls: 'abs'}, fmt(o.votos) + ' votos')),
      el('div', {cls: 'barra'},
        el('i', {style: `width:${Math.max(0, Math.min(100, larg))}%`})),
      selos.length ? el('div', {cls: 'selos'}, ...selos) : null,
      p && p.perfil_url
        ? el('div', {cls: 'meta', style: 'margin-top:5px'},
            el('a', {href: p.perfil_url, target: '_blank', rel: 'noopener'},
               'perfil, bens e contas ↗'))
        : null));
}

async function viewResultado() {
  const cargo = cargoAtual();
  if (cargo.abr === 'uf' && !st.uf) {
    return el('div', {cls: 'estado'},
      `Escolha uma UF acima. ${cargo.nome} é decidido em cada estado, `
      + 'não no total nacional.');
  }
  /* Presidente com UF escolhida é RECORTE do voto, não a disputa.
   *
   * Clicar num estado no mapa grava `st.uf` — e para presidente a trilha de
   * escopo não mostra seletor de UF, então o recorte ficava invisível. Pedir
   * `abrangencia=br` junto com `uf=pa` não casa com geografia nenhuma, e a
   * tela respondia "nenhuma geografia para o filtro pedido" sem que houvesse
   * como descobrir o porquê. O recorte agora é legítimo e visível: muda a
   * abrangência, e o §3 aparece por escrito. */
  const recorte = cargo.abr === 'br' && !!st.uf;
  const abr = recorte ? 'uf' : cargo.abr;
  const qs = `cargo=${cargo.cd}` + (st.uf ? `&uf=${st.uf}` : '');
  const [res, cands, def] = await Promise.all([
    get(`/results?abrangencia=${abr}&${qs}`),
    get(`/candidates?${qs}`),
    get(`/decided?${qs}`).catch(() => null),
  ]);
  rodape(res);
  if (!res.dados.length) {
    return el('div', {cls: 'estado'}, res.status_motivo || 'sem dados');
  }

  const u = res.dados[0];
  const bloco = cands.dados[0];
  const dfn = def && def.dados && def.dados[0];
  const estados = {};
  if (dfn) for (const c of dfn.candidatos) estados[c.sqcand] = c;

  const lista = ((bloco && bloco.candidatos) || [])
    // Votos; empate (e tudo zerado) em ordem alfabética.
    .slice().sort((a, b) => (b.oficial.votos - a.oficial.votos)
      || String(a.oficial.nome_urna).localeCompare(
           String(b.oficial.nome_urna), 'pt-BR'));
  const maxPct = Math.max(...lista.map(c => c.oficial.pct || 0), 0);

  const out = [];

  if (recorte) {
    out.push(el('div', {cls: 'nota aten'},
      el('b', {}, `${cargo.nome} em ${st.uf.toUpperCase()} — recorte do `
                + 'voto. '),
      'A disputa é decidida no total do Brasil; liderar aqui não é ser '
      + 'eleito por aqui. ',
      el('button', {
        style: 'font-size:12px;padding:2px 10px;border-radius:999px;'
             + 'border:1px solid var(--line);background:var(--panel);'
             + 'color:var(--fg);cursor:pointer',
        onclick: () => { st.uf = ''; },
      }, 'voltar ao Brasil')));
  }

  out.push(kpis(u, dfn));

  if (dfn && dfn.sub_judice_em_jogo) {
    out.push(el('div', {cls: 'nota aten'},
      el('b', {}, 'Definição matemática suspensa. '),
      dfn.avisos[0] || 'há votos sub judice em jogo.'));
  }
  if (dfn && dfn.disputa_matematicamente_definida) {
    out.push(el('div', {cls: 'nota'},
      el('b', {}, 'Disputa matematicamente definida. '),
      'Nenhuma distribuição possível dos votos que faltam muda o resultado. '
      + 'Isto não é proclamação — essa é do TSE.'));
  } else if (dfn && dfn.segundo_turno_matematicamente_definido) {
    out.push(el('div', {cls: 'nota'},
      el('b', {}, 'Segundo turno matematicamente definido. '),
      'Os dois nomes já não podem mudar, mas ninguém tem maioria absoluta '
      + 'garantida.'));
  }

  out.push(el('div', {cls: 'cards'},
    ...lista.map((c, i) => cartao(c, i, maxPct, estados))));

  const en = cands.enriquecimento || {};
  out.push(el('div', {cls: 'nota'},
    el('b', {}, 'De onde vem cada coisa. '),
    'Votos, destinação e situação vêm do TSE. Foto, vice e perfil vêm de ',
    el('a', {href: 'https://eleicoes.osidosos.com.br', target: '_blank',
             rel: 'noopener'}, 'eleicoes.osidosos.com.br'),
    ' (dados abertos, MIT). ',
    en.casados
      ? `${en.casados} de ${en.total_candidatos} candidatos com perfil, `
        + `${en.casados_por_codigo_oficial} deles por código oficial.`
      : (en.aviso || en.erro
         || 'Nenhum perfil correspondeu: no ambiente de simulado os '
          + 'candidatos são fictícios.')));

  out.push(detalhesTecnicos(res, u));
  return el('div', {}, ...out);
}

function detalhesTecnicos(res, u) {
  const v = u.votos;
  const linhas = [
    ['Votos a concorrentes (vvc)', v.validos_computados,
     'válidos + anulados + sub judice — base da maioria absoluta'],
    ['Votos válidos (vv)', v.validos, 'só destinação "Válido"'],
    ['Votos nominais (Σ vap)', v.nominal_tse,

    ['Brancos', v.brancos, ''],
    ['Nulos', v.nulos, ''],
    ['Total de votos (tv)', v.total, 'no Senado chega a 2x o comparecimento'],

  return el('details', {},
    el('summary', {}, 'Denominadores e definições técnicas'),
    el('div', {cls: 'nota'},
      el('b', {}, 'Os percentuais desta tela usam '), res.denominador.rotulo,
      '. O TSE exibe percentual sobre votos nominais, que é outro número, e '
      + 'não é o que decide o primeiro turno.'),
    el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, 'Medida'),
        el('th', {cls: 'num'}, 'Votos'),
        el('th', {cls: 'hide-sm'}, 'O que é'))),
      el('tbody', {}, ...linhas.map(([k, n, nota]) => el('tr', {},
        el('td', {}, k), el('td', {cls: 'num'}, fmt(n)),
        el('td', {cls: 'hide-sm'}, el('span', {cls: 'null'}, nota)))))));
}

/* ----------------------------------------------------------------- mapa */

/* Filtro territorial: região, estado, município.
 *
 * O mapa antes só tinha "ver municípios", que abria os 5.570 de uma vez —
 * útil para ver o país e inútil para olhar um lugar. Aqui cada nível
 * estreita o anterior, e o mapa acompanha: região reenquadra, estado abre
 * os municípios daquele estado, município destaca um.
 *
 * Região sai do primeiro dígito do código IBGE, que o próprio IBGE usa
 * para isso — não é tabela nossa a manter. */
function filtroTerritorial(m, abr) {
  /* As cinco regiões são fixas, não derivadas do que está carregado.
   * Derivar parecia elegante e quebrava: com o mapa aberto nos municípios
   * de um estado, os dados só têm uma região, e o seletor perdia as outras
   * quatro — justamente quando o operador quer sair dali. */
  const regioes = ['Norte', 'Nordeste', 'Centro-Oeste', 'Sudeste', 'Sul'];

  const sel = (rotulo, valor, opcoes, aoMudar, vazio) => el('label', {
    style: 'display:inline-flex;flex-direction:column;gap:3px;'
         + 'font-size:11.5px;color:var(--muted)',
  }, rotulo, el('select', {
    onchange: e => aoMudar(e.target.value),
    style: 'background:var(--bg);color:var(--fg);border:1px solid '
         + 'var(--line);border-radius:6px;padding:5px 8px;font:inherit;'
         + 'font-size:13px;min-width:150px',
  }, el('option', {value: ''}, vazio),
     ...opcoes.map(([v, t]) => el('option', {
       value: v, selected: String(valor || '') === String(v) ? '' : null,
     }, t))));

  const kids = [
    sel('Região', st.regiao, regioes.map(r => [r, r]),
        v => { st.regiao = v; st.uf = ''; st.municipio = ''; },
        'todas as regiões'),
    sel('Estado', st.uf,
        // Região desconhecida não exclui: com o mapa aberto nos municípios
        // de um estado só esse estado tem região conhecida, e esconder os
        // outros 26 prenderia o operador onde ele está.
        UFS.filter(u => {
          if (!st.regiao) return true;
          const r = ufNaRegiao(m, u);
          return r == null || r === st.regiao;
        }).map(u => [u, u.toUpperCase()]),
        v => { st.uf = v; st.municipio = ''; st.detalhe = v ? 'mu' : ''; },
        'todos os estados'),
  ];

  // Município só faz sentido com o mapa já em municípios: a lista de 5.570
  // num seletor é pior do que não ter seletor.
  if (abr === 'mu' && st.uf) {
    const munis = [...m.dados]
      .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'))
      .map(d => [d.cd_ibge, d.nome + (d.capital ? ' (capital)' : '')]);
    kids.push(sel('Município', st.municipio, munis,
                  v => { st.municipio = v; }, `todos (${munis.length})`));
  }

  /* Voltar um nível, explícito.
   *
   * Descer é intuitivo — clica-se no que se quer ver. Subir não tem gesto:
   * sem botão, a única saída é mexer nos seletores, e quem clicou três
   * vezes para chegar num município não deveria ter que desfazer o caminho
   * de trás para frente. O rótulo diz para onde vai, não "voltar". */
  const acima = st.municipio
    ? {rotulo: `◂ voltar a ${(st.uf || '').toUpperCase()}`,
       acao: () => { st.municipio = ''; }}
    : st.uf
    ? {rotulo: st.regiao ? `◂ voltar ao ${st.regiao}` : '◂ voltar ao Brasil',
       acao: () => { st.uf = ''; st.detalhe = ''; }}
    : st.regiao
    ? {rotulo: '◂ voltar ao Brasil', acao: () => { st.regiao = ''; }}
    : null;

  if (acima) {
    kids.push(el('button', {
      style: 'align-self:flex-end;font-size:12.5px;padding:6px 14px;'
           + 'border-radius:999px;border:1px solid var(--muted);'
           + 'background:var(--panel);color:var(--fg);cursor:pointer',
      onclick: acima.acao,
    }, acima.rotulo));
  }
  if (st.municipio || (st.regiao && st.uf)) {
    kids.push(el('button', {
      style: 'align-self:flex-end;font-size:12px;padding:6px 12px;'
           + 'border-radius:999px;border:1px solid var(--line);'
           + 'background:var(--panel);color:var(--muted);cursor:pointer',
      onclick: () => {
        st.regiao = ''; st.uf = ''; st.municipio = ''; st.detalhe = '';
      },
    }, 'Brasil inteiro'));
  }
  return el('div', {
    style: 'display:flex;gap:11px;align-items:flex-end;flex-wrap:wrap;'
         + 'margin:2px 0 14px',
  }, ...kids);
}

/* Região de uma UF, lida do dado já carregado. Quando o mapa está em
 * municípios os dados são de uma UF só, então o índice vem de uma tabela
 * mínima derivada do mesmo primeiro dígito — nunca de palpite. */
const REGIAO_POR_UF = {};
function ufNaRegiao(m, sigla) {
  for (const d of m.dados) {
    if (d.uf && d.regiao) REGIAO_POR_UF[d.uf] = d.regiao;
  }
  return REGIAO_POR_UF[sigla] || null;
}

async function viewMapa() {
  const cargo = cargoAtual();
  const abr = (st.detalhe === 'mu' || st.uf) ? 'mu' : 'uf';
  const uf = (abr === 'mu' && st.uf) ? `&uf=${st.uf}` : '';
  const m = await get(
    `/map-layers?cargo=${cargo.cd}&abrangencia=${abr}${uf}`);
  rodape(m);
  if (!m.dados.length) {
    if (abr === 'mu' && st.uf) {
      // Sem municípios naquela UF não é a mesma coisa que sem dado: o
      // estado tem resultado, só a quebra por município ainda não chegou.
      return el('div', {cls: 'estado'},
        `Resultado por município de ${cargo.nome.toLowerCase()} em `
        + `${st.uf.toUpperCase()} ainda sem dado. O total do estado está `
        + 'em Resultado. ',
        el('button', {
          style: 'margin-left:6px;font-size:12.5px;padding:5px 12px;'
               + 'border-radius:999px;border:1px solid var(--line);'
               + 'background:var(--panel);color:var(--fg);cursor:pointer',
          onclick: () => { st.uf = ''; st.municipio = ''; st.detalhe = ''; },
        }, '◂ voltar ao mapa de estados'));
    }
    return el('div', {cls: 'estado'}, m.status_motivo || 'sem dados');
  }

  // Região filtra o que é desenhado quando o mapa é nacional. Em
  // municípios de uma UF não há o que filtrar por região.
  const dados = (st.regiao && abr === 'uf')
    ? m.dados.filter(d => d.regiao === st.regiao) : m.dados;
  if (!dados.length) {
    return el('div', {cls: 'estado'},
      `nenhum território com dado em ${st.regiao}`);
  }

  const camadaId = MAPA.CAMADAS[st.camada] ? st.camada : 'lider';
  const camada = MAPA.CAMADAS[camadaId];
  const wrap = el('div', {});

  wrap.append(el('div', {cls: 'visoes'},
    ...Object.entries(MAPA.CAMADAS).map(([id, c]) => el('button', {
      'aria-selected': String(id === camadaId),
      onclick: () => { st.camada = id; },
    }, c.rotulo)),
    el('button', {
      'aria-selected': 'false', disabled: '',
      title: 'Classificação ideológica pendente de curadoria com autoria',
      style: 'opacity:.45;cursor:not-allowed',
    }, 'Bloco ideológico')));

  wrap.append(filtroTerritorial(m, abr));

  wrap.append(el('div', {cls: 'nota'}, el('b', {}, camada.rotulo + '. '),
                 camada.nota));

  const caixa = el('div', {style: 'background:var(--panel);border:1px solid '
    + 'var(--line);border-radius:var(--radius);padding:5px'});
  caixa.append(el('div', {cls: 'estado'}, 'desenhando o mapa…'));
  const barra = el('div', {style: 'margin-top:13px'});
  const pe = el('div', {});
  wrap.append(caixa, barra, pe);

  /* Enquadramento. Uma região é um prefixo de código IBGE tão legítimo
   * quanto uma UF: o mesmo mecanismo que evita desenhar o Brasil para
   * mostrar Alagoas serve para mostrar o Nordeste. */
  const digitoRegiao = st.regiao
    ? ((dados.find(d => d.regiao === st.regiao) || {}).cd_ibge || '')[0]
    : null;
  const recorte = abr === 'mu' ? m.recorte_ibge
                : (digitoRegiao || null);

  (async () => {
    try {
      const r = await MAPA.desenhar(caixa, dados, {
        malha: m.malha, camada: camadaId, recorte,
        // Destaque marca; foco enquadra. Clicar num município agora abre o
        // município, como clicar num estado abre o estado.
        destaque: st.municipio || null,
        foco: st.municipio || null,
        largura: 760, altura: abr === 'mu' ? 640 : 540,
        aoClicar: d => {
          if (abr === 'mu') { st.municipio = d.cd_ibge; return; }
          // No mapa de estados, clicar abre aquele estado: para governador
          // e senador é a disputa que decide, para presidente é o recorte.
          st.uf = d.uf; st.municipio = ''; st.detalhe = 'mu';
        },
      });
      const sel = st.municipio
        ? dados.find(d => d.cd_ibge === st.municipio) : null;
      poe(pe,
        // O mesmo painel do sobrevoo, fixo: o território escolhido no
        // filtro merece ficar legível sem manter o mouse parado em cima.
        sel ? el('div', {cls: 'nota'}, MAPA.detalhe(sel)) : null,
        MAPA.legenda(r.camada, r.ctx, dados),
        el('div', {cls: 'nota'}, el('b', {}, 'Área não é eleitorado. '),
           m.aviso_cartografico),
        el('div', {cls: 'nota'},
           `${fmt(dados.length)} territórios com dado`
           + (st.regiao && abr === 'uf' ? ` em ${st.regiao}` : '')
           + (r.semDado ? ` · ${fmt(r.semDado)} sem dado (hachura)` : '')),
        m.nota_territorial
          ? el('div', {cls: 'nota'}, el('b', {}, 'Atenção. '),
               m.nota_territorial) : null,
        m.quality_flags && m.quality_flags.length
          ? el('div', {cls: 'nota aten'},
               el('b', {}, 'Divergência territorial. '),
               m.quality_flags.join(' · ')) : null,
        tabelaMapa({...m, dados}, r.camada, r.ctx));
      poe(barra,
        el('label', {}, 'Mesma informação, ponderada por eleitores'),
        MAPA.barraPonderada(dados, r.camada, r.ctx));
    } catch (e) {
      poe(caixa, el('div', {cls: 'estado'},
        el('span', {cls: 'tag err'}, 'erro no mapa'), ' ' + e.message));
    }
  })();
  return wrap;
}

}

/* --------------------------------------------------------- convergência */

/* Gráfico de convergência. SVG inline, sem biblioteca: um gráfico de linha
 * com faixa é pouca geometria, e uma dependência externa numa tela que vai
 * ao ar na noite da apuração é risco sem retorno.
 *
 * Leitura: apurado em linha cheia, projetado em tracejado com faixa de 80%.
 * O par cheio/tracejado importa — a leitura não pode depender só de cor. */
function grafConvergencia(cand) {
  const W = 680, H = 210, ml = 48, mr = 12, mt = 10, mb = 26;
  const pts = cand.pontos.filter(p => p.pct_projetado != null);
  if (pts.length < 2) {
    return el('div', {cls: 'nota'},
      'série curta demais para um gráfico: ' + pts.length + ' ponto(s).');
  }

  const ys = [];
  for (const p of pts) {
    ys.push(p.pct_q100, p.pct_q900, p.pct_projetado);
    if (p.pct_apurado != null) ys.push(p.pct_apurado);
  }
  if (cand.pct_final != null) ys.push(cand.pct_final);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const folga = Math.max(0.4, (y1 - y0) * 0.14);
  y0 -= folga; y1 += folga;

  const X = c => ml + (Math.max(0, Math.min(100, c)) / 100) * (W - ml - mr);
  const Y = v => mt + (1 - (v - y0) / (y1 - y0 || 1)) * (H - mt - mb);
  const S = (t, a = {}) => {
    const n = document.createElementNS('http://www.w3.org/2000/svg', t);
    for (const [k, v] of Object.entries(a)) if (v != null) n.setAttribute(k, v);
    return n;
  };

  const svg = S('svg', {viewBox: '0 0 ' + W + ' ' + H, width: '100%',
    role: 'img', style: 'max-width:100%;height:auto;display:block',
    'aria-label': 'Convergência de ' + cand.nome});

  for (const v of [y0, (y0 + y1) / 2, y1]) {
    svg.append(S('line', {x1: ml, x2: W - mr, y1: Y(v), y2: Y(v),
      stroke: 'var(--line)', 'stroke-width': 1}));
    const t = S('text', {x: ml - 6, y: Y(v) + 3, 'text-anchor': 'end',
      'font-size': 10, fill: 'var(--muted)'});
    t.textContent = v.toFixed(1).replace('.', ',') + '%';
    svg.append(t);
  }
  for (const c of [0, 25, 50, 75, 100]) {
    const t = S('text', {x: X(c), y: H - 8, 'text-anchor': 'middle',
      'font-size': 10, fill: 'var(--muted)'});
    t.textContent = c + '%';
    svg.append(t);
  }
  const rot = S('text', {x: ml, y: H - 8, 'text-anchor': 'start',
    'font-size': 9, fill: 'var(--muted)', opacity: 0});
  svg.append(rot);

  const cima = pts.map(p => X(p.cobertura_pct) + ',' + Y(p.pct_q900));
  const baixo = pts.slice().reverse()
    .map(p => X(p.cobertura_pct) + ',' + Y(p.pct_q100));
  svg.append(S('polygon', {points: cima.concat(baixo).join(' '),
    fill: 'var(--proj)', opacity: 0.22}));

  if (cand.pct_final != null) {
    svg.append(S('line', {x1: ml, x2: W - mr,
      y1: Y(cand.pct_final), y2: Y(cand.pct_final),
      stroke: 'var(--fg)', 'stroke-width': 1, 'stroke-dasharray': '1 4',
      opacity: 0.5}));
  }

  const linha = (campo, cor, tracejado, largura) => {
    const d = pts.filter(p => p[campo] != null)
      .map((p, i) => (i ? 'L' : 'M') + X(p.cobertura_pct) + ' '
           + Y(p[campo])).join(' ');
    return S('path', {d, fill: 'none', stroke: cor,
      'stroke-width': largura || 2,
      'stroke-linejoin': 'round', 'stroke-dasharray': tracejado});
  };
  // Projetado primeiro, por baixo; apurado por cima e mais grosso: o
  // apurado e fato, a projecao e estimativa, e a hierarquia visual diz isso.
  svg.append(linha('pct_projetado', 'var(--proj)', '7 4', 2));
  svg.append(linha('pct_apurado', 'var(--acento)', null, 2.6));

  for (const p of pts) {
    if (p.pct_apurado == null) continue;
    const c = S('circle', {cx: X(p.cobertura_pct), cy: Y(p.pct_apurado),
      r: 2.5, fill: 'var(--acento)'});
    const t = S('title');
    t.textContent = p.cobertura_pct.toFixed(1) + '% apurado\n'
      + 'contado: ' + p.pct_apurado.toFixed(2) + '%\n'
      + 'projetado: ' + p.pct_projetado.toFixed(2) + '% ('
      + p.pct_q100.toFixed(1) + '–' + p.pct_q900.toFixed(1) + ')';
    c.append(t);
    svg.append(c);
  }
  return svg;
}

function legendaConvergencia() {
  const item = (estilo, txt) => el('span', {},
    el('i', {cls: 'sw', style: estilo}), txt);
  return el('div', {cls: 'legend'},
    item('background:var(--acento)', 'apurado (linha cheia)'),
    item('background:var(--proj)', 'projetado (tracejado)'),
    item('background:var(--proj);opacity:.3', 'intervalo de 80%'),
    item('background:var(--fg);opacity:.5', 'resultado final'));
}

async function viewConvergencia() {
  const amb = st.diario ? 'ambiente=' + st.diario + '&' : '';
  const d = await get('/convergencia?' + amb + 'top=4');
  rodape(d);
  const cabeca = [
    el('div', {cls: 'visoes'},
      el('button', {'aria-selected': String(!st.diario),
        onclick: () => { st.diario = ''; }}, 'Apuração real'),
      el('button', {
        'aria-selected': String(st.diario === 'ensaio-simulado2026'),
        title: 'Série produzida por "obs2026 ensaiar-auditoria", com ordem '
             + 'de chegada sintética',
        onclick: () => { st.diario = 'ensaio-simulado2026'; }}, 'Ensaio')),
  ];
  if (!d.dados.length) {
    return el('div', {}, ...cabeca,
      el('div', {cls: 'estado'}, d.status_motivo || 'sem registros'));
  }
  const out = [
    ...cabeca,
    el('div', {cls: 'nota'}, el('b', {}, 'O que este gráfico responde. '),
       d.nota),
    legendaConvergencia(),
  ];

  for (const s2 of d.dados) {
    out.push(el('h2', {}, s2.serie));
    out.push(el('div', {cls: 'nota'},
      s2.execucoes + ' projeções registradas · cobertura de '
      + pct(s2.cobertura_min, 1) + ' a ' + pct(s2.cobertura_max, 1)
      + ' · modelo ', el('code', {}, s2.model_version),
      s2.encerrada ? ' · disputa encerrada' : ' · apuração em andamento',
      s2.dispersao_fonte_max_s != null && s2.dispersao_fonte_max_s > 0
        ? ` · dispersão máxima da fonte: `
          + `${Math.round(s2.dispersao_fonte_max_s / 60)} min`
        : ''));

    for (const cand of s2.candidatos) {
      out.push(el('div', {style: 'margin:14px 0'},
        el('div', {style: 'display:flex;justify-content:space-between;'
                 + 'align-items:baseline;gap:10px;flex-wrap:wrap'},
          el('b', {}, cand.nome),
          el('span', {style: 'font-size:12px;color:var(--muted)'},
            cand.pct_final != null ? 'final ' + pct(cand.pct_final) : '',
            cand.distancia_final_pp != null
              ? ' · distância no último ponto: '
                + cand.distancia_final_pp.toFixed(2).replace('.', ',') + ' pp'
              : '')),
        grafConvergencia(cand)));
    }

    out.push(el('details', {},
      el('summary', {}, 'Tabela equivalente'),
      el('table', {},
        el('thead', {}, el('tr', {}, el('th', {}, 'Candidato'),
          el('th', {cls: 'num'}, 'Cobertura'),
          el('th', {cls: 'num'}, 'Apurado'),
          el('th', {cls: 'num'}, 'Projetado'),
          el('th', {cls: 'num'}, 'Faixa 80%'), el('th', {}, 'Estado'))),
        el('tbody', {}, ...s2.candidatos.flatMap(cand =>
          cand.pontos.map(p => el('tr', {},
            el('td', {}, cand.nome),
            el('td', {cls: 'num'}, pct(p.cobertura_pct, 1)),
            el('td', {cls: 'num'}, p.pct_apurado == null
              ? el('span', {cls: 'null'}, 'n/d') : pct(p.pct_apurado)),
            el('td', {cls: 'num'}, pct(p.pct_projetado)),
            el('td', {cls: 'num'}, p.pct_q100.toFixed(1) + '–'
              + p.pct_q900.toFixed(1)),
            el('td', {}, el('span', {cls: 'tag'}, p.estado_publicacao)))))))));
  }
  out.push(el('div', {cls: 'nota'}, el('b', {}, 'Nada é recalculado. '),
    d.aviso));
  out.push(el('div', {cls: 'nota'},
    el('b', {}, 'Por que não esperamos "terminar de carregar". '),
    d.nota_dispersao));
  return el('div', {}, ...out);
}

/* ------------------------------------------------------------ auditoria */

async function viewAuditoria() {
  const d = await get('/forecast-audit');
  rodape(d);
  if (!d.dados.length) {
    return el('div', {cls: 'estado'},
      'Nenhuma projeção registrada ainda. Rode "obs2026 prever".');
  }
  const out = [el('div', {cls: 'nota'},
    el('b', {}, 'O que dissemos, e quando. '), d.nota)];
  for (const s of d.dados) {
    out.push(el('h2', {}, s.serie));
    out.push(el('div', {cls: 'nota'},
      `${s.execucoes} execuções · de ${brt(s.primeira)} a ${brt(s.ultima)}`));
    out.push(el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, 'Momento'),
        el('th', {cls: 'num'}, 'Cobertura'), el('th', {}, 'Estado'),
        el('th', {}, 'Líder projetado'), el('th', {cls: 'num'}, '% (80%)'),
        el('th', {cls: 'hide-sm'}, 'Modelo'),
        el('th', {cls: 'hide-sm num'}, 'Semente'), el('th', {}, 'Definida'))),
      el('tbody', {}, ...s.registros.map(r => {
        const t = r.candidatos[0];
        return el('tr', {},
          el('td', {}, r.momento.slice(0, 19).replace('T', ' ')),
          el('td', {cls: 'num'}, pct(r.cobertura_eleitorado_pct)),
          el('td', {}, el('span', {cls: 'tag'}, r.estado_publicacao)),
          el('td', {}, t ? t.nome : '—'),
          el('td', {cls: 'num'}, t
            ? `${pct(t.pct_q500)} (${t.pct_q100.toFixed(1)}–`
              + `${t.pct_q900.toFixed(1)})` : '—'),
          el('td', {cls: 'hide-sm'}, el('code', {}, r.model_version)),
          el('td', {cls: 'hide-sm num'}, el('code', {}, String(r.semente))),
          el('td', {}, r.disputa_definida
            ? el('span', {cls: 'tag ok'}, 'sim') : ''));
      }))));
  }
  out.push(el('div', {cls: 'nota'}, el('b', {}, 'Como ler. '),
    'Erro grande com 2% apurado não é falha; intervalo que não cobre o '
    + 'resultado com 60% apurado é. A consolidação por faixa, com intervalo '
    + 'de confiança das próprias métricas, sai em "obs2026 '
    + 'auditar-previsoes".'));
  return el('div', {}, ...out);
}

/* --------------------------------------------------------------- render */

async function render() {
  navegacao();
  const main = document.getElementById('main');
  poe(main, el('div', {cls: 'estado'}, 'carregando…'));
  try {
    const cat = await get('/elections');
    document.getElementById('sub').textContent =
      cat.dados.map(e => e.nome.split(' - ')[0]).join(' · ');
    if (cat.ambiente.aviso) {
      poe(document.getElementById('aviso'),
        el('div', {cls: 'aviso'}, cat.ambiente.aviso));
    }
    const fn = {resultado: viewResultado, mapa: viewMapa,
                projecao: viewProjecao, auditoria: viewAuditoria,
                convergencia: viewConvergencia, telao: viewTelao
               }[st.visao || 'resultado'];
    poe(main, await fn());
  } catch (e) {
    poe(main, el('div', {cls: 'estado'},
      el('span', {cls: 'tag err'}, 'erro'), ' ' + e.message));
  }
}
render();
</script>
