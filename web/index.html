/* ------------------------------------------------------------- comparar
 *
 * O mesmo território em várias eleições, lado a lado: participação
 * (eleitorado, comparecimento, abstenção, brancos, nulos) e quem ganhou,
 * com partido e ideologia. É a tela de leitura pós-eleição — e a que
 * responde "o que mudou desde 2018 aqui".
 *
 * Três cuidados que a tela precisa manter à vista:
 *   - o ano ao vivo é PARCIAL, e abstenção parcial não se compara com final;
 *   - partido muda de nome, e a série só se liga com a linhagem assinada;
 *   - ideologia é a do próprio ano, nunca herdada de outro. */
/* Comparar tem duas leituras: a do cargo escolhido e o resumo de todos
 * os cargos numa página. O seletor fica no topo das duas. */
async function viewComparar() {
  const resumo = st.resumo === '1';
  const seletor = el('div', {cls: 'visoes', role: 'tablist'},
    el('button', {role: 'tab', 'aria-selected': String(!resumo),
      onclick: () => { st.resumo = ''; }}, `Só ${cargoAtual().nome.toLowerCase()}`),
    el('button', {role: 'tab', 'aria-selected': String(resumo),
      onclick: () => { st.resumo = '1'; }}, 'Resumo de todos os cargos'));
  const corpo = resumo ? await viewResumoAnos() : await viewCompararCargo();
  return el('div', {}, seletor, corpo);
}

async function viewCompararCargo() {
  const cargo = cargoAtual();
  if (cargo.proporcional) return viewCamaraAnos();
  const cd = cargo.especial || cargo.proporcional ? '1' : cargo.cd;
  const q = [`cargo=${cd}`];
  if (cd !== '1' && st.uf) q.push(`uf=${st.uf}`);
  // Sem UF escolhida, a pergunta deixa de ser "como foi neste estado" e
  // passa a ser "o que mudou no país": os 27 estados ano a ano, com o
  // agregado por bloco. É o mapa de mudança em tabela.
  if (cd !== '1' && !st.uf) return viewPanoramaAnos(cd);
  if (cd === '1' && st.uf) q.push(`uf=${st.uf}`);
  const r = await get(`/comparativo?${q.join('&')}`);
  rodape(r);
  const d = r.dados;
  const cols = d.colunas.filter(c => !c.sem_dado);
  const vazias = d.colunas.filter(c => c.sem_dado);
  if (!cols.length) {
    return el('div', {cls: 'estado'},
      'Nenhum ano importado ainda. Rode "obs2026 importar-historico".');
  }
  const onde = st.uf ? st.uf.toUpperCase() : 'Brasil';
  const n = x => x == null ? '—' : fmt(x);
  const pc = (x, casas) => x == null ? '—' : pct(x, casas === undefined ? 1
                                                 : casas);

  // Linha da tabela: um rótulo e um valor por ano.
  // `num` alinha à direita: vale para número, não para nome de candidato.
  // Cabeçalho e conteúdo precisam do mesmo alinhamento, senão o ano fica
  // numa borda e o nome na outra (visto em 23/09).
  const linha = (rot, valor, nota, num = true) => el('tr', {},
    el('td', {}, rot, nota ? el('div', {style: 'color:var(--muted);'
        + 'font-size:11.5px'}, nota) : null),
    ...cols.map(c => el('td', {cls: num ? 'num' : null}, valor(c))));

  // Função, não nó: um elemento do DOM só existe num lugar, e reaproveitar
  // o mesmo cabeçalho nas três tabelas o fazia migrar para a última — a
  // tabela de participação ficava sem os anos (visto em 23/09).
  const cabec = (num = true) => el('tr', {}, el('th', {}, ''),
    ...cols.map(c => el('th', {cls: num ? 'num' : null},
      el('div', {}, String(c.ano)),
      c.parcial
        ? el('div', {style: 'color:var(--alerta);font-size:11px;'
              + 'font-weight:400'}, `parcial · ${pct(c.apurado_pct, 1)}`)
        : el('div', {style: 'color:var(--muted);font-size:11px;'
              + 'font-weight:400'}, `${c.turno}º turno`))));

  const participacao = el('table', {}, el('thead', {}, cabec()),
    el('tbody', {},
      linha('Eleitorado', c => n(c.eleitorado)),
      linha('Compareceram', c => `${n(c.comparecimento)}`),
      linha('Comparecimento', c => pc(c.comparecimento_pct)),
      linha('Abstenção', c => pc(c.abstencao_pct)),
      linha('Brancos', c => `${n(c.brancos)} · ${pc(c.brancos_pct)}`,
            'sobre o total de votos'),
      linha('Nulos', c => `${n(c.nulos)} · ${pc(c.nulos_pct)}`,
            'sobre o total de votos'),
      linha('Válidos', c => n(c.validos))));

  // As quatro parcelas do eleitorado, na mesma base, somando 100%. É o que
  // desfaz a leitura fácil: em 2022 a abstenção subiu e, ainda assim, mais
  // eleitores produziram voto válido, porque branco e nulo caíram pela
  // metade (observação do usuário em 23/09).
  const efetiva = el('table', {}, el('thead', {}, cabec()),
    el('tbody', {},
      linha('Abstenção', c => pc(c.abstencao_sobre_aptos_pct, 2)),
      linha('Brancos', c => pc(c.brancos_sobre_aptos_pct, 2)),
      linha('Nulos', c => pc(c.nulos_sobre_aptos_pct, 2)),
      linha('Participação efetiva', c => el('b', {},
        pc(c.participacao_efetiva_pct, 2)),
        'votos válidos sobre o eleitorado')));

  const nomeCand = (x) => {
    if (!x) return el('span', {cls: 'null'}, '—');
    const lin = x.linhagem || {};
    const trocou = lin.nota && lin.linhagem_ativa;
    return el('div', {},
      el('div', {}, el('b', {}, x.nome)),
      el('div', {style: 'font-size:12px;color:var(--muted)'},
        el('span', {cls: 'sw', style:
          `background:${x.partido_cor};margin-right:5px`}),
        x.partido, ' · ', pct(x.pct_validos, 1),
        trocou ? el('div', {style: 'font-size:11px'}, lin.nota) : null),
      x.ideologia
        ? el('div', {style: 'font-size:11.5px'}, x.ideologia.bloco)
        : el('div', {style: 'font-size:11.5px;color:var(--muted)'},
             'sem classificação'));
  };
  const disputa = el('table', {}, el('thead', {}, cabec(false)),
    el('tbody', {},
      el('tr', {}, el('td', {}, '1º colocado'),
        ...cols.map(c => el('td', {}, nomeCand(c.candidatos[0])))),
      el('tr', {}, el('td', {}, '2º colocado'),
        ...cols.map(c => el('td', {}, nomeCand(c.candidatos[1])))),
      linha('Margem', c => {
        const a = c.candidatos[0], b = c.candidatos[1];
        return (a && b && a.pct_validos != null && b.pct_validos != null)
          ? pct(a.pct_validos - b.pct_validos, 1) : '—';
      }, 'entre o 1º e o 2º', false)));

  const semClass = cols.filter(c => c.classificacao_motivo);
  return el('div', {},
    el('h2', {}, `${d.cargo_nome} em ${onde} — evolução`),
    el('div', {cls: 'nota'}, el('b', {}, 'Como ler. '), d.nota),
    !d.linhagem_ativa
      ? el('div', {cls: 'nota aten'}, el('b', {}, 'Linhagem pendente. '),
          'Cada ano mostra o partido com o nome da época, e as séries não '
          + 'se ligam (PSL e União Brasil aparecem separados). Para ligar, '
          + 'assine em config/linhagem_partidos.yaml.')
      : null,
    semClass.length
      ? el('div', {cls: 'nota'}, el('b', {}, 'Ideologia incompleta: '),
          semClass.map(c => c.classificacao_motivo).join(' · '))
      : null,
    el('h2', {}, 'Participação'), participacao,
    el('h2', {}, 'Tudo sobre o eleitorado'),
    el('div', {cls: 'nota'},
      'Abstenção, branco e nulo na mesma base, somando 100% com os válidos. '
      + 'Comparar abstenção sozinha engana: ela pode subir enquanto mais '
      + 'eleitores escolhem alguém.'),
    efetiva,
    el('h2', {}, 'Disputa'), disputa,
    vazias.length
      ? el('div', {cls: 'nota'}, 'Sem dado para: '
          + vazias.map(c => c.ano).join(', ') + '.')
      : null);
}

/* Peças comuns das telas ano a ano (Câmara, governadores, senadores e o
 * resumo): as cores dos blocos e a tabela de partidos na linhagem. */
const CORB_ANOS = {esquerda: '#e2574c', centro: '#e3b341', direita: '#5b8def',
                   sem_classificacao: 'var(--muted)', misto: 'var(--muted)'};
const ROTB_ANOS = {esquerda: 'Esquerda', centro: 'Centro', direita: 'Direita',
                   sem_classificacao: 'Sem classificação', misto: 'misto'};
const BLOCOS_ANOS = ['esquerda', 'centro', 'direita', 'sem_classificacao'];

/* Partidos na série da linhagem, um ano por coluna. Embaixo do número, as
 * legendas que ele soma quando a série juntou partidos ou tinha outro nome
 * na época; em amarelo, o provisório do ano ao vivo (liderando ou vaga
 * ainda não marcada pelo TSE), nunca somado como eleito. `limite` corta a
 * lista e soma o resto numa linha, para a coluna fechar a conta. */
function tabelaSeries(d, anos, cabAno, limite) {
  const chave = d.variacao_par;
  const [pa, pb] = chave ? chave.split('-') : [];
  const celula = (se, a) => {
    const x = se.anos[a];
    if (!x || !x.cadeiras) return el('td', {cls: 'num null'}, '—');
    return el('td', {cls: 'num'},
      el('div', {}, el('b', {}, String(x.eleito)),
        x.provisorio ? el('span', {cls: 'tag warn',
          style: 'margin-left:5px'}, `+${x.provisorio} prov.`) : null),
      x.composta ? el('div', {style: 'font-size:11px;color:var(--muted)'},
        x.componentes.map(c => `${c.sigla} ${c.cadeiras}`).join(' + '))
        : null,
      x.bloco !== 'sem_classificacao'
        ? el('div', {style: `font-size:11px;color:${CORB_ANOS[x.bloco]}`},
             ROTB_ANOS[x.bloco]) : null);
  };
  const variacao = (se) => {
    const v = se.variacao[chave];
    return el('td', {cls: 'num', style: 'color:' + (v > 0 ? '#5fbf7a'
        : v < 0 ? '#e2574c' : 'var(--muted)')},
      v > 0 ? `+${v}` : v < 0 ? `−${-v}` : '=');
  };
  const lista = limite ? d.series.slice(0, limite) : d.series;
  const resto = limite ? d.series.slice(limite) : [];
  return el('table', {}, el('thead', {}, el('tr', {},
      el('th', {}, 'Partido (linhagem)'), ...anos.map(cabAno),
      chave ? el('th', {cls: 'num'}, `${pa} → ${pb}`) : null)),
    el('tbody', {}, ...lista.map(se => el('tr', {},
      el('td', {}, el('span', {cls: 'sw',
        style: `background:${se.cor};margin-right:6px`}), el('b', {}, se.sigla)),
      ...anos.map(a => celula(se, a)),
      chave ? variacao(se) : null)),
      resto.length ? el('tr', {style: 'color:var(--muted)'},
        el('td', {}, `outras ${resto.length} legendas`),
        ...anos.map(a => el('td', {cls: 'num'}, String(resto.reduce(
          (s, se) => s + ((se.anos[a] || {}).cadeiras || 0), 0)))),
        chave ? el('td', {}, '') : null) : null));
}

/* Senado: duas colunas por ano — eleitos naquele ano e a casa inteira.
 * As linhas são as séries da composição (que contém as dos eleitos); a
 * variação é a da casa inteira, que é a pergunta "o Senado mudou?". */
function tabelaSeriesDupla(d, anos, cabDupla, limite) {
  const eleitos = new Map(d.series.map(s => [s.serie, s]));
  const chave = d.variacao_par_composicao;
  const [pa, pb] = chave ? chave.split('-') : [];
  const num = (x, sep) => {
    const st = sep ? 'border-left:1px solid var(--line)' : null;
    if (!x || !x.cadeiras) return el('td', {cls: 'num null', style: st}, '—');
    return el('td', {cls: 'num', style: st},
      el('div', {}, el('b', {}, String(x.eleito)),
        x.provisorio ? el('span', {cls: 'tag warn',
          style: 'margin-left:5px'}, `+${x.provisorio} prov.`) : null),
      x.composta ? el('div', {style: 'font-size:11px;color:var(--muted)'},
        x.componentes.map(c => `${c.sigla} ${c.cadeiras}`).join(' + '))
        : null);
  };
  return el('table', {}, el('thead', {}, el('tr', {},
      el('th', {}, 'Partido (linhagem)'), ...anos.flatMap(cabDupla),
      chave ? el('th', {cls: 'num'}, `Senado ${pa} → ${pb}`) : null)),
    el('tbody', {}, ...(limite ? d.series_composicao.slice(0, limite)
                               : d.series_composicao).map(se => {
      const e = eleitos.get(se.serie) || {anos: {}};
      const v = chave ? se.variacao[chave] : null;
      return el('tr', {},
        el('td', {}, el('span', {cls: 'sw',
          style: `background:${se.cor};margin-right:6px`}),
          el('b', {}, se.sigla)),
        ...anos.flatMap(a => [num(e.anos[a], false), num(se.anos[a], true)]),
        chave ? el('td', {cls: 'num', style: 'color:' + (v > 0 ? '#5fbf7a'
            : v < 0 ? '#e2574c' : 'var(--muted)')},
          v > 0 ? `+${v}` : v < 0 ? `−${-v}` : '=') : null);
    })));
}

/* Câmara ano a ano: 513 cadeiras por bloco e por partido. Cada partido
 * segue a linhagem assinada até a legenda de hoje, e a célula diz de quais
 * legendas veio o número (União 2018 = PSL 52 + DEM 29). Bloco é o da
 * legenda naquela eleição: o agregado soma legenda a legenda. É a bancada
 * ELEITA, não a de hoje — troca de partido no mandato fica fora. */
async function viewCamaraAnos() {
  const r = await get('/comparativo/camara');
  rodape(r);
  const d = r.dados;
  const anos = d.anos.map(String).filter(a => d.colunas[a]
                                         && !d.colunas[a].sem_dado);
  const vazios = d.anos.map(String).filter(a => !anos.includes(a));
  if (!anos.length) {
    return el('div', {cls: 'estado'},
      'Nenhum ano importado ainda. Rode "obs2026 importar-historico".');
  }

  const cabAno = (a) => {
    const c = d.colunas[a];
    return el('th', {cls: 'num'}, el('div', {}, a),
      c.parcial
        ? el('div', {style: 'color:var(--alerta);font-size:11px;'
              + 'font-weight:400'}, `parcial · ${c.ufs_encerradas}/27 UFs`)
        : el('div', {style: 'color:var(--muted);font-size:11px;'
              + 'font-weight:400'}, 'resultado final'));
  };

  const porBloco = el('table', {}, el('thead', {}, el('tr', {},
      el('th', {}, 'Bloco'), ...anos.map(cabAno))),
    el('tbody', {}, ...BLOCOS_ANOS.map(b => el('tr', {},
      el('td', {}, el('span', {cls: 'sw',
        style: `background:${CORB_ANOS[b]};margin-right:6px`}), ROTB_ANOS[b]),
      ...anos.map(a => {
        const pb_ = d.colunas[a].por_bloco;
        const x = pb_[b];
        if (!x) return el('td', {cls: 'num null'}, '—');
        // Base: as cadeiras daquele ano (o simulado declara 532, não 513).
        const tot = Object.values(pb_).reduce((s, v) => s + v, 0);
        return el('td', {cls: 'num'}, el('b', {}, fmt(x)),
          el('span', {style: 'color:var(--muted);font-size:11.5px'},
             ` · ${pct(100 * x / tot, 1)}`));
      })))));

  const avisos = [];
  for (const a of anos) {
    const c = d.colunas[a];
    if (c.vagas_declaradas && c.vagas_declaradas !== d.total) {
      avisos.push(`${a}: o TSE declara ${c.vagas_declaradas} vagas, não `
        + `${d.total} — dado de teste do simulado.`);
    }
    if (c.classificacao_motivo) avisos.push(`${a}: ${c.classificacao_motivo}.`);
  }
  return el('div', {},
    el('h2', {}, 'Câmara dos Deputados — bancadas eleição a eleição'),
    el('div', {cls: 'nota'}, el('b', {}, 'Como ler. '), d.nota),
    !d.linhagem_ativa
      ? el('div', {cls: 'nota aten'}, el('b', {}, 'Linhagem pendente. '),
          'Cada ano mostra a legenda da época e as séries não se ligam.')
      : null,
    avisos.length
      ? el('div', {cls: 'nota aten'}, avisos.join(' ')) : null,
    el('h2', {}, 'Por bloco'), porBloco,
    el('h2', {}, 'Por partido'),
    el('div', {cls: 'nota'}, `Ordem: bancada de ${d.ordem_por}. Embaixo do `
      + 'número, as legendas que ele soma quando a série juntou partidos ou '
      + 'a legenda tinha outro nome.'),
    tabelaSeries(d, anos, cabAno),
    vazios.length
      ? el('div', {cls: 'nota'}, 'Sem dado para: ' + vazios.map(a =>
          `${a} (${d.colunas[a] ? d.colunas[a].motivo : 'sem coluna'})`)
          .join(', ') + '.')
      : null);
}

/* Os 27 estados, eleição a eleição. Resultado FINAL de cada ano: onde
 * houve 2º turno vale o 2º, senão a tela diria que o estado "mudou de lado"
 * quando só mudou a etapa. Senador conta cadeiras, não estados: 2018 e 2026
 * elegem dois por UF, 2022 um. */
async function viewPanoramaAnos(cd) {
  const r = await get(`/comparativo/governadores?cargo=${cd}`);
  rodape(r);
  const d = r.dados;
  const anos = d.anos.map(String).filter(a => (d.agregado[a] || {}).vagas);
  const unidade = d.unidade || 'estados';

  const cabAno = (a) => {
    const g = d.agregado[a] || {};
    return el('th', {cls: 'num'}, el('div', {}, a),
      el('div', {style: `color:var(--${g.parcial ? 'alerta' : 'muted'});`
          + 'font-size:11px;font-weight:400'},
        g.parcial ? 'ao vivo · parcial' : `${g.vagas} ${unidade}`));
  };

  // Agregado: quantas cadeiras (ou estados) e quanto eleitorado por bloco,
  // com o percentual sobre o total do ano. No Senado, duas colunas por ano
  // (pedido de 24/09): quem se elegeu NAQUELE ano e a casa inteira — as 81,
  // somando quem continuava. Sem a segunda, "13 de esquerda em 2018" parecia
  // ser o Senado de 2018.
  const senado = !!d.series_composicao;
  const totalEleit = (ano) => Object.values(
    (d.agregado[ano] || {}).por_bloco || {})
    .reduce((s, x) => s + (x.eleitorado || 0), 0);
  const cabDupla = (a) => {
    const g = d.agregado[a] || {};
    const c = g.composicao || {};
    return [
      el('th', {cls: 'num'}, el('div', {}, `${a} · eleitos`),
        el('div', {style: `color:var(--${g.parcial ? 'alerta' : 'muted'});`
            + 'font-size:11px;font-weight:400'},
          g.parcial ? 'ao vivo · parcial' : `${g.vagas} no ano`)),
      el('th', {cls: 'num', style: 'border-left:1px solid var(--line)'},
        el('div', {}, `${a} · Senado`),
        el('div', {style: 'color:var(--muted);font-size:11px;'
            + 'font-weight:400'}, `${c.cadeiras || '—'} de 81`)),
    ];
  };
  const celBloco = (n, tot, extra) => (!n)
    ? el('td', {cls: 'num null'}, '—')
    : el('td', {cls: 'num', style: extra || null},
        el('b', {}, String(n)),
        el('span', {style: 'color:var(--muted);font-size:11.5px'},
           ` · ${pct(100 * n / tot, 1)}`));
  const agregado = el('table', {}, el('thead', {}, el('tr', {},
      el('th', {}, 'Bloco'),
      ...anos.flatMap(a => senado ? cabDupla(a) : [cabAno(a)]))),
    el('tbody', {}, ...BLOCOS_ANOS.map(b => el('tr', {},
      el('td', {}, el('span', {cls: 'sw',
        style: `background:${CORB_ANOS[b]};margin-right:6px`}), ROTB_ANOS[b]),
      ...anos.flatMap(a => {
        const g = d.agregado[a] || {};
        const x = (g.por_bloco || {})[b];
        if (senado) {
          const c = g.composicao || {};
          return [celBloco(x && x.cadeiras, g.vagas),
                  celBloco((c.por_bloco || {})[b], c.cadeiras,
                           'border-left:1px solid var(--line)')];
        }
        if (!x || !x.cadeiras) return [el('td', {cls: 'num null'}, '—')];
        const tot = totalEleit(a);
        return [el('td', {cls: 'num'},
          el('div', {}, el('b', {}, `${x.cadeiras} ${unidade}`),
            el('span', {style: 'color:var(--muted);font-size:11.5px'},
               ` · ${pct(100 * x.cadeiras / g.vagas, 1)}`)),
          el('div', {style: 'font-size:11.5px;color:var(--muted)'},
             tot ? `${pct(100 * x.eleitorado / tot, 0)} do eleitorado` : ''))];
      })))));
  // O que a composição não conta, dito: vaga sem ocupante, suplementar,
  // régua de outro ano, remanescentes que faltam.
  const notasComp = senado ? anos.flatMap(a => {
    const c = (d.agregado[a] || {}).composicao || {};
    const out = [];
    if (c.remanescentes && c.remanescentes.motivo) {
      out.push(`${a}: ${c.remanescentes.motivo}`);
    }
    if (c.sem_ocupante) {
      out.push(`${a}: ${c.sem_ocupante} cadeira sem ocupante no arquivo do `
        + 'TSE (eleição da vaga anulada; a suplementar veio depois)');
    }
    for (const s of c.suplementares || []) {
      out.push(`${a}: ${s.uf.toUpperCase()} com ${s.sigla}, eleito em `
        + `suplementar em ${s.eleito_em} — quem ocupou a vaga`);
    }
    for (const r of c.classificados_pela_regua_de || []) {
      out.push(`${a}: eleitos em ${r} classificados pela régua de ${a} `
        + '(partido levado pela linhagem)');
    }
    return out;
  }) : [];

  const umEleito = (v, x) => {
    const b = (v.ideologia || {}).bloco || 'sem_classificacao';
    return el('div', {style: 'margin-bottom:3px'},
      el('div', {},
        el('span', {cls: 'sw', style: `background:${CORB_ANOS[b]};`
          + 'margin-right:5px'}),
        el('b', {}, v.nome),
        x.parcial ? el('span', {cls: 'tag warn', style: 'margin-left:5px'},
          `lidera · ${pct(x.apurado_pct, 0)}`) : null),
      el('div', {style: 'font-size:11.5px;color:var(--muted)'},
        v.partido,
        x.turno === '2' ? ' · 2º turno' : '',
        (v.linhagem && v.linhagem.nota && v.linhagem.linhagem_ativa)
          ? ` · ${v.linhagem.nota}` : ''));
  };
  const cel = (x) => {
    if (!x) return el('td', {}, el('span', {cls: 'null'}, '—'));
    return el('td', {}, ...(x.vencedores || [x]).map(v => umEleito(v, x)));
  };
  const porUf = el('table', {}, el('thead', {}, el('tr', {},
      el('th', {}, 'UF'), ...anos.map(a => el('th', {}, a)))),
    el('tbody', {}, ...d.ufs.map(u => el('tr', {
        style: 'cursor:pointer', onclick: () => { st.uf = u.uf; }},
      el('td', {}, el('b', {}, u.uf.toUpperCase())),
      ...anos.map(a => cel(u.anos[a]))))));

  const semClass = anos
    .map(a => (d.agregado[a] || {}).classificacao_motivo)
    .filter(Boolean);
  const titulo = d.cargo_nome === 'senador' ? 'Senadores' : 'Governadores';
  // Vagas sem eleito no arquivo do TSE (MT/2018): o total do ano fica
  // menor, e a tela diz por quê.
  const semEleito = anos.flatMap(a => ((d.agregado[a] || {}).sem_eleito || [])
    .map(x => `${a}: ${x.uf.toUpperCase()} (${x.vagas})`));
  return el('div', {},
    el('h2', {}, `${titulo} — o país eleição a eleição`),
    el('div', {cls: 'nota'}, el('b', {}, 'Como ler. '), d.nota),
    !d.linhagem_ativa
      ? el('div', {cls: 'nota aten'}, el('b', {}, 'Linhagem pendente. '),
          'Cada ano mostra a legenda da época e as séries não se ligam.')
      : null,
    semClass.length
      ? el('div', {cls: 'nota'}, el('b', {}, 'Ideologia incompleta: '),
           semClass.join(' · ')) : null,
    semEleito.length
      ? el('div', {cls: 'nota aten'}, el('b', {}, 'Vaga sem eleito no '
          + 'arquivo do TSE: '), semEleito.join(' · ') + '. A eleição da '
          + 'vaga foi anulada e refeita depois, em eleição suplementar, que '
          + 'não entra no ano; o total daquele ano fica menor.') : null,
    el('h2', {}, 'Por bloco'), agregado,
    notasComp.length
      ? el('div', {cls: 'nota'}, el('b', {}, 'Composição. '),
           notasComp.join(' · ')) : null,
    el('h2', {}, 'Por partido'),
    el('div', {cls: 'nota'}, senado
      ? `Ordem: Senado em ${d.ordem_por}. Em cada ano, os eleitos naquele `
        + 'ano e a casa inteira; embaixo do número, as legendas que ele soma.'
      : `Ordem: ${unidade} em ${d.ordem_por}.`
        + ' Embaixo do número, as legendas que ele soma.'),
    senado ? tabelaSeriesDupla(d, anos, cabDupla) : tabelaSeries(d, anos, cabAno),
    el('h2', {}, 'Estado a estado'),
    el('div', {cls: 'nota'}, 'Clique num estado para ver a evolução dele.'),
    porUf);
}

/* Resumo ano a ano: os quatro cargos numa página só — quem ganhou a
 * Presidência e com quanto, a participação efetiva, e governadores,
 * Senado e Câmara por bloco e pelas maiores séries da linhagem. É a
 * leitura "o que mudou no país" de uma vez; cada bloco abre a tela
 * completa do cargo. Os dados são os das telas de cada cargo, sem conta
 * nova: o resumo não pode dizer uma coisa e a tela do cargo outra. */
async function viewResumoAnos() {
  const [p1, p2, gov, sen, cam] = await Promise.all([
    get('/comparativo?cargo=1&turno=1'),
    get('/comparativo?cargo=1&turno=2'),
    get('/comparativo/governadores?cargo=3'),
    get('/comparativo/governadores?cargo=5'),
    get('/comparativo/camara'),
  ]);
  rodape(cam);

  // Presidente: a participação vem do 1º turno (é quando todo o eleitorado
  // vota em tudo); o eleito, do turno que decidiu — o 2º onde houve. O ano
  // ao vivo só tem 1º turno e sai marcado como parcial.
  const col1 = {}, col2 = {};
  for (const c of p1.dados.colunas) if (!c.sem_dado) col1[c.ano] = c;
  for (const c of p2.dados.colunas) if (!c.sem_dado) col2[c.ano] = c;
  const anosP = Object.keys(col1).sort();
  const decisivo = (a) => (col2[a] && !col2[a].parcial && a !== '2026')
    ? {c: col2[a], turno: '2º turno'} : {c: col1[a], turno: '1º turno'};
  const quem = (a) => {
    const {c, turno} = decisivo(a);
    const x = (c.candidatos || [])[0];
    if (!x) return el('span', {cls: 'null'}, '—');
    const b = (x.ideologia || {}).bloco;
    return el('div', {},
      el('b', {}, x.nome), ' ',
      el('span', {style: 'color:var(--muted)'}, `${x.partido} · `
        + `${pct(x.pct_validos, 1)} · ${turno}`),
      c.parcial ? el('span', {cls: 'tag warn', style: 'margin-left:5px'},
        `lidera · ${pct(c.apurado_pct, 0)}`) : null,
      b ? el('div', {style: `font-size:11.5px;color:${CORB_ANOS[b]}`},
             ROTB_ANOS[b]) : null);
  };
  const presidente = el('table', {}, el('thead', {}, el('tr', {},
      el('th', {}, ''), ...anosP.map(a => el('th', {}, a)))),
    el('tbody', {},
      el('tr', {}, el('td', {}, 'Presidente'),
        ...anosP.map(a => el('td', {}, quem(a)))),
      el('tr', {}, el('td', {}, 'Participação efetiva',
          el('div', {style: 'color:var(--muted);font-size:11.5px'},
             'válidos sobre o eleitorado, 1º turno')),
        ...anosP.map(a => el('td', {}, el('b', {},
          pct(col1[a].participacao_efetiva_pct, 1)),
          el('span', {style: 'color:var(--muted);font-size:11.5px'},
            ` · abstenção ${pct(col1[a].abstencao_sobre_aptos_pct, 1)}`))))));

  // Um bloco por casa: barra de blocos por ano e as maiores séries.
  const bloco = (titulo, d, anos, porBloco, unidade, abrir) => {
    const cab = (a) => el('th', {cls: 'num'}, a);
    // Senado: duas linhas por ano — eleitos no ano e a casa inteira.
    const linhas = anos.flatMap(a => {
      const c = (d.agregado && (d.agregado[a] || {}).composicao) || null;
      return c ? [{a, pb: porBloco(a), rot: a},
                  {a, pb: c.por_bloco, rot: 'Senado', sec: true}]
               : [{a, pb: porBloco(a), rot: a}];
    });
    const barras = el('div', {}, ...linhas.map(({a, pb, rot, sec}) => {
      const tot = BLOCOS_ANOS.reduce((s, b) => s + (pb[b] || 0), 0);
      return el('div', {style: 'display:flex;align-items:center;gap:8px;'
          + `margin:${sec ? '0 0 8px' : '4px 0 2px'}`},
        el(sec ? 'span' : 'b', {style: 'width:40px;'
          + (sec ? 'font-size:11px;color:var(--muted)' : '')}, rot),
        el('div', {style: 'flex:1;display:flex;height:18px;border-radius:4px;'
            + 'overflow:hidden;background:var(--line)'},
          ...BLOCOS_ANOS.filter(b => pb[b]).map(b => el('div', {
            title: `${ROTB_ANOS[b]}: ${pb[b]} ${unidade}`,
            style: `width:${tot ? 100 * pb[b] / tot : 0}%;background:`
              + `${CORB_ANOS[b]};color:#0b0f14;font-size:11px;`
              + 'font-weight:700;text-align:center;line-height:18px;'
              + 'overflow:hidden;white-space:nowrap'}, String(pb[b])
              + (pb[b] / tot >= .2 ? ` · ${pct(100 * pb[b] / tot, 1)}`
                                   : '')))),
        el('span', {style: 'width:90px;color:var(--muted);font-size:11.5px'},
           `${tot} ${unidade}`));
    }));
    return el('div', {style: 'min-width:0'},
      el('h2', {}, titulo, ' ',
        el('a', {href: '#', style: 'font-size:12px;font-weight:400',
          onclick: (e) => { e.preventDefault(); abrir(); }},
          'abrir completo ›')),
      barras,
      d.series_composicao
        ? tabelaSeriesDupla(d, anos, (a) => [
            el('th', {cls: 'num'}, `${a} el.`),
            el('th', {cls: 'num', style: 'border-left:1px solid var(--line)'},
               'Senado')], 6)
        : tabelaSeries(d, anos, cab, 6));
  };

  const anosG = gov.dados.anos.map(String)
    .filter(a => (gov.dados.agregado[a] || {}).vagas);
  const anosS = sen.dados.anos.map(String)
    .filter(a => (sen.dados.agregado[a] || {}).vagas);
  const anosC = cam.dados.anos.map(String)
    .filter(a => cam.dados.colunas[a] && !cam.dados.colunas[a].sem_dado);
  const pbPanorama = (d) => (a) => {
    const out = {};
    for (const b of BLOCOS_ANOS) {
      out[b] = ((d.agregado[a].por_bloco || {})[b] || {}).cadeiras || 0;
    }
    return out;
  };
  const irPara = (cd) => () => {
    const u = new URLSearchParams(location.search);
    u.set('cargo', cd); u.delete('resumo'); u.delete('uf');
    history.replaceState(null, '', location.pathname + '?' + u);
    render();
  };

  const parciais = [gov, sen].some(x => Object.values(x.dados.agregado)
      .some(g => g && g.parcial))
    || Object.values(cam.dados.colunas).some(c => c && c.parcial);
  const avisos = [];
  const vagas26 = (cam.dados.colunas['2026'] || {}).vagas_declaradas;
  if (vagas26 && vagas26 !== cam.dados.total) {
    avisos.push(`2026: dado de teste do simulado (${vagas26} vagas na `
      + 'Câmara, partidos fictícios). Ordem e variação usam só 2018 e 2022.');
  }
  return el('div', {},
    el('h2', {}, 'O país eleição a eleição — resumo'),
    el('div', {cls: 'nota'}, el('b', {}, 'Como ler. '),
      'Resultado final do TSE em cada ano (2º turno onde houve). Partidos '
      + 'seguem a linhagem assinada até a legenda de hoje; bloco é o da '
      + 'legenda naquele ano. Senado: 2018 e 2026 renovam duas cadeiras por '
      + 'estado, 2022 uma.'
      + (parciais ? ' O ano ao vivo aparece como parcial: quem lidera não '
         + 'é eleito.' : '')),
    !cam.dados.linhagem_ativa
      ? el('div', {cls: 'nota aten'}, el('b', {}, 'Linhagem pendente. '),
          'As séries não se ligam entre os anos.') : null,
    avisos.length ? el('div', {cls: 'nota aten'}, avisos.join(' ')) : null,
    el('h2', {}, 'Presidência'), presidente,
    el('div', {style: 'display:grid;grid-template-columns:'
        + 'repeat(auto-fit,minmax(320px,1fr));gap:18px'},
      bloco('Governadores', gov.dados, anosG, pbPanorama(gov.dados),
            'estados', irPara('3')),
      bloco('Senado', sen.dados, anosS, pbPanorama(sen.dados),
            'cadeiras', irPara('5')),
      bloco('Câmara', cam.dados, anosC, (a) => cam.dados.colunas[a].por_bloco,
            'cadeiras', irPara('6'))));
}

function escolherVisao() {
  const visao = st.visao || 'resultado';
  // Senador sem UF: a composição do Senado, não "escolha uma UF".
  if (cargoAtual().cd === '5' && !st.uf && visao === 'resultado')
    return viewSenado;
  if (cargoAtual().cd === '3' && !st.uf && visao === 'resultado')
    return viewPanoramaGov;
  if (cargoAtual().especial && visao !== 'telao' && visao !== 'config'
      && visao !== 'comparar')
    return viewRecordes;
  // Deputado federal tem visão própria; Telão, Configuração e Comparar
  // continuam.
  if (cargoAtual().proporcional && visao !== 'telao' && visao !== 'config'
      && visao !== 'comparar')
    return viewCamara;
  if (cargoAtual().estadual && visao !== 'telao' && visao !== 'config')
    return viewAssembleias;
  return {resultado: viewResultado, mapa: viewMapa,
          projecao: viewProjecao, auditoria: viewAuditoria,
          convergencia: viewConvergencia, telao: viewTelao,
          comparar: viewComparar, config: viewConfig}[visao]
         || viewResultado;
}

/* Cada render leva um número; só o mais novo escreve na tela. Sem isso,
 * uma resposta lenta chegava depois de uma troca de aba e pisava na tela
 * nova — clicar em Deputado federal e logo em Comparar deixava a
 * composição na tela com a aba Comparar marcada (visto em 24/09). */
let renderAtual = 0;
async function render() {
  const meu = ++renderAtual;
  navegacao();
  const main = document.getElementById('main');
  poe(main, el('div', {cls: 'estado'}, 'carregando…'));
  try {
    const cat = await get('/elections');
    document.getElementById('sub').textContent =
      cat.dados.map(e => e.nome.split(' - ')[0]).join(' · ');
    // Limpa quando não há aviso: ao voltar de 2022 para um ambiente
    // oficial, a faixa "ELEIÇÃO DE 2022" não pode ficar para trás.
    poe(document.getElementById('aviso'), cat.ambiente.aviso
      ? el('div', {cls: eleicaoPedida() ? 'aviso passado' : 'aviso'},
           cat.ambiente.aviso)
      : null);
    const fn = escolherVisao();
    const novo = await fn();
    if (meu !== renderAtual) return;
    poe(main, novo);
    AUTO.ultima = new Date();
    marcarAuto();
  } catch (e) {
    if (meu !== renderAtual) return;
    poe(main, el('div', {cls: 'estado'},
      el('span', {cls: 'tag err'}, 'erro'), ' ' + e.message));
  }
}
render();
</script>
