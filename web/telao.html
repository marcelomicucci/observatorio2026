        + (s ? sep : '')}, String(x.eleito),
        x.provisorio ? el('span', {style: `font-size:${U(.85)};`
          + 'color:#e0b45a'}, ` +${x.provisorio}`) : null);
  const chave = d.variacao_par_composicao;
  const [pa, pb] = chave ? chave.split('-') : [];
  const origem = (se) => {
    const a = anos.find(x => (se.anos[x] || {}).composta);
    return a ? `${a}: ` + se.anos[a].componentes
      .map(c => `${c.sigla} ${c.cadeiras}`).join(' + ') : null;
  };
  return el('table', {style: 'width:100%;border-collapse:collapse;'
      + `font-size:${U(1.1)};color:#e6ebf2;font-variant-numeric:tabular-nums`},
    el('thead', {}, el('tr', {style: `color:#8a95a6;font-size:${U(.85)}`},
      el('th', {style: 'text-align:left'}, 'Partido'),
      ...anos.flatMap(a => [el('th', {style: td + sep}, `${a} el.`),
                            el('th', {style: td}, `Senado`)]),
      chave ? el('th', {style: td + sep}, `${pa}→${pb}`) : null)),
    el('tbody', {},
      ...topo.map(se => {
        const e = eleitos.get(se.serie) || {anos: {}};
        const v = chave ? se.variacao[chave] : null;
        const o = comOrigem ? origem(se) : null;
        return el('tr', {style: 'border-top:1px solid #1e2632'},
          el('td', {style: `padding:${U(.28)} 0;white-space:nowrap`},
            el('span', {style: `display:inline-block;width:${U(.8)};`
              + `height:${U(.8)};border-radius:50%;background:${se.cor};`
              + `margin-right:${U(.4)}`}),
            el('b', {}, se.sigla),
            o ? el('span', {style: `font-size:${U(.78)};color:#8a95a6;`
                  + `margin-left:${U(.5)}`}, o) : null),
          ...anos.flatMap(a => [cel(e.anos[a], false, true),
                                cel(se.anos[a], true, false)]),
          chave ? el('td', {style: td + sep + ';color:' + (v > 0 ? '#5fbf7a'
              : v < 0 ? '#e2574c' : '#8a95a6')},
            v > 0 ? `+${v}` : v < 0 ? `−${-v}` : '=') : null);
      }),
      resto.length ? el('tr', {style: 'border-top:1px solid #1e2632;'
          + 'color:#8a95a6'},
        el('td', {style: `padding:${U(.28)} 0`},
           `outras ${resto.length}`),
        ...anos.flatMap(a => {
          const soma = (m) => resto.reduce((s, se) =>
            s + ((((m ? eleitos.get(se.serie) : se) || {anos: {}}).anos[a]
                  || {}).cadeiras || 0), 0);
          return [el('td', {style: td + sep}, String(soma(true))),
                  el('td', {style: td}, String(soma(false)))];
        }),
        chave ? el('td', {}, '') : null) : null));
}

/* Linhas de barras do panorama: uma por ano; no Senado, duas — eleitos no
 * ano e a casa inteira (81), que é o que o Senado era depois da posse. */
function linhasPanorama(d, lista, unidade) {
  const out = [];
  for (const a of lista) {
    const g = d.agregado[a];
    const pb = {};
    for (const b of BLOCOS_T) pb[b] = (g.por_bloco[b] || {}).cadeiras || 0;
    const se = (g.sem_eleito || []).reduce((s, x) => s + x.vagas, 0);
    const c = g.composicao;
    out.push({ano: a, por_bloco: pb, alerta: g.parcial || se > 0,
              primaria: !!c,
              sub: g.parcial ? 'ao vivo · lidera'
                : `${g.vagas} ${c ? 'eleitos' : unidade}`
                  + (se ? ` · ${se} sem eleito` : '')});
    if (c) {
      out.push({ano: a, secundaria: true, rotulo: 'Senado',
                por_bloco: c.por_bloco, alerta: c.cadeiras < 81,
                sub: `${c.cadeiras} de 81`});
    }
  }
  return out;
}

/* Panorama: governadores ou senadores do país, eleição a eleição — barras
 * por bloco e os partidos na linhagem. No telão cabe o agregado; a tabela
 * estado a estado é do painel. */
async function carregarPanoramaAnos(cargo, anos, minhaCarga, desatualizada) {
  const corpo = document.getElementById('corpo');
  const r = await get(`/comparativo/governadores?cargo=${cargo}&anos=${anos}`);
  if (desatualizada()) return;
  faixaAmbiente(r.ambiente);
  const d = r.dados;
  const lista = d.anos.map(String).filter(a => (d.agregado[a] || {}).vagas);
  const unidade = d.unidade || 'estados';
  document.getElementById('titulo').textContent =
    cargo === '5' ? 'Senadores — o país eleição a eleição'
                  : 'Governadores — o país eleição a eleição';
  document.getElementById('vagas').hidden = true;
  document.getElementById('onde').textContent =
    cargo === '5' ? 'cadeiras eleitas em cada ano · 2 por estado em 2018 e '
                    + '2026, 1 em 2022'
                  : 'resultado final de cada ano · 2º turno onde houve';
  const assin = 'panorama|' + cargo + '|' + JSON.stringify(
    [d.agregado, d.series.slice(0, 12).map(s => s.anos)]);
  if (assin === assinaturaPolitica && corpo.dataset.tipo === 'comparativo') {
    return;
  }
  const U = U_;
  const linhas = linhasPanorama(d, lista, unidade);

  // Governador: quais estados mudaram de bloco entre os dois anos do par
  // (os dois últimos com partidos reconhecidos — no simulado, 2026 é
  // ficção e ficaria "nenhum estado mudou").
  let trocas = null;
  if (cargo === '3' && d.variacao_par) {
    const [antes, depois] = d.variacao_par.split('-');
    const mudou = [];
    for (const u of d.ufs) {
      const a = u.anos[antes], b = u.anos[depois];
      if (!a || !b) continue;
      const ba = (a.ideologia || {}).bloco, bb = (b.ideologia || {}).bloco;
      if (ba && bb && ba !== bb) mudou.push({uf: u.uf, de: ba, para: bb});
    }
    trocas = mudou.length
      ? el('div', {style: `margin-top:${U(.4)};font-size:${U(1)};`
          + 'color:#c7ced9;line-height:1.5'},
          el('div', {style: 'color:#8a95a6'},
             `Mudaram de bloco de ${antes} para ${depois}:`),
          ...mudou.slice(0, 10).map((m, i) => el('span', {},
            i ? ' · ' : '',
            el('b', {}, m.uf.toUpperCase()), ' ',
            el('span', {style: `color:${COR_BLOCO[m.de]}`}, ROT_BLOCO[m.de]),
            ' → ',
            el('span', {style: `color:${COR_BLOCO[m.para]}`},
               ROT_BLOCO[m.para]))))
      : el('div', {style: `margin-top:${U(.4)};font-size:${U(1)};`
          + 'color:#8a95a6'}, 'Nenhum estado mudou de bloco no período.');
  }
  // Ano em que nenhuma legenda tem bloco: no simulado, partidos fictícios.
  const semBloco = lista.filter(a => {
    const g = d.agregado[a];
    return g.vagas && (g.por_bloco.sem_classificacao || {}).cadeiras
      === g.vagas;
  });
  const nota = el('div', {style: `font-size:${U(.9)};color:#8a95a6;`
      + `margin-top:${U(.8)};line-height:1.4`},
    semBloco.length ? el('div', {style: 'color:#e0b45a'},
      `${semBloco.join(', ')}: legendas fora do cadastro, sem bloco — `
      + 'ordem e variação usam os outros anos') : null,
    'Bloco pela legenda naquele ano. '
    + (d.linhagem_ativa ? 'Partidos ligados pela linhagem assinada.'
                        : 'Linhagem não assinada: séries não ligadas.')
    + (lista.some(a => d.agregado[a].parcial)
       ? ' Em amarelo, quem lidera em 2026 — não é eleito.' : ''));

  if (desatualizada()) return;
  corpo.dataset.tipo = 'comparativo';
  corpo.className = 'corpo comparativo';
  poe(corpo, el('div', {style: `display:flex;gap:${U(1.6)}`},
    el('div', {style: 'flex:1.05;min-width:0'},
      barrasBloco(linhas), trocas, nota),
    el('div', {style: 'flex:1;min-width:0'}, tabelaSeriesTelao(d, lista))));
  assinaturaPolitica = assin;
  rodapePolitico(r.source_generated_at,
    'resultado final do TSE em 2018 e 2022 · 2026 ao vivo');
}

/* Câmara ano a ano: as 513 cadeiras por bloco (uma barra por eleição) e as
 * maiores bancadas, cada partido na série da linhagem assinada. */
async function carregarCamaraAnos(anos, desatualizada) {
  const corpo = document.getElementById('corpo');
  const r = await get(`/comparativo/camara?anos=${anos}`);
  if (desatualizada()) return;
  faixaAmbiente(r.ambiente);
  const d = r.dados;
  const lista = d.anos.map(String).filter(a => d.colunas[a]
                                          && !d.colunas[a].sem_dado);
  document.getElementById('titulo').textContent =
    'Câmara — bancadas eleição a eleição';
  document.getElementById('vagas').hidden = true;
  document.getElementById('onde').textContent =
    '513 cadeiras · bancada eleita em cada ano';
  const assin = 'camara-anos|' + anos + '|' + JSON.stringify(
    lista.map(a => [a, d.colunas[a].por_bloco, d.colunas[a].provisorio]));
  if (assin === assinaturaPolitica && corpo.dataset.tipo === 'comparativo') {
    return;
  }
  const U = U_;
  const linhas = lista.map(a => {
    const c = d.colunas[a];
    return {ano: a, por_bloco: c.por_bloco, alerta: c.parcial,
            sub: c.parcial ? (c.provisorio
                              ? `parcial · ${c.provisorio} provisórias`
                              : 'parcial') : null};
  });

  const avisos = [];
  for (const a of lista) {
    const c = d.colunas[a];
    if (c.vagas_declaradas && c.vagas_declaradas !== d.total) {
      avisos.push(`${a}: o TSE declara ${c.vagas_declaradas} vagas `
        + `(dado de teste), não ${d.total}`);
    }
    if (c.por_bloco.sem_classificacao
        && c.por_bloco.sem_classificacao === c.eleitos_tse + c.provisorio) {
      avisos.push(`${a}: legendas fora do cadastro, sem bloco`);
    }
  }
  const nota = el('div', {style: `font-size:${U(.9)};color:#8a95a6;`
      + `margin-top:${U(.8)};line-height:1.4`},
    avisos.length ? el('div', {style: 'color:#e0b45a'},
                       avisos.join(' · ')) : null,
    'Bancada eleita (posse), não a atual. Bloco pela legenda naquele ano. '
    + (d.linhagem_ativa ? 'Partidos ligados pela linhagem assinada.'
                        : 'Linhagem não assinada: séries não ligadas.')
    + (lista.includes('2026') && d.colunas['2026'].provisorio
       ? ' Em amarelo, vagas provisórias de 2026 (muda a cada boletim).'
       : ''));

  if (desatualizada()) return;
  corpo.dataset.tipo = 'comparativo';
  corpo.className = 'corpo comparativo';
  poe(corpo, el('div', {style: `display:flex;gap:${U(1.6)}`},
    el('div', {style: 'flex:1.05;min-width:0'}, barrasBloco(linhas), nota),
    el('div', {style: 'flex:1;min-width:0'}, tabelaSeriesTelao(d, lista))));
  assinaturaPolitica = assin;
  rodapePolitico(r.source_generated_at,
    'resultado final do TSE em 2018 e 2022 · 2026 ao vivo');
}

/* Resumo: o país eleição a eleição numa tela só. Em cima, a Presidência
 * (quem ganhou, com quanto, e a participação efetiva); embaixo, três
 * colunas — governadores, Senado e Câmara — com a barra por bloco de cada
 * ano e as maiores séries da linhagem. Os números são os mesmos das telas
 * de cada cargo: o resumo não faz conta própria. */
async function carregarResumoAnos(anos, desatualizada) {
  const corpo = document.getElementById('corpo');
  const [p1, p2, gov, sen, cam] = await Promise.all([
    get(`/comparativo?cargo=1&turno=1&anos=${anos}`),
    get(`/comparativo?cargo=1&turno=2&anos=${anos}`),
    get(`/comparativo/governadores?cargo=3&anos=${anos}`),
    get(`/comparativo/governadores?cargo=5&anos=${anos}`),
    get(`/comparativo/camara?anos=${anos}`),
  ]);
  if (desatualizada()) return;
  faixaAmbiente(cam.ambiente);
  document.getElementById('titulo').textContent =
    'O país eleição a eleição';
  document.getElementById('vagas').hidden = true;
  document.getElementById('onde').textContent =
    'Presidência, governadores, Senado e Câmara · resultado final de cada ano';
  const assin = 'resumo|' + anos + '|' + JSON.stringify([
    p1.dados.colunas.map(c => [c.ano, c.participacao_efetiva_pct]),
    p2.dados.colunas.map(c => [c.ano, (c.candidatos || [])[0]]),
    gov.dados.agregado, sen.dados.agregado,
    Object.values(cam.dados.colunas).map(c => c.por_bloco)]);
  if (assin === assinaturaPolitica && corpo.dataset.tipo === 'comparativo') {
    return;
  }
  const U = U_;

  // Presidência: participação do 1º turno; eleito do turno que decidiu.
  const col1 = {}, col2 = {};
  for (const c of p1.dados.colunas) if (!c.sem_dado) col1[c.ano] = c;
  for (const c of p2.dados.colunas) if (!c.sem_dado) col2[c.ano] = c;
  const anosP = Object.keys(col1).sort();
  const cartaoPres = (a) => {
    const final = col2[a] && !col2[a].parcial && a !== '2026';
    const c = final ? col2[a] : col1[a];
    const x = (c.candidatos || [])[0];
    const b = x && (x.ideologia || {}).bloco;
    return el('div', {style: 'background:#121821;border:1px solid #232c3a;'
        + `border-radius:${U(.5)};padding:${U(.6)} ${U(.9)};flex:1;`
        + `min-width:0;display:flex;gap:${U(.9)};align-items:center`},
      el('div', {style: `font-size:${U(1.7)};font-weight:800`}, a),
      el('div', {style: 'flex:1;min-width:0'},
        x ? el('div', {style: `font-size:${U(1.15)};font-weight:700;`
              + 'white-space:nowrap;overflow:hidden;text-overflow:ellipsis'},
              el('span', {style: `display:inline-block;width:${U(.7)};`
                + `height:${U(.7)};border-radius:50%;background:`
                + `${b ? COR_BLOCO[b] : '#6b7687'};margin-right:${U(.35)}`}),
              x.nome) : el('div', {}, '—'),
        x ? el('div', {style: `font-size:${U(.85)};color:#aab4c3`},
              `${x.partido} · ${pct(x.pct_validos, 1)} · `
              + (final ? '2º turno' : c.parcial
                 ? `lidera · ${pct(c.apurado_pct, 0)}` : '1º turno'))
          : null),
      el('div', {style: 'text-align:right'},
        el('div', {style: `font-size:${U(1.2)};font-weight:700`},
           pct(col1[a].participacao_efetiva_pct, 1)),
        el('div', {style: `font-size:${U(.7)};color:#8a95a6`},
           'participação efetiva')));
  };

  const coluna = (titulo, d, lista, pbDe, unidade) => el('div', {
      style: 'flex:1;min-width:0'},
    el('div', {style: `font-size:${U(1.3)};font-weight:800;`
        + `margin-bottom:${U(.5)}`}, titulo),
    barrasBloco(d.series_composicao ? linhasPanorama(d, lista, unidade)
      : lista.map(a => {
        const pb = pbDe(a);
        const tot = BLOCOS_T.reduce((s, b) => s + (pb[b] || 0), 0);
        return {ano: a, por_bloco: pb, sub: `${tot} ${unidade}`};
      }), d.series_composicao ? .6 : .7),
    tabelaSeriesTelao(d, lista, 8, .8, false));
  const pbPanorama = (d) => (a) => {
    const out = {};
    for (const b of BLOCOS_T) {
      out[b] = ((d.agregado[a].por_bloco || {})[b] || {}).cadeiras || 0;
    }
    return out;
  };
  const anosG = gov.dados.anos.map(String)
    .filter(a => (gov.dados.agregado[a] || {}).vagas);
  const anosS = sen.dados.anos.map(String)
    .filter(a => (sen.dados.agregado[a] || {}).vagas);
  const anosC = cam.dados.anos.map(String)
    .filter(a => cam.dados.colunas[a] && !cam.dados.colunas[a].sem_dado);

  const vagas26 = (cam.dados.colunas['2026'] || {}).vagas_declaradas;
  const nota = el('div', {style: `font-size:${U(.8)};color:#8a95a6;`
      + `margin-top:${U(.6)}`},
    vagas26 && vagas26 !== cam.dados.total
      ? el('span', {style: 'color:#e0b45a'}, '2026: dado de teste do '
          + 'simulado; ordem e variação usam 2018 e 2022. ') : null,
    'Bloco pela legenda naquele ano; partidos pela linhagem assinada. '
    + 'Senado: 2 cadeiras por estado em 2018 e 2026, 1 em 2022.');

  if (desatualizada()) return;
  corpo.dataset.tipo = 'comparativo';
  corpo.className = 'corpo comparativo';
  poe(corpo, el('div', {},
    el('div', {style: `display:flex;gap:${U(.8)};margin-bottom:${U(1)}`},
      ...anosP.map(cartaoPres)),
    el('div', {style: `display:flex;gap:${U(1.4)}`},
      coluna('Governadores', gov.dados, anosG, pbPanorama(gov.dados),
             'estados'),
      coluna('Senado', sen.dados, anosS, pbPanorama(sen.dados), 'cadeiras'),
      coluna('Câmara', cam.dados, anosC, a => cam.dados.colunas[a].por_bloco,
             'cadeiras')),
    nota));
  assinaturaPolitica = assin;
  rodapePolitico(cam.source_generated_at,
    'resultado final do TSE em 2018 e 2022 · 2026 ao vivo');
}

/* Placar (07/10/2026): o duelo de uma vaga — presidente, ou governador de
 * uma UF — numa tela só. O desenho é o de web/placar.js, o mesmo da página
 * de ensaio /placar. `abrangencia` do roteiro diz se o mapa vai com (mu) ou
 * sem (uf) municípios. */
async function carregarPlacar(minhaCarga, desatualizada) {
  const gov = recorte.cargo === '3';
  const uf = gov ? String(recorte.uf || '').toLowerCase() : null;
  const corpo = document.getElementById('corpo');
  document.getElementById('titulo').textContent =
    gov ? 'Governador' : 'Presidente';
  document.getElementById('onde').textContent = gov
    ? (POLITICO.NOME_UF[uf] || (uf || '').toUpperCase())
    : 'Brasil · inclui o exterior';
  document.getElementById('vagas').hidden = true;
  // As outras telas comparam assinatura para não redesenhar; ao sair daqui
  // elas têm de desenhar de novo.
  assinaturaPolitica = null;
  const res = await PLACAR.desenhar(corpo, {
    cargo: gov ? '3' : '1', uf, get, velha: desatualizada,
    municipios: recorte.abrangencia ? recorte.abrangencia === 'mu' : null,
    semTitulo: true, propagar: true, esperar: ESTATICO,
    aoAmbiente: amb => {
      faixaAmbiente(amb);
      // A grade da tela muda junto com o conteúdo, não antes: até o
      // primeiro dado chegar fica a tela anterior, inteira.
      corpo.dataset.tipo = 'placar';
      corpo.className = 'corpo recordes';
    },
  });
  if (desatualizada() || !res) return;
  rodapePolitico(res.source_generated_at,
    (res.denominador && res.denominador.rotulo)
    + ' · tracejado e roxo = projeção, não resultado');
}

async function carregar() {
  const minhaCarga = ++cargaAtual;
  const desatualizada = () => minhaCarga !== cargaAtual;

  const ESPECIAIS = {politico: carregarPolitico,
    composicao: carregarComposicao, recordes: carregarRecordes,
    comparativo: carregarComparativo, panorama: carregarPanorama,
    duelo: carregarDuelo, participacao: carregarParticipacao,
    estado: carregarEstado, blocos: carregarBlocos,
    placar: carregarPlacar};
  if (ESPECIAIS[recorte.tipo]) {
    try {
      await (ESPECIAIS[recorte.tipo])(
        minhaCarga, desatualizada);
    } catch (err) {
      if (!desatualizada()) {
        assinaturaPolitica = null;
        poe(document.getElementById('corpo'),
          el('div', {cls: 'vazio'}, 'erro: ' + err.message));
        prontidao('erro');
      }
      return;
    }
    if (desatualizada()) return;
    document.getElementById('atualizacao').textContent =
      'atualizado às ' + new Date().toLocaleTimeString('pt-BR',
        {timeZone: 'America/Sao_Paulo'});
    prontidao('1');
    return;
  }
  // Tipo que esta página não conhece: quase sempre é o telão aberto antes
  // de uma atualização do sistema. Cair no mapa em silêncio faz o operador
  // achar que o botão do painel não funcionou (visto em 23/09).
  const CONHECIDOS = ['mapa', ...Object.keys(ESPECIAIS)];
  if (recorte.tipo && !CONHECIDOS.includes(recorte.tipo)) {
    assinaturaPolitica = null;
    document.getElementById('titulo').textContent = 'Tela desconhecida';
    poe(document.getElementById('corpo'), el('div', {cls: 'vazio'},
      `Esta janela não conhece a tela "${recorte.tipo}". `
      + 'Atualize o telão (F5) para carregar a versão nova.'));
    prontidao('erro');
    return;
  }

  // Tela de mapa: devolve a grade padrão, se uma tela política a trocou.
  assinaturaPolitica = null;
  const corpoMapa = document.getElementById('corpo');
  corpoMapa.className = 'corpo';
  corpoMapa.dataset.tipo = 'mapa';
  const cargo = CARGOS[recorte.cargo] || CARGOS['1'];
  const mun = recorte.municipio || null;
  const uf = mun ? recorte.uf : (cargo.abr === 'uf' ? recorte.uf : null);
  const corpo = document.getElementById('corpo');

  document.getElementById('titulo').textContent = cargo.nome;
  document.getElementById('onde').textContent =
    mun ? (recorte.titulo || 'recorte municipal')
    : cargo.abr === 'br' ? 'Brasil · inclui o exterior'
    : (uf ? uf.toUpperCase() : 'escolha uma UF no controle');
  const tv = document.getElementById('vagas');
  tv.hidden = cargo.vagas < 2;
  tv.textContent = `${cargo.vagas} vagas`;

  if (cargo.abr === 'uf' && !uf && !mun) {
    poe(corpo, el('div', {cls: 'vazio'},
      `${cargo.nome} é decidido em cada estado. Escolha a UF na tela de `
      + 'controle.'));
    prontidao('erro');
    return;
  }

  try {
    const qs = `cargo=${recorte.cargo}` + (uf ? `&uf=${uf}` : '')
      + (mun ? `&municipio=${mun}` : '');
    const [res, cands, def, mapa, proj] = await Promise.all([
      get(`/results?abrangencia=${mun ? 'mu' : cargo.abr}&${qs}`),
      get(`/candidates?${qs}`),
      get(`/decided?${qs}`).catch(() => null),
      // No recorte municipal o mapa mostra a UF inteira: um município
      // sozinho não diz nada sobre onde ele fica.
      get(`/map-layers?cargo=${recorte.cargo}&abrangencia=`
          + (cargo.abr === 'br' && !mun ? 'uf' : 'mu')
          + (uf ? `&uf=${uf}` : ''))
        .catch(() => null),
      // Projeção é acessória no telão: se falhar, o apurado continua.
      projecaoEmCache(qs),
    ]);

    if (desatualizada()) return;   // outra tela ja assumiu
    const faixa = document.getElementById('faixa');
    if (res.ambiente.aviso) {
      faixa.textContent = res.ambiente.aviso;
      faixa.className = 'faixa pisca';
    } else {
      faixa.className = 'faixa oficial';
    }

    if (!res.dados.length) {
      poe(corpo, el('div', {cls: 'vazio'},
        res.status_motivo || 'sem dados para este recorte'));
      prontidao('erro');
      return;
    }

    const u = res.dados[0];
    const dfn = def && def.dados && def.dados[0];
    const estados = {};
    if (dfn) for (const c of dfn.candidatos) estados[c.sqcand] = c;
    // Melhor caso de um candidato: todo o resto vai para ele. Maioria
    // possível se 2·V + R > C (votos a concorrentes já contados).
    const cObs = u.votos && u.votos.validos_computados;
    const resto = dfn ? dfn.resto_maximo_total : null;
    turnoCerto = !!(dfn && resto != null && cObs > 0
      && !(((cands.dados || [])[0] || {}).candidatos || []).some(
        c => 2 * c.oficial.votos + resto > cObs));

    const lista = (((cands.dados || [])[0] || {}).candidatos || [])
      // Votos; empate (e tudo zerado) em ordem alfabética.
      .slice().sort((a, b) => (b.oficial.votos - a.oficial.votos)
      || String(a.oficial.nome_urna).localeCompare(
           String(b.oficial.nome_urna), 'pt-BR'));
    const projecoes = {};
    if (proj && proj.dados) for (const x of proj.dados) projecoes[x.sqcand] = x;
    const chamada = proj && proj.chamada;
    // A escala das barras considera apurado E projetado: senão a barra da
    // projeção estoura quando ela supera o líder atual.
    const maxPct = Math.max(
      ...lista.map(c => c.oficial.pct || 0),
      ...Object.values(projecoes).map(x => x.projecao.pct_mediana || 0), 0);
    // Num telão cabem poucas linhas legíveis, e linha cortada pela metade
    // parece defeito. Com a linha de projeção cada cartão fica mais alto,
    // então o corte é conservador: no Senado mostra até o 5º, que é o
    // primeiro fora das duas vagas — a informação que decide a leitura.
    const quantas = cargo.vagas > 1 ? 5 : 4;

    const e = u.eleitorado;
    const cob = e.total ? 100 * e.apurado / e.total : null;
    const lado = el('div', {cls: 'lado'},
      el('div', {cls: 'kpis'},
        kpi('Apurado', pct(cob, 2), `${fmt(e.apurado)} eleitores`),
        kpi('Comparecimento', pct(e.comparecimento_pct, 1),
            'do eleitorado apurado'),
        kpi(u.pendente.max > 0 ? 'Faltam entrar' : 'Situação',
            u.pendente.max > 0 ? fmt(u.pendente.max)
            : (dfn && dfn.disputa_matematicamente_definida ? 'definida'
               : dfn && dfn.segundo_turno_matematicamente_definido
                 && turnoCerto ? '2º turno' : 'em aberto'),
            u.pendente.max > 0 ? 'eleitores no máximo'
            : (u.andamento === 'f' ? 'apuração encerrada' : 'em andamento'))),
      el('div', {cls: 'lista'},
        ...lista.slice(0, quantas).map((c, i) =>
          linha(c, i, maxPct, estados, projecoes, chamada,
                dfn && dfn.recorte_nao_decisorio,
                dfn && dfn.sub_judice_em_jogo))),
      proj && proj.dados
        ? el('div', {cls: 'tira'}, el('span', {cls: 'pt'}),
            proj.publicavel
              ? `Projeção ${proj.modelo.toUpperCase()} · mediana e intervalo `
                + `de ${(proj.dados[0] && proj.dados[0].projecao.faixa
                         && proj.dados[0].projecao.faixa.nivel)
                        || proj.nivel_intervalo || 80}% · `
                + `${fmt(proj.n_sims)} simulações`
              // Disputa encerrada não é "cenário exploratório": o número da
              // tela é o resultado do TSE, e a faixa é só o último retrato
              // da projeção. Dizer "não é previsão publicada" aqui faria a
              // sala duvidar de um resultado oficial (visto em 23/09).
              : proj.status === 'resultado_oficial'
                ? `Apuração encerrada: resultado oficial do TSE. A faixa é `
                  + `o último registro da projeção ${(proj.modelo || '')
                     .toUpperCase()}.`
                : 'Cenário exploratório, não previsão publicada: o gate '
                  + 'estatístico ainda não passou, e nenhuma probabilidade '
                  + 'de vitória é divulgada.')
        : null,
      // Sub judice só suspende quando MUDA quem se define (regra de
      // 23/09): o motor compara o cenário de validação com o de cassação.
      // Quando não muda, a conta vale e o aviso diz só que os votos seguem
      // pendentes — antes a tela dizia "suspensa" mesmo com os selos de
      // definição na mesma linha.
      dfn && dfn.sub_judice_em_jogo
        ? el('div', {cls: 'aviso'},
            'Os selos valem com os votos sub judice validados. Se a Justiça '
            + 'cassá-los, muda quem se define — por isso os dois cenários '
            + 'aparecem até a decisão.')
        : (dfn && (dfn.avisos || []).some(a => a.includes('sub judice'))
            ? el('div', {cls: 'aviso'},
                'Há votos sub judice pendentes de decisão judicial, mas '
                + 'validados ou cassados os mesmos nomes se definem.')
            : null),
      // §3: liderar um território não é ser eleito por ele. Num telão esse
      // aviso é obrigatório, não opcional.
      mun && recorte.aviso_recorte
        ? el('div', {cls: 'recorte'}, recorte.aviso_recorte) : null);

    if (desatualizada()) return;
    const caixaMapa = el('div', {cls: 'mapa'});
    poe(corpo, caixaMapa, lado);

    let pintura = Promise.resolve();
    if (mapa && mapa.dados && mapa.dados.length) {
      pintura = MAPA.desenhar(caixaMapa, mapa.dados, {
        // O desenho tambem pode terminar tarde; o alvo ja foi substituido
        // se outra tela assumiu, entao pintar nele e inofensivo.
        malha: mapa.malha, camada: recorte.camada || 'lider',
        recorte: mapa.recorte_ibge, largura: 900, altura: 900,
      }).catch(() => poe(caixaMapa,
        el('div', {cls: 'vazio'}, 'mapa indisponível')));
    } else if (uf) {
      /* Sem resultado por município naquela UF — no começo da noite, ou
       * porque a varredura ainda não passou por lá. "Sem mapa para este
       * recorte" num telão parece defeito, e o painel inteiro fica com
       * meia tela vazia. O mapa de estados já existe: enquadrado na UF e
       * com ela destacada, ele ainda diz onde se está olhando, e a nota
       * diz o que falta. */
      pintura = get(`/map-layers?cargo=${recorte.cargo}&abrangencia=uf`)
        .then(e => {
          if (desatualizada()) return;
          const alvo = (e.dados || []).find(d => d.uf === uf);
          if (!alvo) throw new Error('sem dado da UF');
          return MAPA.desenhar(caixaMapa, e.dados, {
            malha: e.malha, camada: recorte.camada || 'lider',
            foco: alvo.cd_ibge, destaque: alvo.cd_ibge,
            largura: 900, altura: 900,
          }).then(() => {
            caixaMapa.style.position = 'relative';
            caixaMapa.append(el('div', {
              style: 'position:absolute;left:1vw;bottom:1vh;right:1vw;'
                   + 'font-size:1vw;color:var(--muted);text-align:center',
            }, `Resultado por município em ${uf.toUpperCase()} ainda sem `
               + 'dado — mostrando o estado.'));
          });
        })
        .catch(() => poe(caixaMapa, el('div', {cls: 'vazio'},
          `resultado por município em ${uf.toUpperCase()} ainda sem dado`)));
    } else {
      poe(caixaMapa, el('div', {cls: 'vazio'}, 'sem mapa para este recorte'));
    }
    // No telão ao vivo o mapa aparece quando ficar pronto — esperar por ele
    // deixaria os números parados. Na captura é o contrário: uma foto do
    // mapa ainda em branco não serve para nada.
    if (ESTATICO) await pintura;

    // Horário da fonte e da captura, sempre — inclusive no telão (§5.1).
    document.getElementById('fonte').replaceChildren(
      document.createTextNode('Fonte TSE: '),
      el('b', {}, brt(res.source_generated_at)),
      document.createTextNode('  ·  capturado ' + brt(res.captured_at)),
      document.createTextNode('  ·  ' + res.denominador.rotulo));
  } catch (err) {
    if (!desatualizada()) {
      poe(corpo, el('div', {cls: 'vazio'}, 'erro: ' + err.message));
      // A captura lê isto e recusa gravar: mandar para um grupo a foto de
      // uma tela de erro é pior do que não mandar foto nenhuma.
      prontidao('erro');
    }
    return;
  }
  if (desatualizada()) return;
  document.getElementById('atualizacao').textContent =
    'atualizado às ' + new Date().toLocaleTimeString('pt-BR',
      {timeZone: 'America/Sao_Paulo'});
  prontidao('1');
}

(async () => {
  await carregarRoteiro();

  if (ESTATICO) {
    // Uma tela, parada. Nenhum temporizador: o carrossel não pode trocar de
    // recorte entre o carregamento e o obturador.
    // O rodapé de progresso sai da foto: "tela 1/5 · 20s" é instrumento do
    // operador, não informação para quem vai receber a imagem.
    document.getElementById('passo').textContent = '';
    document.getElementById('progresso').style.width = '0';
    if (TELA_FIXA !== null) {
      const t = roteiro.find(x => x.indice === TELA_FIXA);
      if (!t) {
        prontidao('erro');
        console.error(`tela ${TELA_FIXA} não existe no roteiro`);
        return;
      }
      if (t.erro) {
        // Cair para outra tela seria fotografar o lugar errado com o título
        // certo. A captura prefere não sair.
        prontidao('erro');
        console.error(`tela ${TELA_FIXA} não resolve: ${t.erro}`);
        return;
      }
      roteiro = [t];
      aplicarTela(t);
    } else {
      await carregar();
    }
    return;
  }

  if (telasValidas().length) irPara(0); else carregar();
  setInterval(tique, 1000);
  // Atualização dos dados, independente da troca de telas: o telão não
  // depende de ninguém mexer no controle. 10 s: o total do estado chega ao
  // banco a cada 10 s pelo coletor, e esperar 30 s aqui desperdiçaria dois
  // terços disso. A leitura é barata; a projeção, que não é, fica em cache.
  setInterval(carregar, 10000);
  buscarAlertas().then(girarAlertas);
  setInterval(buscarAlertas, 20000);
  setInterval(girarAlertas, 7000);
  // O roteiro pode ser editado no arquivo durante a noite; releitura
  // periódica evita ter que recarregar a janela do projetor.
  setInterval(async () => {
    const antes = JSON.stringify(roteiro.map(t => t.titulo + t.segundos));
    await carregarRoteiro();
    if (JSON.stringify(roteiro.map(t => t.titulo + t.segundos)) !== antes) {
      irPara(0);
    }
  }, 120000);
})();
</script>
