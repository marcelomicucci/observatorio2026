<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telão — Observatório Eleitoral 2026</title>
<style>
/* Tela de projeção. Rota separada, não um "modo" do painel: a densidade de
   informação é outra. O que se lê a 40 cm não se lê a 4 m.
 *
 * Decisões que vêm dessa distância:
 *   - tudo dimensionado em vw, para preencher qualquer projetor
 *   - cinco números no máximo por tela; o resto é o mapa
 *   - nada clicável: o controle está no notebook
 *   - o aviso de ambiente ocupa faixa inteira, porque num telão um erro de
 *     leitura vira manchete
 *   - horário da fonte sempre visível (§5.1), mesmo aqui
 */
:root{
  --bg:#0b0e13; --fg:#f2f5f9; --muted:#8e99a8; --line:#222834;
  --panel:#141922; --acento:#5aa2f0; --ok:#42c98a; --alerta:#f5b544;
  /* Projeção tem cor própria. No telão, a distância apaga legendas
     pequenas; se apurado e projetado compartilhassem cor, alguém leria
     estimativa como resultado. */
  --proj:#b98ae8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
 font:400 16px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 overflow:hidden}
.tela{height:100vh;display:flex;flex-direction:column;padding:1.6vh 1.8vw}

.faixa{background:#f5b544;color:#2a1a00;font-weight:800;text-align:center;
 padding:.7vh 0;font-size:1.5vw;letter-spacing:.06em;border-radius:.5vw;
 margin-bottom:1.2vh;text-transform:uppercase}
.faixa.oficial{display:none}

.cabeca{display:flex;align-items:baseline;gap:1.4vw;flex-wrap:wrap;
 margin-bottom:1vh}
.cabeca h1{font-size:2.6vw;margin:0;font-weight:750;letter-spacing:-.02em}
.cabeca .onde{font-size:1.5vw;color:var(--muted)}
.cabeca .vagas{font-size:1.2vw;color:var(--acento);border:1px solid var(--acento);
 border-radius:2vw;padding:.2vh .8vw}

.corpo{flex:1;display:grid;grid-template-columns:1.05fr .95fr;gap:1.6vw;
 min-height:0}
.mapa{background:var(--panel);border:1px solid var(--line);border-radius:1vw;
 padding:.6vw;display:flex;align-items:center;justify-content:center;
 min-height:0;overflow:hidden}
.mapa svg{max-height:100%}
.lado{display:flex;flex-direction:column;gap:1.1vh;min-height:0}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:.8vw}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:.8vw;
 padding:.9vh 1vw}
.kpi .k{font-size:.85vw;text-transform:uppercase;letter-spacing:.09em;
 color:var(--muted)}
.kpi .v{font-size:2.5vw;font-weight:700;font-variant-numeric:tabular-nums;
 letter-spacing:-.03em;line-height:1.05}
.kpi .n{font-size:.85vw;color:var(--muted)}

.lista{flex:1;display:flex;flex-direction:column;gap:.9vh;min-height:0;
 overflow:hidden}
.linha{background:var(--panel);border:1px solid var(--line);border-radius:.8vw;
 padding:.7vh 1.1vw;display:flex;align-items:center;gap:1vw}
.linha.topo{border-color:var(--acento)}
.linha.definido{border-color:var(--ok)}
.linha .foto{width:4.2vw;height:4.2vw;border-radius:50%;object-fit:cover;
 flex:0 0 auto;background:#1d2430;border:1px solid var(--line)}
.linha .num{width:4.2vw;height:4.2vw;border-radius:50%;flex:0 0 auto;
 display:flex;align-items:center;justify-content:center;background:#1d2430;
 border:1px solid var(--line);font-size:1.7vw;font-weight:800;
 color:var(--muted);font-variant-numeric:tabular-nums}
.linha .info{flex:1;min-width:0}
.linha .nome{font-size:1.6vw;font-weight:700;letter-spacing:-.02em;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.linha .part{font-size:1vw;color:var(--muted)}
.linha .barra{height:.7vh;background:#1d2430;border-radius:1vh;margin-top:.5vh;
 overflow:hidden}
.linha .barra i{display:block;height:100%;background:var(--acento)}
.linha.definido .barra i{background:var(--ok)}
.linha .pct{font-size:2.6vw;font-weight:800;font-variant-numeric:tabular-nums;
 letter-spacing:-.03em;text-align:right;min-width:6vw}
.linha .abs{font-size:.9vw;color:var(--muted);text-align:right}
.linha .proj{font-size:1.05vw;color:var(--proj);text-align:right;
 font-variant-numeric:tabular-nums;white-space:nowrap}
.linha .barra i.p{background:var(--proj);opacity:.55}
.linha .barra{position:relative}
.linha .barra i.p{position:absolute;top:0;left:0}
.tira{display:flex;align-items:center;gap:.8vw;background:#241a33;
 border:1px solid #3d2b55;color:#e0cdf5;border-radius:.7vw;
 padding:.6vh 1vw;font-size:1.05vw}
.tira .pt{width:1.1vw;height:1.1vw;border-radius:.3vw;background:var(--proj);
 flex:0 0 auto}
.selo{font-size:.85vw;padding:.15vh .7vw;border-radius:2vw;
 border:1px solid var(--ok);color:var(--ok);white-space:nowrap}

.pe{display:flex;justify-content:space-between;align-items:center;
 gap:1vw;margin-top:1vh;font-size:1vw;color:var(--muted);flex-wrap:wrap}
.pe b{color:var(--fg);font-weight:600}
.aviso{background:#3a2a08;border:1px solid #6b4d10;color:#f7d79a;
 border-radius:.7vw;padding:.7vh 1vw;font-size:1.05vw;margin-top:.8vh}
.vazio{grid-column:1/-1;display:flex;align-items:center;justify-content:center;
 font-size:1.6vw;color:var(--muted);text-align:center;padding:4vh}
.pisca{animation:p 2.4s ease-in-out infinite}
/* Barra de progresso da tela atual. Quem olha de longe precisa saber que a
   tela vai trocar, senao a troca parece falha do sistema. */
.trilho{height:.45vh;background:#1d2430;border-radius:1vh;overflow:hidden;
 margin-bottom:.9vh}
.trilho i{display:block;height:100%;background:var(--acento);width:0;
 transition:width .9s linear}
.passo{font-size:1vw;color:var(--muted);white-space:nowrap}
.recorte{background:#2a2410;border:1px solid #574a19;color:#f0dfa8;
 border-radius:.7vw;padding:.5vh 1vw;font-size:1.05vw;margin-top:.8vh}
.pausado{color:var(--alerta);font-weight:700}
@keyframes p{0%,100%{opacity:1}50%{opacity:.55}}

/* Telas políticas: dois mapas lado a lado e uma coluna de números; ou o
   hemiciclo e a lista de bancadas. */
.corpo.politico{grid-template-columns:1fr 1fr .82fr;gap:1.2vw}
.corpo.politico.um{grid-template-columns:1.35fr .65fr}
.corpo.composicao{grid-template-columns:1.3fr .9fr}
.corpo.recordes{display:block;--u:1vw;overflow:hidden}
/* Faixa das últimas novidades (engine/alertas.py), no pé da tela como o
   gerador de caracteres de um telejornal. Uma por vez, em rodízio. */
.alertas{display:flex;align-items:center;gap:1vw;margin-top:1vh;
 background:#101826;border:1px solid #27405f;border-left:.5vw solid var(--acento);
 border-radius:.6vw;padding:.9vh 1.1vw;font-size:1.35vw;min-height:5.2vh;
 overflow:hidden;white-space:nowrap}
.alertas[hidden]{display:none}
.alertas.conta{border-left-color:var(--ok)}
.alertas.probabilidade{border-left-color:var(--proj)}
.alertas-rot{font-size:.95vw;font-weight:800;letter-spacing:.1em;
 text-transform:uppercase;color:var(--acento)}
.alertas-hora{color:var(--muted);font-variant-numeric:tabular-nums}
.alertas-tit{font-weight:800}
.alertas-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.alertas-n{font-size:.9vw;color:var(--muted)}
.alertas .troca{animation:entra .5s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(.8vh)}to{opacity:1}}
.corpo.comparativo{display:block;--u:1vw;overflow:hidden}
.pmapa{background:var(--panel);border:1px solid var(--line);border-radius:1vw;
 padding:.8vh .8vw;display:flex;flex-direction:column;gap:.6vh;min-height:0;
 overflow:hidden}
.pmapa-svg{flex:1;min-height:0;display:flex;align-items:center;
 justify-content:center}
.pmapa-svg svg{max-height:100%;width:auto}
.pmapa-pe{display:flex;flex-direction:column;gap:.5vh}
.pmapa-leg .legend{display:flex;flex-wrap:wrap;gap:.3vh .9vw;font-size:.85vw;
 color:#c7ced9}
.pmapa-leg .legend span{display:inline-flex;align-items:center;gap:.3vw}
.pmapa-leg .legend .sw{display:inline-block;width:.9vw;height:.9vw;
 border-radius:.2vw}
.pbloco-t{font-size:.95vw;text-transform:uppercase;letter-spacing:.08em;
 color:var(--muted);font-weight:700}
.pnota{text-transform:none;letter-spacing:0;font-weight:400;font-size:.85vw}
.plado{display:flex;flex-direction:column;gap:1.1vh;min-height:0;
 overflow:hidden}
.phem{background:var(--panel);border:1px solid var(--line);border-radius:1vw;
 padding:1.2vh 1.2vw;display:flex;flex-direction:column;gap:1.2vh;min-height:0}
.phem-svg{flex:1;min-height:0;display:flex;align-items:flex-end;
 justify-content:center}
.phem-svg svg{max-height:100%}
@media (max-aspect-ratio:1/1){
  .corpo{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
}
</style>
</head>
<body>
<div class="tela">
  <div class="trilho"><i id="progresso"></i></div>
  <div class="faixa" id="faixa"></div>
  <div class="cabeca">
    <h1 id="titulo">Observatório Eleitoral 2026</h1>
    <span class="onde" id="onde"></span>
    <span class="vagas" id="vagas" hidden></span>
    <span class="passo" id="passo" style="margin-left:auto"></span>
  </div>
  <div class="corpo" id="corpo">
    <div class="vazio">carregando…</div>
  </div>
  <div class="alertas" id="alertas" hidden>
    <span class="alertas-rot">Últimas</span>
    <span class="alertas-hora" id="alertas-hora"></span>
    <span class="alertas-tit" id="alertas-tit"></span>
    <span class="alertas-txt" id="alertas-txt"></span>
    <span class="alertas-n" id="alertas-n"></span>
  </div>
  <div class="pe">
    <span id="fonte"></span>
    <span id="atualizacao"></span>
  </div>
</div>

<script src="/mapa.js"></script>
<script src="/politico.js"></script>
<script src="/telas.js"></script>
<script src="/placar.js"></script>
<script>
const API = '/api/v1';
const fmt = n => n == null ? '—' : n.toLocaleString('pt-BR');
const pct = (v, d = 1) => v == null ? '—'
  : v.toFixed(d).replace('.', ',') + '%';
const brt = s => s ? new Date(s).toLocaleTimeString('pt-BR',
  {timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit',
   second: '2-digit'}) : '—';
const el = (t, a = {}, ...k) => {
  const n = document.createElement(t);
  for (const [x, v] of Object.entries(a)) {
    if (v == null) continue;
    if (x === 'cls') n.className = v; else n.setAttribute(x, v);
  }
  for (const c of k.flat()) if (c != null)
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
};
const poe = (a, ...k) => a.replaceChildren(...k.flat().filter(x => x != null));

const CARGOS = {
  '1': {nome: 'Presidente', abr: 'br', vagas: 1},
  '3': {nome: 'Governador', abr: 'uf', vagas: 1},
  '5': {nome: 'Senador', abr: 'uf', vagas: 2},
};

/* O telão é conduzido pelo notebook. BroadcastChannel liga as duas janelas
 * do mesmo navegador sem passar pelo servidor: trocar de cargo no controle
 * muda o telão na hora.
 *
 * Se a janela de controle fechar, o telão NÃO para: mantém o último recorte
 * (guardado em localStorage) e segue atualizando os dados sozinho. Numa noite
 * de apuração, tela preta por fechar a janela errada é inaceitável. */
let recorte = {cargo: '1', uf: null, camada: 'lider'};
try {
  const g = localStorage.getItem('telao-recorte');
  if (g) recorte = {...recorte, ...JSON.parse(g)};
} catch (e) { /* armazenamento indisponível: segue com o padrão */ }

const p = new URLSearchParams(location.search);
if (p.get('cargo')) recorte.cargo = p.get('cargo');
if (p.get('uf')) recorte.uf = p.get('uf');
if (p.get('municipio')) recorte.municipio = p.get('municipio');
if (p.get('camada')) recorte.camada = p.get('camada');
if (p.get('titulo')) recorte.titulo = p.get('titulo');
if (p.get('tipo')) recorte.tipo = p.get('tipo');
if (p.get('casa')) recorte.casa = p.get('casa');
if (p.get('abrangencia')) recorte.abrangencia = p.get('abrangencia');
if (p.get('anos')) recorte.anos = p.get('anos');
// Sempre sobrescreve: um recorte guardado de 2022 não pode vazar para uma
// janela aberta sem pedir eleição passada.
recorte.eleicao = p.get('eleicao') || null;
if (recorte.municipio) {
  // §3 não é opcional e não depende de quem montou a URL: recorte municipal
  // sempre sai com o aviso de que liderar ali não é ser eleito por ali.
  recorte.aviso_recorte = 'Recorte do voto. A disputa é decidida '
    + (recorte.cargo === '1' ? 'no total do Brasil'
       : 'no total de ' + (recorte.uf || '').toUpperCase())
    + ' — liderar aqui não é ser eleito por aqui.';
}

/* Modo estático: uma tela, parada, sem carrossel e sem atualização
 * automática. É o que a captura de imagem usa.
 *
 * Um navegador sem cabeça fotografando o telão normal fotografaria uma tela
 * em movimento: o carrossel pode trocar de recorte entre o carregamento e o
 * clique do obturador, e a imagem sairia com o título de um lugar e os
 * números de outro. Aqui os temporizadores simplesmente não são criados.
 *
 * `?tela=N` escolhe a tela pelo `indice` do roteiro — o índice do arquivo,
 * não a posição depois de filtrar as inválidas. Se a tela N tiver erro de
 * resolução, a captura falha em vez de fotografar outra: uma foto que sai
 * com o município errado é pior do que uma foto que não sai. */
const ESTATICO = p.get('estatico') === '1';
const TELA_FIXA = p.get('tela') !== null ? parseInt(p.get('tela'), 10) : null;

/* Marca para o obturador: enquanto não for '1', a página ainda está
 * desenhando. Sem isso a captura teria que adivinhar um tempo de espera, e
 * adivinhar erra sempre para um dos lados — foto em branco ou foto tardia. */
function prontidao(v) {
  document.documentElement.setAttribute('data-pronto', v);
}
prontidao('0');

let canal = null;
try {
  // No modo estático ninguém pode mudar o recorte: um comando do controle
  // chegando durante a captura trocaria a tela debaixo do obturador.
  if (ESTATICO) throw new Error('captura: sem canal de controle');
  canal = new BroadcastChannel('observatorio-telao');
  canal.onmessage = ev => {
    const d = ev.data || {};
    if (d.tipo === 'recorte') {
      // Recorte manual interrompe o carrossel: quem mexeu quer ver aquilo.
      // E segura — a releitura periódica do arquivo não pode devolver o
      // carrossel sozinha dois minutos depois. Quem volta é o "retomar
      // roteiro" do painel.
      roteiro = [];
      roteiroDeSessao = true;
      recorte = {...recorte, ...d.recorte};
      try {
        localStorage.setItem('telao-recorte', JSON.stringify(recorte));
      } catch (e) { /* segue sem persistir */ }
      carregar();
    } else if (d.tipo === 'roteiro') {
      roteiro = d.roteiro || [];
      // Lista montada na sessão: a releitura periódica do arquivo não pode
      // derrubá-la. Sem esta marca, dois minutos depois de o operador montar
      // a sequência o telão voltaria sozinho ao roteiro do arquivo — no meio
      // da apuração, sem ninguém entender por quê.
      roteiroDeSessao = !!d.daSessao;
      iTela = 0; pausado = false; irPara(0);
    } else if (d.tipo === 'comando') {
      if (d.acao === 'pausar') pausado = true;
      else if (d.acao === 'seguir') pausado = false;
      else if (d.acao === 'proxima') irPara(iTela + 1);
      else if (d.acao === 'anterior') irPara(iTela - 1);
      else if (d.acao === 'ir' && Number.isInteger(d.indice)) irPara(d.indice);
      // Da aba Configuração: relê a página inteira (classificação assinada,
      // cores novas). O recorte e o roteiro voltam do localStorage e da API.
      else if (d.acao === 'recarregar') location.reload();
      // Faixa de alertas: liga, desliga ou mostra de qualquer idade.
      else if (d.acao && d.acao.startsWith('alertas:')) {
        modoAlertas(d.acao.slice(8));
      }
    }
  };
} catch (e) { /* navegador sem BroadcastChannel: telão fica autônomo */ }

/* Eleição passada (seletor de anos do painel): o recorte leva `eleicao`
 * (`tse2022t2`) e toda leitura de dado vai com ela. A comparação ano a ano
 * tem os próprios anos e o roteiro é operação: nunca levam. */
async function get(u) {
  if (recorte && recorte.eleicao && !u.startsWith('/comparativo')
      && !u.startsWith('/telao')) {
    u += (u.includes('?') ? '&' : '?')
      + `eleicao_passada=${recorte.eleicao}`;
  }
  const r = await fetch(API + u);
  if (!r.ok) throw new Error(`${r.status} em ${u}`);
  return r.json();
}

/* Carrossel. O roteiro vem de config/telao.yaml pela API; a janela de
 * controle pode sobrepor um roteiro de momento.
 *
 * Tela com erro de resolução é PULADA, nunca exibida: projetar o município
 * errado é pior do que pular a tela. */
let roteiro = [];
let roteiroDeSessao = false;
let iTela = 0;
let pausado = false;
let restante = 0;
let tempoTela = 0;

const telasValidas = () => roteiro.filter(t => !t.erro);

async function carregarRoteiro() {
  if (roteiroDeSessao) return;   // controle manual segura a tela
  try {
    const r = await get('/telao/roteiro');
    roteiro = r.dados || [];
    const ruins = roteiro.filter(t => t.erro);
    if (ruins.length) console.warn('telas puladas:',
      ruins.map(t => t.titulo + ': ' + t.erro));
  } catch (e) { roteiro = []; }
}

function aplicarTela(t) {
  if (!t) return;
  recorte = {...recorte,
    tipo: t.tipo || 'mapa', casa: t.casa || null,
    abrangencia: t.abrangencia || null,
    cargo: t.cargo, uf: t.uf || null, municipio: t.municipio || null,
    camada: t.camada || 'lider',
    titulo: t.titulo, aviso_recorte: t.aviso_recorte};
  tempoTela = Math.max(5, t.segundos || 20);
  restante = tempoTela;
  carregar();
}

function irPara(i) {
  const v = telasValidas();
  if (!v.length) return;
  iTela = ((i % v.length) + v.length) % v.length;
  aplicarTela(v[iTela]);
}

function tique() {
  const v = telasValidas();
  const passo = document.getElementById('passo');
  const prog = document.getElementById('progresso');
  if (!v.length) {
    passo.textContent = 'recorte manual';
    prog.style.width = '0';
    return;
  }
  if (!pausado) restante -= 1;
  const frac = tempoTela > 0
    ? Math.max(0, Math.min(1, 1 - restante / tempoTela)) : 0;
  prog.style.width = (frac * 100).toFixed(1) + '%';
  poe(passo, `tela ${iTela + 1}/${v.length} · ${Math.max(0, restante)}s`,
    pausado ? el('span', {cls: 'pausado'}, ' ⏸ pausado') : null);
  if (!pausado && restante <= 0) irPara(iTela + 1);
}

/* Teclado do operador: espaço pausa, setas navegam, R recarrega. */
addEventListener('keydown', ev => {
  if (ev.key === ' ') { pausado = !pausado; ev.preventDefault(); }
  else if (ev.key === 'ArrowRight') irPara(iTela + 1);
  else if (ev.key === 'ArrowLeft') irPara(iTela - 1);
  else if (ev.key === 'r' || ev.key === 'R') carregar();
});

function kpi(k, v, n) {
  return el('div', {cls: 'kpi'}, el('div', {cls: 'k'}, k),
            el('div', {cls: 'v'}, v), el('div', {cls: 'n'}, n));
}

/* Selos da linha, do mais forte ao mais fraco. A conta vem antes da
 * probabilidade, e as duas aparecem quando dizem coisas diferentes:
 * garantir vaga no 2º turno não é o mesmo que estar projetado para vencer
 * (RR no simulado de 23/09, com 66% dos votos). */
/* Haverá 2º turno com certeza: nem recebendo todos os votos que ainda podem
 * entrar alguém passa de 50%. Calculado a cada carga da tela de mapa. */
let turnoCerto = false;
function selos(o, st, definido, projetado, subJudiceDecide) {
  const fora = [];
  const selo = (txt, cor) => [' ', el('span', {cls: 'selo',
    style: cor ? `border-color:${cor};color:${cor}` : null}, txt)];
  if (o.eleito_segundo_tse === true) return selo('eleito');
  const eleitoMat = definido && st.estado === 'matematicamente_eleito';
  if (definido) {
    // Com sub judice capaz de mudar o resultado, a conta vale no cenário de
    // validação — e o selo precisa dizer isso, senão a tela afirma
    // definição e, três linhas abaixo, que a definição está suspensa.
    const cenario = subJudiceDecide ? ' · se validados' : '';
    // "2º turno garantido" afirma que HAVERÁ 2º turno. A conta só prova
    // isso quando ninguém mais alcança maioria absoluta; antes, o que ela
    // prova é que o candidato não sai dos dois primeiros (PA em
    // 04/10/2026: líder com 52,6% e o selo dizia 2º turno garantido).
    fora.push(...selo((eleitoMat ? 'matematicamente eleito'
      : turnoCerto ? '2º turno garantido' : 'entre os 2 primeiros')
      + cenario));
  }
  // Liderar não é vencer: com projeção abaixo de 50% o que se projeta é o
  // 2º turno. O tipo vem da API; servidor antigo não o envia, e aí o selo
  // não sai — melhor nada do que "vencedor" para quem vai ao 2º turno.
  if (projetado && !eleitoMat) {
    if (projetado === 'vencedor') {
      fora.push(...selo('vencedor projetado', 'var(--proj)'));
    } else if (projetado === 'segundo_turno') {
      fora.push(...selo('2º turno projetado', 'var(--proj)'));
    }
  }
  return fora;
}

function linha(c, i, maxPct, estados, projecoes, chamada,
               recorteNaoDecide, subJudiceDecide) {
  const o = c.oficial, e = c.enriquecimento;
  const pj = projecoes && projecoes[o.sqcand];
  // Vencedor projetado (§4.7): probabilidade com régua dura, e o selo diz
  // "projetado" — nunca se confunde com "matematicamente definido".
  // `false`, ou o tipo da chamada: 'vencedor' | 'segundo_turno'. Senado
  // (mais de uma vaga) em servidor antigo, sem tipo, é sempre vencedor.
  const projetado = (chamada && chamada.apta
    && chamada.candidatos.some(x => x.sqcand === o.sqcand))
    ? (chamada.tipo || ((CARGOS[recorte.cargo] || {}).vagas > 1
                        ? 'vencedor' : 'indefinido'))
    : false;
  const st = estados[o.sqcand];
  const anulado = !!o.destinacao_voto && o.destinacao_voto !== 'Válido';
  // Só afirma definição onde a unidade decide: num recorte municipal a
  // aritmética local fecha, mas quem elege é o estado (ou o Brasil).
  const definido = !recorteNaoDecide && st
    && (st.estado === 'matematicamente_eleito'
        || st.estado === 'matematicamente_no_segundo_turno');
  const retrato = e && e.foto_url
    ? el('img', {cls: 'foto', src: e.foto_url, alt: ''})
    : el('div', {cls: 'num'}, o.numero);
  const larg = maxPct > 0 && o.pct != null ? 100 * o.pct / maxPct : 0;
  return el('div', {
      cls: 'linha' + (i === 0 ? ' topo' : '') + (definido ? ' definido' : ''),
    },
    retrato,
    el('div', {cls: 'info'},
      el('div', {cls: 'nome'}, (e && e.nome) || o.nome_urna),
      el('div', {cls: 'part'}, o.partido,
        // Conta primeiro, probabilidade depois — e as duas quando cada uma
        // diz algo diferente: garantir vaga no 2º turno não é o mesmo que
        // estar projetado para vencer (RR no simulado de 23/09, 66% dos
        // votos: a conta só garantia a vaga, a projeção já dava a vitória).
        ...selos(o, st, definido, projetado, subJudiceDecide),
        // Voto que não é válido (anulado, sub judice): sem esta marca o
        // candidato aparecia no topo como se liderasse. Visto no simulado
        // de 22/09, com o 9999 "Anulado sub judice" em primeiro.
        anulado ? [' ', el('span', {cls: 'selo', style:
          'border-color:var(--alerta);color:var(--alerta)'},
          o.destinacao_voto.toLowerCase())] : null),
      el('div', {cls: 'barra'},
        // Barra da projeção primeiro, por baixo: a do apurado cresce sobre
        // ela conforme o voto entra.
        pj ? el('i', {cls: 'p', style: `width:${Math.max(0, Math.min(100,
          maxPct > 0 ? 100 * pj.projecao.pct_mediana / maxPct : 0))}%`}) : null,
        el('i', {style: `width:${Math.max(0, Math.min(100, larg))}%`}))),
    el('div', {},
      el('div', {cls: 'pct'}, o.pct == null ? 'n/d' : pct(o.pct, 2)),
      el('div', {cls: 'abs'}, fmt(o.votos)),
      pj ? el('div', {cls: 'proj'},
        'proj. ' + pct(pj.projecao.pct_mediana, 1)
        // Faixa publicada: 80% no começo, 90% a partir de 15% apurado,
        // 95% acima de 50%. O nível vai junto, sempre.
        + (() => {
            const fx = pj.projecao.faixa;
            const lo = fx ? fx.pct_min : pj.projecao.pct_q100;
            const hi = fx ? fx.pct_max : pj.projecao.pct_q900;
            const n = fx ? fx.nivel : 80;
            return ` (${lo.toFixed(1).replace('.', ',')}–`
                 + `${hi.toFixed(1).replace('.', ',')}, ${n}%)`;
          })()
        + (anulado ? ' · se validados' : ''))
        : anulado ? el('div', {cls: 'proj', style: 'color:var(--alerta)'},
            'votos não válidos · fora da projeção')
        : null));
}

/* Contador de carga. `carregar()` e assincrono e pode ser disparado por
 * tres origens ao mesmo tempo: troca de tela, atualizacao de 30 s e comando
 * do controle. Sem este guarda, a resposta que chega por ultimo vence,
 * mesmo sendo de uma tela que ja saiu — e o telao mostra o eleitorado de um
 * lugar com o titulo de outro. Aconteceu de verdade em teste. */
let cargaAtual = 0;

/* Projeção em cache de 60 s por recorte.
 *
 * O apurado é relido a cada 10 s, porque é o número que a sala olha e o TSE
 * atualiza rápido. A projeção não precisa desse ritmo — o coletor já a
 * registra a cada 2 minutos — e cada pedido roda 1.200 simulações no
 * servidor. Pedi-la a cada 10 s tiraria processador da coleta justamente no
 * pico. */
const PROJ_TTL_MS = 60000;
/* A projeção é acessória e nunca segura a tela: se não respondeu neste
 * prazo, o apurado entra sem ela e a resposta, quando chegar, fica no cache
 * para a releitura seguinte (10 s). Em 04/10/2026, antes do primeiro voto,
 * a rota levava 8 s para dizer "sem projeção" — e o telão ficava esse tempo
 * com o título de uma tela e o corpo da anterior. */
const PROJ_ESPERA_MS = 1500;
const cacheProj = new Map();
function projecaoEmCache(qs) {
  let c = cacheProj.get(qs);
  if (!c || Date.now() - c.t >= PROJ_TTL_MS) {
    c = {t: Date.now(), p: get(`/projection?${qs}&sims=1200&registrar=false`)
      .catch(() => null)};
    cacheProj.set(qs, c);
  }
  return Promise.race([c.p, new Promise(
    ok => setTimeout(() => ok(null), PROJ_ESPERA_MS))]);
}

/* ------------------------------------------------ telas políticas (§6)
 *
 * Dois tipos de tela além do mapa de apuração:
 *
 *   politico     presidente ou governador: o mesmo mapa pintado duas
 *                vezes, por partido do líder e pela ideologia desse
 *                partido, com votos e territórios por bloco ao lado;
 *   composicao   Senado (27 até 2031 + 54 em disputa) ou Câmara (513, só o
 *                resultado do TSE), em hemiciclo.
 *
 * Os dois redesenham só quando o lote de dados muda: a cada 10 s o telão
 * relê a API, e refazer dois mapas de 5.570 municípios sem nada novo
 * gastaria o processador do notebook que também roda a coleta. */
let assinaturaPolitica = null;

function faixaAmbiente(env) {
  const faixa = document.getElementById('faixa');
  if (env && env.aviso) {
    faixa.textContent = env.aviso;
    faixa.className = 'faixa pisca';
  } else {
    faixa.className = 'faixa oficial';
  }
}

function tituloBloco(txt, nota) {
  return el('div', {cls: 'pbloco-t'}, txt,
    nota ? el('span', {cls: 'pnota'}, ' ' + nota) : null);
}

function avisoCuradoria(meta) {
  return el('div', {cls: 'aviso'},
    'Classificação ideológica aguardando curadoria assinada (§6). ',
    'Enquanto isso, só o mapa por partido — nada de ideologia sem autoria.');
}

function rodapePolitico(fonteTse, extra) {
  document.getElementById('fonte').replaceChildren(
    document.createTextNode('Fonte TSE: '),
    el('b', {}, fonteTse ? brt(fonteTse) : '—'),
    ...(extra ? [document.createTextNode('  ·  ' + extra)] : []));
}

function notaClassificacao(meta) {
  if (!meta || meta.estado !== 'disponivel') return null;
  return `classificação ${meta.versao} · curadoria ${meta.curador} · `
    + 'analítica, não é atributo do TSE';
}

async function carregarPolitico(minhaCarga, desatualizada) {
  const cargo = CARGOS[recorte.cargo] || CARGOS['1'];
  const abr = recorte.abrangencia
    || (recorte.cargo === '1' ? 'mu' : 'uf');
  const corpo = document.getElementById('corpo');
  document.getElementById('titulo').textContent = cargo.nome;
  document.getElementById('onde').textContent =
    recorte.cargo === '1'
      ? 'onde cada um lidera · ' + (abr === 'mu'
        ? 'por município' : 'por estado')
      : 'os 27 estados · partido e ideologia de quem lidera';
  document.getElementById('vagas').hidden = true;

  const [mapa, res] = await Promise.all([
    get(`/map-layers?cargo=${recorte.cargo}&abrangencia=${abr}`),
    get(`/politico/resumo?cargo=${recorte.cargo}`),
  ]);
  if (desatualizada()) return;
  faixaAmbiente(res.ambiente);
  const d = res.dados;
  const meta = d.classificacao;
  const comIdeo = meta.estado === 'disponivel';

  const assin = ['politico', recorte.cargo, abr, mapa.snapshot_set_id,
                 res.snapshot_set_id, meta.estado, meta.versao].join('|');
  if (assin === assinaturaPolitica && corpo.dataset.tipo === 'politico') {
    rodapePolitico(res.source_generated_at, notaClassificacao(meta));
    return;
  }

  const painelMapa = (camada, titulo) => {
    const caixa = el('div', {cls: 'pmapa'});
    const alvo = el('div', {cls: 'pmapa-svg'});
    const pe = el('div', {cls: 'pmapa-pe'});
    caixa.append(el('div', {cls: 'pbloco-t'}, titulo), alvo, pe);
    const p = MAPA.desenhar(alvo, mapa.dados, {
      malha: mapa.malha, camada, largura: 820, altura: 820,
    }).then(r => {
      poe(pe, MAPA.barraPonderada(mapa.dados, r.camada, r.ctx),
          el('div', {cls: 'pmapa-leg'},
            MAPA.legenda(r.camada, r.ctx, mapa.dados)));
    });
    return [caixa, p];
  };

  // Presidente: um mapa só (05/10/2026). Com dois candidatos de blocos
  // opostos, o mapa por partido e o ideológico saem iguais — duas vezes o
  // mesmo desenho, na metade do tamanho. A ideologia continua na coluna de
  // números ("Votos por bloco"). Governador mantém os dois: são muitos
  // partidos, e o mapa ideológico é o que os agrupa.
  const umMapa = recorte.cargo === '1';
  const [mp, pp] = painelMapa('partido', umMapa
    ? 'Quem lidera em cada ' + (abr === 'mu' ? 'município' : 'estado')
    : 'Partido de quem lidera');
  let mi, pi = Promise.resolve();
  if (umMapa) {
    mi = null;
  } else if (comIdeo) {
    [mi, pi] = painelMapa('ideologia', 'Ideologia do partido de quem lidera');
  } else {
    mi = el('div', {cls: 'pmapa'},
      el('div', {cls: 'pbloco-t'}, 'Ideologia'),
      el('div', {cls: 'vazio', style: 'flex:1'},
        'Mapa ideológico desligado: a classificação dos partidos aguarda '
        + 'curadoria assinada (§6).'));
  }

  // Coluna de números.
  const lado = el('div', {cls: 'plado'});
  const v = d.votos;
  if (recorte.cargo === '1') {
    if (comIdeo && v.por_bloco) {
      lado.append(tituloBloco('Votos por bloco', 'sobre os válidos'),
        POLITICO.barraBlocos(v.por_bloco, 100, {chave: 'pct',
          formato: x => pct(x, 1)}));
    }
    lado.append(tituloBloco('Votos por partido', v.universo),
      POLITICO.listaPartidos(v.por_partido.map(x => ({
        partido: x.partido, valor: x.pct || 0, rotulo: pct(x.pct, 2),
      })), {limite: 7, formatoResto: x => pct(x, 1)}));
    const t = d.territorios;
    lado.append(tituloBloco('Estados liderados', 'recorte — estado não elege '
      + 'presidente'),
      POLITICO.listaPartidos(t.por_partido.map(x => ({
        partido: x.partido, valor: x.territorios,
        rotulo: String(x.territorios),
        nota: pct(100 * x.eleitorado / Math.max(1, t.ufs.reduce(
          (a, u) => a + u.eleitorado, 0)), 0) + ' eleit.',
      })), {limite: 4}));
  } else {
    const t = d.territorios;
    const eleitTot = Math.max(1, t.ufs.reduce((a, u) => a + u.eleitorado, 0));
    const e = t.estados;
    lado.append(el('div', {cls: 'kpis'},
      kpi('Eleitos', String(e.eleito + e.definido),
          e.definido ? `${e.definido} matematicamente` : 'segundo o TSE'),
      e.segundo_turno
        ? kpi('2º turno', String(e.segundo_turno), 'definido nas contas')
        : kpi('Liderando', String(e.liderando), 'apuração parcial'),
      kpi(e.segundo_turno ? 'Em aberto' : 'Aguardando',
          String(e.segundo_turno ? e.liderando + e.aguardando
                 : e.aguardando),
          e.segundo_turno ? 'liderança parcial' : 'sem voto contado')));
    lado.append(tituloBloco(d.cargo_cd === '3' ? 'Governos por partido'
                            : 'Vagas por partido',
                            'cheio = eleito · claro = 2º turno ou liderando'),
      POLITICO.listaPartidos(t.por_partido.map(x => ({
        partido: x.partido, valor: x.territorios,
        partes: [
          {valor: x.por_estado.eleito + x.por_estado.definido},
          {valor: x.por_estado.segundo_turno + x.por_estado.liderando,
           estilo: 'opacity:.4'}],
        rotulo: String(x.territorios),
        nota: pct(100 * x.eleitorado / eleitTot, 0) + ' eleit.',
      })), {limite: 8}));
    if (comIdeo && t.por_bloco) {
      // Dois recortes do mesmo fato, e a diferença entre eles é a
      // informação: 12 estados pequenos podem valer menos eleitor que 5
      // grandes. Contar só estados mente por área; contar só eleitor
      // esconde quantos governos são.
      const gov = d.cargo_cd === '3';
      lado.append(tituloBloco(
          gov ? 'Estados governados por bloco' : 'Estados liderados por bloco',
          `quantos dos ${t.ufs.length || 27} estados`),
        POLITICO.barraBlocos(t.por_bloco, t.ufs.length || 27,
          {chave: 'territorios'}));
      lado.append(tituloBloco(
          gov ? 'Eleitores sob cada bloco' : 'Eleitores nos estados liderados',
          '% do eleitorado do país'),
        POLITICO.barraBlocos(t.por_bloco, eleitTot, {chave: 'eleitorado',
          formato: x => pct(100 * x / eleitTot, 0)}));
    }
  }
  if (!comIdeo) lado.append(avisoCuradoria(meta));

  if (desatualizada()) return;
  corpo.dataset.tipo = 'politico';
  corpo.className = 'corpo politico' + (umMapa ? ' um' : '');
  poe(corpo, mp, mi, lado);
  assinaturaPolitica = assin;
  const pintura = Promise.all([pp, pi]).catch(() => null);
  if (ESTATICO) await pintura;
  rodapePolitico(res.source_generated_at, notaClassificacao(meta));
}

/* Deputados federais de uma UF, nome a nome (pedido de 04/10/2026). A mesma
 * leitura da aba Deputado federal do painel: os eleitos que o TSE já marcou;
 * enquanto não marca, as vagas que ele distribui às listas com os votos
 * contados, ocupadas pelos mais votados de cada lista — provisório, sem
 * projeção. */
async function carregarDeputadosUF(uf, desatualizada) {
  const corpo = document.getElementById('corpo');
  const NOME = (POLITICO.NOME_UF && POLITICO.NOME_UF[uf]) || uf.toUpperCase();
  document.getElementById('titulo').textContent = 'Deputados federais';
  document.getElementById('vagas').hidden = true;

  const r = await get(`/composicao?casa=camara&uf=${uf}`);
  if (desatualizada()) return;
  faixaAmbiente(r.ambiente);
  const sel = r.dados.uf_detalhe;

  let nomes = [], oficial = false;
  if (sel) {
    oficial = sel.eleitos.length > 0;
    nomes = oficial ? sel.eleitos.map(e => ({...e, estado: 'eleito'}))
      : sel.listas.flatMap(x => x.candidatos)
          .filter(c => c.dentro_das_vagas && !c.abaixo_10pct_qe
                       && c.votos > 0)
          .sort((a, b) => b.votos - a.votos)
          .map(c => ({...c, estado: 'provisorio'}));
  }
  const assin = ['deputados-uf', uf, sel && sel.andamento, oficial,
                 JSON.stringify(nomes.map(c => [c.numero, c.votos]))]
    .join('|');
  if (assin === assinaturaPolitica && corpo.dataset.tipo === 'deputados') {
    return;
  }

  document.getElementById('onde').textContent = !sel ? NOME
    : `${NOME} · ${sel.vagas} vagas · ${pct(sel.apurado_pct) || '0%'} `
      + 'apurado · só o resultado do TSE, sem projeção';

  const filhos = [];
  if (!sel) {
    filhos.push(el('div', {cls: 'vazio'},
      `Arquivo de deputado federal de ${NOME} ainda não coletado.`));
  } else if (!nomes.length) {
    filhos.push(el('div', {cls: 'vazio'},
      `${NOME}: nenhum voto de deputado federal contado ainda.`));
  } else {
    const n = nomes.length;
    const cols = n <= 10 ? 2 : n <= 33 ? 3 : 4;
    const linhas = Math.ceil(n / cols);
    // A grade ocupa a altura que sobra; a letra acompanha a altura da linha.
    const letra = Math.min(2.6, 66 / linhas * .5).toFixed(2);
    const grade = el('div', {style: 'display:grid;grid-auto-flow:column;'
      + `grid-template-rows:repeat(${linhas},minmax(0,1fr));`
      + `grid-template-columns:repeat(${cols},minmax(0,1fr));`
      + `gap:.35vh 1.6vw;height:100%;font-size:${letra}vh`});
    nomes.forEach((c, i) => grade.append(el('div', {
      style: 'display:flex;align-items:center;gap:.5vw;min-width:0;'
        + 'border-bottom:1px solid var(--line);'
        + (c.estado === 'eleito' ? '' : 'opacity:.72')},
      el('span', {style: 'color:var(--muted);min-width:1.6em;'
        + 'text-align:right;font-variant-numeric:tabular-nums'},
        String(i + 1)),
      el('span', {style: 'flex:none;width:.75em;height:.75em;'
        + `border-radius:50%;background:${c.partido.cor}`}),
      el('span', {style: 'flex:1;min-width:0;white-space:nowrap;'
        + 'overflow:hidden;text-overflow:ellipsis;font-weight:600'},
        c.nome),
      el('span', {style: 'color:var(--muted);white-space:nowrap;'
        + 'font-size:.8em;max-width:5.5em;overflow:hidden;'
        + 'text-overflow:ellipsis'}, c.partido.sigla),
      el('span', {style: 'white-space:nowrap;'
        + 'font-variant-numeric:tabular-nums'}, fmt(c.votos)))));
    const caixa = el('div', {style: 'display:flex;flex-direction:column;'
      + 'gap:1vh;height:100%;min-height:0'});
    caixa.append(el('div', {style: 'flex:1;min-height:0;'
      + 'background:var(--panel);border:1px solid var(--line);'
      + 'border-radius:1vw;padding:1.2vh 1.2vw'}, grade));
    caixa.append(el('div', {cls: oficial ? 'pe' : 'aviso'}, oficial
      ? `${n} de ${sel.vagas} eleitos segundo o TSE`
        + (sel.andamento === 'f' ? ' · totalização encerrada'
                                 : ' · apuração em andamento')
      : `Provisório: ${n} de ${sel.vagas} vagas que o TSE já distribuiu `
        + 'às listas com os votos contados; os nomes são os mais votados '
        + 'de cada lista. Tudo pode mudar até o TSE marcar os eleitos.'));
    filhos.push(caixa);
  }

  if (desatualizada()) return;
  corpo.dataset.tipo = 'deputados';
  corpo.className = 'corpo recordes';
  poe(corpo, ...filhos);
  assinaturaPolitica = assin;
  rodapePolitico(sel && sel.gerado_em,
    'deputados: situação oficial "Eleito por QP/média"; provisório = '
    + 'vagas do TSE às listas × mais votados');
}

/* Assembleias legislativas (05/10/2026). Com UF: o plenário daquele estado
 * em hemiciclo, como o Senado e a Câmara. Sem UF: as 27 casas numa tela,
 * com os blocos de cada uma. Só o resultado do TSE, sem projeção. */
async function carregarAssembleia(uf, desatualizada) {
  const corpo = document.getElementById('corpo');
  document.getElementById('vagas').hidden = true;
  const r = await get('/composicao?casa=assembleia' + (uf ? `&uf=${uf}` : ''));
  if (desatualizada()) return;
  faixaAmbiente(r.ambiente);
  const d = r.dados;
  const meta = d.classificacao;
  const comIdeo = meta.estado === 'disponivel';
  const nota = 'deputado estadual: situação oficial de eleito no TSE · '
    + 'sem projeção';

  if (!uf) {
    document.getElementById('titulo').textContent =
      'Assembleias legislativas';
    document.getElementById('onde').textContent =
      'os 27 estados · cadeiras por bloco e a maior bancada de cada casa';
    const assin = 'assembleias|' + meta.estado + '|' + meta.versao + '|'
      + JSON.stringify((d.ufs || []).map(u => [u.uf, u.eleitos,
                                               u.provisorios]));
    if (assin === assinaturaPolitica && corpo.dataset.tipo === 'resumo') {
      return;
    }
    if (!(d.ufs || []).length) {
      return telaResumo(corpo, assin, el('div', {cls: 'vazio'},
        r.status_motivo || 'Nenhum arquivo de deputado estadual ainda.'),
        r.source_generated_at);
    }
    return telaResumo(corpo, assin, TELAS.assembleias(d, comIdeo),
      r.source_generated_at,
      [nota, 'traço branco = maioria da casa', notaClassificacao(meta)]
        .filter(Boolean).join('  ·  '));
  }

  const NOME = POLITICO.NOME_UF[uf] || uf.toUpperCase();
  document.getElementById('titulo').textContent =
    uf === 'df' ? 'Câmara Legislativa do DF' : 'Assembleia Legislativa';
  document.getElementById('onde').textContent = d.vagas
    ? `${NOME} · ${d.vagas} cadeiras · maioria ${d.maioria}`
    : NOME;
  const assin = ['assembleia', uf, meta.estado, meta.versao, d.eleitos,
                 d.provisorios, JSON.stringify((d.partidos || []).map(
                   p => [p.partido.sigla, p.total]))].join('|');
  if (assin === assinaturaPolitica && corpo.dataset.tipo === 'composicao') {
    return;
  }
  if (!d.vagas) {
    return telaResumo(corpo, assin, el('div', {cls: 'vazio'},
      `Arquivo de deputado estadual de ${NOME} ainda não coletado.`),
      r.source_generated_at);
  }
  const tresQuintos = Math.ceil(d.vagas * 3 / 5);
  const esquerda = el('div', {cls: 'phem'});
  const alvo = el('div', {cls: 'phem-svg'});
  esquerda.append(alvo);
  alvo.append(POLITICO.hemiciclo(d.cadeiras, {
    largura: 1000, altura: 560, comIdeologia: comIdeo, maioria: d.maioria,
    centro: String(d.vagas),
    subcentro: `maioria ${d.maioria} · 3/5 ${tresQuintos}`,
    rotulo: 'assembleia',
  }));
  esquerda.append(POLITICO.legendaEstados(
    [['eleito', d.eleitos], ['liderando', d.provisorios],
     ['aguardando', Math.max(0, d.vagas - d.eleitos - d.provisorios)]],
    {liderando: 'provisório — vaga do TSE, pode mudar'}));
  if (comIdeo) {
    esquerda.append(tituloBloco('Cadeiras por bloco',
      'blocos não votam unidos por terem a mesma cor'),
      POLITICO.barraBlocos(d.por_bloco, d.vagas, {chave: 'total', marcas: [
        {valor: d.maioria, rotulo: `maioria absoluta ${d.maioria}`},
        {valor: tresQuintos, rotulo: `3/5 ${tresQuintos}`}]}));
  } else {
    esquerda.append(avisoCuradoria(meta));
  }
  const lado = el('div', {cls: 'plado'});
  lado.append(el('div', {cls: 'kpis'},
    kpi('Eleitos', fmt(d.eleitos), `de ${d.vagas} cadeiras`),
    kpi('Partidos', String(d.partidos.length), 'com cadeira'),
    kpi('Maior bancada', d.partidos.length ? String(d.partidos[0].total)
        : '—', d.partidos.length ? d.partidos[0].partido.sigla : '')));
  lado.append(tituloBloco('Bancadas', 'cheio = eleito · claro = provisório'),
    POLITICO.listaPartidos(d.partidos.map(x => ({
      partido: x.partido, valor: x.total,
      partes: [{valor: x.eleito}, {valor: x.provisorio,
                                   estilo: 'opacity:.3'}],
      rotulo: String(x.total),
    })), {limite: 13}));
  if (desatualizada()) return;
  corpo.dataset.tipo = 'composicao';
  corpo.className = 'corpo composicao';
  poe(corpo, esquerda, lado);
  assinaturaPolitica = assin;
  rodapePolitico(r.source_generated_at,
    [nota, notaClassificacao(meta)].filter(Boolean).join('  ·  '));
}

async function carregarComposicao(minhaCarga, desatualizada) {
  if (recorte.casa === 'assembleia') {
    return carregarAssembleia(
      recorte.uf ? String(recorte.uf).toLowerCase() : null, desatualizada);
  }
  const casa = recorte.casa === 'camara' ? 'camara' : 'senado';
  // Câmara com UF: a lista de deputados daquele estado, não o hemiciclo.
  if (casa === 'camara' && recorte.uf) {
    return carregarDeputadosUF(String(recorte.uf).toLowerCase(),
                               desatualizada);
  }
  const corpo = document.getElementById('corpo');
  document.getElementById('titulo').textContent =
    casa === 'senado' ? 'Senado Federal' : 'Câmara dos Deputados';
  document.getElementById('vagas').hidden = true;

  const r = await get(`/composicao?casa=${casa}`);
  if (desatualizada()) return;
  faixaAmbiente(r.ambiente);
  const d = r.dados;
  const meta = d.classificacao;
  const comIdeo = meta.estado === 'disponivel';

  const assin = ['composicao', casa, r.snapshot_set_id,
                 r.source_generated_at, meta.estado, meta.versao,
                 casa === 'camara' ? JSON.stringify(d.em_formacao.partidos)
                                   : ''].join('|');
  if (assin === assinaturaPolitica && corpo.dataset.tipo === 'composicao') {
    return;
  }

  let cadeiras, estados, maioria, tresQuintos, total, notaFonte;
  const lado = el('div', {cls: 'plado'});

  if (casa === 'senado') {
    total = 81; maioria = 41; tresQuintos = 49;
    cadeiras = d.cadeiras;
    const e = d.em_disputa.estados;
    // "até 2031" hoje; "eleitas em 2018" numa eleição passada.
    const rotRem = d.remanescentes.rotulo || 'até 2031';
    estados = [['mandato_em_curso', d.remanescentes.n],
               ['eleito', e.eleito], ['definido', e.definido],
               ['liderando', e.liderando], ['aguardando', e.aguardando],
               ['sem_eleito', e.sem_eleito || 0]];
    document.getElementById('onde').textContent =
      `81 cadeiras · ${d.em_disputa.n} em disputa + `
      + `${d.remanescentes.n} ${rotRem}`;
    lado.append(el('div', {cls: 'kpis'},
      kpi('Eleitos', String(e.eleito + e.definido),
          `de ${d.em_disputa.n} em disputa`),
      kpi('Liderando', String(e.liderando), 'apuração parcial'),
      kpi('Aguardando', String(e.aguardando), 'sem voto contado')));
    lado.append(tituloBloco('Bancadas', `anel = ${rotRem} · cheio = eleito `
      + '· claro = liderando'),
      POLITICO.listaPartidos(d.por_partido.map(x => ({
        partido: x.partido, valor: x.total,
        partes: [{valor: x.remanescentes, estilo: 'opacity:.55'},
                 {valor: x.eleito + x.definido},
                 {valor: x.liderando, estilo: 'opacity:.3'}],
        rotulo: String(x.total),
        nota: x.remanescentes ? `${x.remanescentes} ${rotRem}` : null,
      })), {limite: 11}));
    if (d.remanescentes.estado !== 'ok') {
      lado.append(el('div', {cls: 'aviso'}, d.remanescentes.motivo));
    }
    const ref = d.remanescentes.referencia_em;
    notaFonte = d.remanescentes.eleitos_em
      ? `TSE: cadeiras ${rotRem}, pelo partido da eleição`
      : 'Senado Federal: cadeiras até 2031 com o partido de '
        + (ref ? new Date(ref).toLocaleDateString('pt-BR',
            {timeZone: 'America/Sao_Paulo'}) : '—');
  } else {
    total = 513; maioria = 257; tresQuintos = 308;
    // A Câmara se formando: eleitos oficiais onde o TSE já marcou; no resto,
    // as vagas que o TSE já distribuiu às listas, com os mais votados de
    // cada lista — provisório, sem projeção.
    const f = d.em_formacao;
    cadeiras = [];
    for (const p of f.partidos) {
      for (let i = 0; i < p.eleito; i++) {
        cadeiras.push({partido: p.partido, ideologia: p.ideologia,
                       estado: 'eleito'});
      }
      for (let i = 0; i < p.provisorio; i++) {
        cadeiras.push({partido: p.partido, ideologia: p.ideologia,
                       estado: 'liderando'});
      }
    }
    cadeiras = cadeiras.slice(0, total);
    for (let i = cadeiras.length; i < total; i++) {
      cadeiras.push({partido: null, ideologia: null, estado: 'aguardando'});
    }
    estados = [['eleito', f.eleito], ['liderando', f.provisorio],
               ['aguardando', f.sem_dado]];
    document.getElementById('onde').textContent = f.provisorio
      ? '513 cadeiras · a Câmara se formando: vagas do TSE com os votos '
        + 'contados até agora · sem projeção'
      : '513 cadeiras · só o resultado do TSE, sem projeção';
    lado.append(el('div', {cls: 'kpis'},
      kpi('Eleitos', fmt(f.eleito), 'segundo o TSE'),
      kpi('Provisórios', fmt(f.provisorio),
          `${f.ufs_provisorias.length} UFs em apuração`),
      kpi('UFs encerradas', `${d.ufs_encerradas}/27`,
          `${d.ufs_com_dado} com dado`)));
    lado.append(tituloBloco('Bancadas', 'cheio = eleito · claro = provisório'),
      POLITICO.listaPartidos(f.partidos.map(x => ({
        partido: x.partido, valor: x.total,
        partes: [{valor: x.eleito}, {valor: x.provisorio, estilo: 'opacity:.3'}],
        rotulo: String(x.total),
      })), {limite: 13}));
    if (f.provisorio) {
      lado.append(el('div', {cls: 'aviso'}, f.nota));
    }
    if (f.vagas_declaradas && f.vagas_declaradas !== total) {
      lado.append(el('div', {cls: 'aviso'},
        `Os arquivos das UFs somam ${f.vagas_declaradas} vagas, não 513 `
        + '(dado de teste do TSE).'));
    }
    notaFonte = 'deputados: situação oficial "Eleito por QP/média"; '
      + 'provisório = vagas do TSE às listas × mais votados';
  }

  // Blocos, com as marcas de maioria. Só com classificação assinada.
  const blocos = casa === 'senado' ? d.por_bloco : (() => {
    if (!comIdeo) return null;
    const b = {esquerda: {total: 0}, centro: {total: 0}, direita: {total: 0},
               sem_classificacao: {total: 0}};
    for (const p of d.em_formacao.partidos) {
      b[p.ideologia ? p.ideologia.bloco : 'sem_classificacao'].total
        += p.total;
    }
    return b;
  })();

  const esquerda = el('div', {cls: 'phem'});
  const alvo = el('div', {cls: 'phem-svg'});
  esquerda.append(alvo);
  alvo.append(POLITICO.hemiciclo(cadeiras, {
    largura: 1000, altura: 560, comIdeologia: comIdeo, maioria,
    centro: String(total),
    subcentro: `maioria ${maioria} · 3/5 ${tresQuintos}`,
    rotulo: casa,
  }));
  esquerda.append(POLITICO.legendaEstados(estados, casa === 'camara'
    ? {liderando: 'provisório — vaga do TSE, pode mudar'}
    : {mandato_em_curso: (d.remanescentes && d.remanescentes.eleitos_em)
         ? d.remanescentes.rotulo : 'mandato até 2031'}));
  if (comIdeo && blocos) {
    esquerda.append(tituloBloco('Cadeiras por bloco',
      'blocos não votam unidos por terem a mesma cor'),
      POLITICO.barraBlocos(blocos, total, {chave: 'total', marcas: [
        {valor: maioria, rotulo: `maioria absoluta ${maioria}`},
        {valor: tresQuintos, rotulo: `3/5 ${tresQuintos}`}]}));
  } else if (!comIdeo) {
    esquerda.append(avisoCuradoria(meta));
  }

  if (desatualizada()) return;
  corpo.dataset.tipo = 'composicao';
  corpo.className = 'corpo composicao';
  poe(corpo, esquerda, lado);
  assinaturaPolitica = assin;
  rodapePolitico(r.source_generated_at,
    [notaFonte, notaClassificacao(meta)].filter(Boolean).join('  ·  '));
}

async function carregarParticipacao(minhaCarga, desatualizada) {

    'Ausentes, brancos e nulos';
  document.getElementById('vagas').hidden = true;
  // `turno=2`: o ao vivo. Com o servidor no 2º turno, o turno 1 de 2026 é

  const r = await get(`/comparativo?cargo=${cargo}&anos=2026&turno=2`
    + (uf ? `&uf=${uf}` : ''));
  if (desatualizada()) return;
  faixaAmbiente(r.ambiente);
  const c = (r.dados.colunas || []).find(x => x.ano === 2026);
  document.getElementById('onde').textContent = CARGOS[cargo].nome + ' · '
    + (uf ? (POLITICO.NOME_UF[uf] || uf.toUpperCase()) : 'Brasil');
  const assin = 'participacao|' + cargo + '|' + uf + '|' + JSON.stringify(
    c && [c.comparecimento, c.brancos, c.nulos, c.validos]);

      'Nenhum voto contado ainda.'), r.source_generated_at);

    cargo === '5' ? 'no Senado cada eleitor dá dois votos: brancos e nulos '
      + 'são contados por voto' : null);
}

async function carregarEstado(minhaCarga, desatualizada) {
  const corpo = document.getElementById('corpo');
  const uf = String(recorte.uf || '').toLowerCase();
  document.getElementById('titulo').textContent =
    POLITICO.NOME_UF[uf] || uf.toUpperCase();
  document.getElementById('vagas').hidden = true;
  const q = c => `cargo=${c}&uf=${uf}`;
  const nulo = () => null;
  const [rp, cp, rg, cg, dg, rs, cs, ds, cam, par, asb] = await Promise.all([
    get(`/results?abrangencia=uf&${q(1)}`), get(`/candidates?${q(1)}`),
    get(`/results?abrangencia=uf&${q(3)}`), get(`/candidates?${q(3)}`),
    get(`/decided?${q(3)}`).catch(nulo),
    get(`/results?abrangencia=uf&${q(5)}`), get(`/candidates?${q(5)}`),
    get(`/decided?${q(5)}`).catch(nulo),
    get(`/composicao?casa=camara&uf=${uf}`).catch(nulo),
    get('/partidos').catch(nulo),
    get(`/composicao?casa=assembleia&uf=${uf}`).catch(nulo)]);
  if (desatualizada()) return;
  faixaAmbiente(rg.ambiente);
  document.getElementById('onde').textContent =
    'resumo do estado · presidente, governador, senadores e deputados';
  const parte = (res, cands, def) => {
    const u = res.dados[0] || {};
    const e = u.eleitorado || {};
    const lista = ((cands.dados || [])[0] || {}).candidatos || [];
    const dfn = def && def.dados && def.dados[0];
    const estados = {};
    if (dfn) for (const c of dfn.candidatos) estados[c.sqcand] = c.estado;
    const cObs = u.votos && u.votos.validos_computados;
    const resto = dfn ? dfn.resto_maximo_total : null;
    return {apurado: e.total ? 100 * e.apurado / e.total : null,
            cands: lista, estados, votos: u.votos,
            turnoCerto: !!(dfn && resto != null && cObs > 0
              && !lista.some(c => 2 * c.oficial.votos + resto > cObs))};
  };
  const cores = {};
  for (const x of ((par && par.dados.partidos) || [])) cores[x.sigla] = x.cor;
  const d = {uf, cores, presidente: parte(rp, cp, null),
             governador: parte(rg, cg, dg), senador: parte(rs, cs, ds),
             camara: cam && cam.dados.uf_detalhe,
             assembleia: asb && asb.dados,
             comIdeo: !!(asb && asb.dados.classificacao
                         && asb.dados.classificacao.estado === 'disponivel')};
  const assin = 'estado|' + uf + '|' + JSON.stringify([
    d.presidente.cands.map(c => c.oficial.votos),
    d.governador.cands.map(c => [c.oficial.votos, c.oficial.situacao]),
    d.governador.estados, d.senador.cands.map(c => c.oficial.votos),
    d.senador.estados, d.camara && [d.camara.apurado_pct,
                                    d.camara.eleitos.length],
    d.assembleia && [d.assembleia.eleitos, d.assembleia.provisorios,
                     d.comIdeo]]);
  if (assin === assinaturaPolitica && corpo.dataset.tipo === 'resumo') return;
  telaResumo(corpo, assin, TELAS.estado(d), rg.source_generated_at,
    '% dos votos válidos · "eleito" e "2º turno" são a situação do TSE');
}

/* ------------------------------------------------ faixa de alertas
 * As últimas novidades (rota /alertas), uma por vez. Só entra o que é
 * recente: na parede, "matematicamente eleito" de três horas atrás não é
 * novidade. `?alertas=tudo` mostra as últimas de qualquer idade (ensaio e
 * conferência depois da noite); `?alertas=0` desliga a faixa. */
const ALERTAS = {lista: [], i: -1, janelaMin: 40, modo: (() => {
  // O endereço manda; sem ele, a última escolha feita pelo painel.
  const u = new URLSearchParams(location.search).get('alertas');
  if (u) return u;
  try { return localStorage.getItem('telao-alertas'); } catch (e) {}
  return null;
})()};
function modoAlertas(m) {
  ALERTAS.modo = m === 'recentes' ? null : m;
  try {
    if (ALERTAS.modo) localStorage.setItem('telao-alertas', ALERTAS.modo);
    else localStorage.removeItem('telao-alertas');
  } catch (e) { /* vale só enquanto a janela viver */ }
  ALERTAS.lista = []; ALERTAS.i = -1;
  buscarAlertas().then(girarAlertas);
}
async function buscarAlertas() {
  if (ALERTAS.modo === '0' || (recorte && recorte.eleicao)) {
    ALERTAS.lista = [];
    return;
  }
  try {
    const r = await fetch(API + '/alertas?limite=12&peso_min=2');
    if (!r.ok) return;
    const agora = Date.now();
    ALERTAS.lista = ((await r.json()).dados || []).filter(a =>
      ALERTAS.modo === 'tudo'
      || agora - new Date(a.momento).getTime() < ALERTAS.janelaMin * 60000);
  } catch (e) { /* a faixa é acessória: sem ela o telão segue igual */ }
}
function girarAlertas() {
  const caixa = document.getElementById('alertas');
  const n = ALERTAS.lista.length;
  if (!n) { caixa.hidden = true; return; }
  ALERTAS.i = (ALERTAS.i + 1) % n;
  const a = ALERTAS.lista[ALERTAS.i];
  caixa.hidden = false;
  caixa.className = 'alertas ' + a.natureza;
  document.getElementById('alertas-hora').textContent =
    brt(a.momento).slice(0, 5);
  const tit = document.getElementById('alertas-tit');
  const txt = document.getElementById('alertas-txt');
  tit.textContent = a.titulo;
  txt.textContent = a.texto;
  for (const x of [tit, txt]) {
    x.classList.remove('troca'); void x.offsetWidth; x.classList.add('troca');
  }
  document.getElementById('alertas-n').textContent =
    n > 1 ? `${ALERTAS.i + 1}/${n}` : '';
}

/* Comparativo: o mesmo território em várias eleições, para a sala ver a

/* Peças das telas ano a ano no telão (Câmara, governadores, senadores e o
 * resumo). Mesma escala para todas: `U` é 1% da largura. */
const U_ = x => `calc(var(--u) * ${x})`;
const COR_BLOCO = {esquerda: '#e2574c', centro: '#e3b341', direita: '#5b8def',
                   sem_classificacao: '#6b7687'};
const ROT_BLOCO = {esquerda: 'Esquerda', centro: 'Centro', direita: 'Direita',
                   sem_classificacao: 'Sem classificação'};
const BLOCOS_T = ['esquerda', 'centro', 'direita', 'sem_classificacao'];

/* Uma barra por eleição, cada uma na escala do próprio total (no simulado
 * a Câmara declara 532 vagas; o Senado alterna 54 e 27). `linhas`:
 * [{ano, por_bloco: {bloco: n}, sub}] — `sub` é o texto miúdo embaixo do
 * ano (parcial, número de cadeiras). */
function barrasBloco(linhas, escala = 1) {
  const U = x => U_(x * escala);
  // Número e percentual do total daquela barra ("13 · 24,5%", pedido de
  // 24/09); segmento estreito fica só com o número. `l.secundaria` é a
  // segunda linha de um ano (no Senado: a casa inteira), mais baixa e com
  // o rótulo no lugar do ano.
  const barra = (l) => {
    const tot = BLOCOS_T.reduce((s, b) => s + (l.por_bloco[b] || 0), 0);
    const alto = l.secundaria ? 2.5 : 3.2;
    return el('div', {style: `display:flex;align-items:center;gap:${U(.7)};`
        + `margin-bottom:${U(l.primaria ? .3 : .8)}`},
      el('div', {style: `width:${U(6)};flex:none`},
        l.secundaria
          ? el('div', {style: `font-size:${U(.95)};font-weight:700;`
              + 'color:#aab4c3'}, l.rotulo || '')
          : el('div', {style: `font-size:${U(1.9)};font-weight:800`}, l.ano),
        l.sub ? el('div', {style: `font-size:${U(.8)};`
            + `color:${l.alerta ? '#e0b45a' : '#8a95a6'}`}, l.sub) : null),
      el('div', {style: `flex:1;display:flex;height:${U(alto)};`
          + `border-radius:${U(.35)};overflow:hidden;background:#1b2330;`
          + (l.secundaria ? 'opacity:.92' : '')},
        ...BLOCOS_T.filter(b => l.por_bloco[b]).map(b => {
          const fr = tot ? l.por_bloco[b] / tot : 0;
          return el('div', {style:
              `width:${100 * fr}%;`
              + `background:${COR_BLOCO[b]};display:flex;align-items:center;`
              + `justify-content:center;font-size:${U(l.secundaria ? 1.1
                                                                  : 1.3)};`
              + 'font-weight:700;color:#0b0f14;white-space:nowrap;'
              + 'overflow:hidden'},
            String(l.por_bloco[b]),
            fr >= .16 ? el('span', {style: 'font-weight:500;opacity:.8'},
              ` · ${pct(100 * fr, 1)}`) : null);
        })));
  };
  const legenda = el('div', {style: `display:flex;gap:${U(1.2)};`
      + `font-size:${U(1)};color:#aab4c3;margin:0 0 ${U(.6)} ${U(6.7)}`},
    ...['esquerda', 'centro', 'direita'].map(b => el('span', {},
      el('span', {style: `display:inline-block;width:${U(.9)};`
        + `height:${U(.9)};border-radius:${U(.15)};background:${COR_BLOCO[b]};`
        + `margin-right:${U(.3)}`}), ROT_BLOCO[b])));
  return el('div', {}, ...linhas.map(barra), legenda);
}

/* As maiores séries da linhagem, um ano por coluna, o resto somado numa
 * linha (a coluna fecha a conta) e a variação do par que a API escolheu.
 * Quando a série junta legendas (União = PSL + DEM em 2018), a linha diz
 * de onde veio o número — senão pareceria que o União elegeu 81 em 2018. */
function tabelaSeriesTelao(d, anos, limite = 12, escala = 1,
                           comOrigem = true) {
  if (d.series_composicao) {
    return tabelaSenadoTelao(d, anos, limite, escala, comOrigem);
  }
  const U = x => U_(x * escala);
  const topo = d.series.slice(0, limite);
  const resto = d.series.slice(limite);
  const origem = (se) => {
    const a = anos.find(x => (se.anos[x] || {}).composta);
    if (!a) return null;
    return `${a}: ` + se.anos[a].componentes
      .map(c => `${c.sigla} ${c.cadeiras}`).join(' + ');
  };
  const td = `padding:${U(.3)} ${U(.6)};text-align:right`;
  const celula = (se, a) => {
    const x = se.anos[a];
    if (!x || !x.cadeiras) return el('td', {style: td + ';color:#566174'},
                                     '—');
    return el('td', {style: td}, String(x.eleito),
      x.provisorio
        ? el('span', {style: `font-size:${U(.9)};color:#e0b45a`},
             ` +${x.provisorio}`) : null);
  };
  const chave = d.variacao_par;
  const [pa, pb] = chave ? chave.split('-') : [];
  const variacao = (se) => {
    const v = se.variacao[chave];
    if (v == null) return el('td', {style: td}, '');
    const cor = v > 0 ? '#5fbf7a' : v < 0 ? '#e2574c' : '#8a95a6';
    return el('td', {style: `${td};color:${cor}`},
      v > 0 ? `+${v}` : v < 0 ? `−${-v}` : '=');
  };
  return el('table', {style: `width:100%;border-collapse:collapse;`
      + `font-size:${U(1.15)};color:#e6ebf2;font-variant-numeric:tabular-nums`},
    el('thead', {}, el('tr', {style: `color:#8a95a6;font-size:${U(.9)}`},
      el('th', {style: 'text-align:left'}, 'Partido (linhagem)'),
      ...anos.map(a => el('th', {style: td}, a)),
      chave ? el('th', {style: td}, `${pa}→${pb}`) : null)),
    el('tbody', {},
      ...topo.map(se => {
        const o = comOrigem ? origem(se) : null;
        return el('tr', {style: 'border-top:1px solid #1e2632'},
          el('td', {style: `padding:${U(.3)} 0`},
            el('span', {style: `display:inline-block;width:${U(.8)};`
              + `height:${U(.8)};border-radius:50%;background:${se.cor};`
              + `margin-right:${U(.4)}`}),
            el('b', {}, se.sigla),
            o ? el('span', {style: `font-size:${U(.82)};color:#8a95a6;`
                  + `margin-left:${U(.5)}`}, o) : null),
          ...anos.map(a => celula(se, a)),
          chave ? variacao(se) : null);
      }),
      resto.length ? el('tr', {style: 'border-top:1px solid #1e2632;'
          + 'color:#8a95a6'},
        el('td', {style: `padding:${U(.3)} 0`},
           `outras ${resto.length} legendas`),
        ...anos.map(a => el('td', {style: td}, String(resto.reduce(
          (s, se) => s + ((se.anos[a] || {}).cadeiras || 0), 0)))),
        chave ? el('td', {}, '') : null) : null));
}

/* Senado: por ano, eleitos naquele ano ("el.") e a casa inteira (em

function tabelaSenadoTelao(d, anos, limite, escala, comOrigem) {
