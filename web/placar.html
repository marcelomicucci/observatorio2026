<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Placar (teste) — Observatório Eleitoral 2026</title>
<style>
/* Casca da tela de placar fora do telão (/placar). O desenho está em
 * placar.js, o mesmo que o telão usa no tipo de tela `placar`; aqui ficam
 * só a moldura, a faixa de ambiente e o rodapé com o horário da fonte.
 *
 *   /placar                          presidente, mapa por estado
 *   /placar?mapa=municipios          presidente, mapa por município
 *   /placar?cargo=3&uf=sp            governador, mapa por município
 *   /placar?cargo=3&uf=sp&mapa=estados
 *   &eleicao=tse2022t2               uma eleição passada
 */
:root{
  --bg:#0b0e13; --fg:#f2f5f9; --muted:#8e99a8; --line:#222834;
  --panel:#141922; --acento:#5aa2f0; --ok:#42c98a; --alerta:#f5b544;
  --proj:#b98ae8; --a:#5aa2f0; --b:#e2574c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
 font:400 16px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 overflow:hidden}
.tela{height:100vh;display:flex;flex-direction:column;padding:1.4vh 1.6vw;
 gap:1.1vh}
.faixa{background:#f5b544;color:#2a1a00;font-weight:800;text-align:center;
 padding:.6vh 0;font-size:1.3vw;letter-spacing:.06em;border-radius:.5vw;
 text-transform:uppercase}
.faixa.oficial{display:none}

.pe{display:flex;justify-content:space-between;align-items:center;gap:1vw;
 font-size:.95vw;color:var(--muted);flex-wrap:wrap}
.pe b{color:var(--fg);font-weight:600}
.pisca{animation:p 2.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.55}}
#alvo{flex:1;min-height:0}
</style>
</head>
<body>
<div class="tela">
  <div class="faixa oficial" id="faixa"></div>
  <div id="alvo"></div>
  <div class="pe">
    <span id="fonte"></span>
    <span id="atualizacao"></span>
  </div>
</div>

<script src="/mapa.js"></script>
<script src="/placar.js"></script>
<script>
const API = '/api/v1';
const brt = s => s ? new Date(s).toLocaleTimeString('pt-BR',
  {timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit',
   second: '2-digit'}) : '—';
const p = new URLSearchParams(location.search);
const ELEICAO = p.get('eleicao') || null;
const CARGO = p.get('cargo') || '1';

async function get(u) {
  if (ELEICAO) u += (u.includes('?') ? '&' : '?')
    + `eleicao_passada=${ELEICAO}`;
  const r = await fetch(API + u);
  if (!r.ok) throw new Error(`${r.status} em ${u}`);
  return r.json();
}

async function carregar() {
  const res = await PLACAR.desenhar(document.getElementById('alvo'), {
    cargo: CARGO, uf: p.get('uf'), get,
    municipios: p.get('mapa') ? p.get('mapa') === 'municipios' : null,
    aoAmbiente: amb => {
      const faixa = document.getElementById('faixa');
      faixa.textContent = (amb && amb.aviso) || '';
      faixa.className = amb && amb.aviso ? 'faixa pisca' : 'faixa oficial';
    },
  });
  if (!res) return;
  document.getElementById('fonte').replaceChildren(
    document.createTextNode('Fonte TSE: '),
    Object.assign(document.createElement('b'),
                  {textContent: brt(res.source_generated_at)}),
    document.createTextNode('  ·  capturado ' + brt(res.captured_at)
      + (res.denominador ? '  ·  ' + res.denominador.rotulo : '')));
  document.getElementById('atualizacao').textContent =
    'atualizado às ' + new Date().toLocaleTimeString('pt-BR',
      {timeZone: 'America/Sao_Paulo'});
}

carregar();
// Eleição passada não muda: uma leitura basta.
if (!ELEICAO) setInterval(carregar, 10000);
</script>
</body>
</html>
