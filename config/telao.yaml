# Roteiro do telão — a sequência de telas que o projetor exibe sozinho.
#
# Cada item é uma tela. O telão passa de uma para a outra no tempo indicado e
# volta ao começo. O operador pode pausar, avançar e voltar pelo teclado, ou
# pular direto para uma tela pela janela de controle.
#
# CAMPOS
#   cargo       presidente | governador | senador        (obrigatório)
#   uf          sigla, obrigatória para governador e senador
#   municipio   código TSE (5 dígitos) ou IBGE (7), OU nome + uf
#   camada      lider | apurar                           (opcional)
#                 lider   quem lidera: cor do 1o, tom pela margem sobre o
#                         2o, contorno amarelo se matematicamente definido
#                         e verde se eleito segundo o TSE
#                 apurar  onde falta apurar: quanto do eleitorado ainda
#                         nao entrou na conta (escuro = falta mais)
#               Os nomes antigos (definicao, margem, cobertura) continuam
#               aceitos e sao traduzidos: definicao e margem viram lider,
#               cobertura vira apurar.
#   segundos    tempo da tela; usa `padrao_segundos` se omitido
#   titulo      rótulo livre; se omitido, é montado a partir do recorte
#
# SOBRE RECORTE MUNICIPAL
# "Presidente em Belém" é recorte do VOTO, não a unidade que elege. Presidente
# se decide no total do Brasil; governador e senador, no total da UF. O telão
# marca essas telas com aviso próprio, e isso não é configurável de propósito
# (§3).
#
# SOBRE NOME DE MUNICÍPIO
# Nome não é chave: PAU D'ARCO existe em PA e em TO. Por isso nome exige `uf`,
# e ambiguidade dentro da mesma UF é recusada com a lista de candidatos em vez
# de resolvida por adivinhação (§2.1). Código dispensa a UF.

padrao_segundos: 20
camada_padrao: lider

roteiro:
  - cargo: presidente
    titulo: Presidente — Brasil
    segundos: 30

  - cargo: presidente
    camada: apurar
    titulo: Presidente — onde ainda falta apurar
    segundos: 15

  - cargo: governador
    uf: pa
    segundos: 20

  - cargo: senador
    uf: sp
    segundos: 25

  - cargo: presidente
    uf: pa
    municipio: Belém
    titulo: Presidente — recorte de Belém
    segundos: 15
