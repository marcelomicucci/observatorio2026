# Linhagem partidária — sucessões, fusões e trocas de nome.
#
# ASSINADA por Marcelo Micucci em 24/09/2026 (versão 2026.2).
#
# Redigida pelo assistente sobre a 2026.1 (assinada por Marcelo Micucci em
# 23/09/2026, guardada em linhagem_partidos.2026.1.yaml). Aprovada por ele
# no chat em 24/09/2026, com o pedido expresso de que o assistente
# executasse a assinatura em seu nome — o comando foi rodado pelo
# assistente, a decisão é dele. Ajustar uma ligação é versão nova, escrita
# em linhagem_partidos.proposta.yaml e assinada com:
#
#     obs2026 assinar-linhagem --curador "Nome Sobrenome"
#
# O QUE MUDA EM RELAÇÃO À 2026.1 — tudo conferido contra o próprio TSE (o
# banco histórico de 2022 e o cadastro de candidaturas de 2026):
#
#   1. Podemos: em 2018 e 2022 concorreu com o 19; em 2026 concorre com o 20
#      (o número do PSC, que ele incorporou). A 2026.1 mandava o PSC para
#      "PODE 19" e deixava o Podemos de 2026 numa série separada. Agora o 19
#      segue para o 20, e o PSC vai direto para o 20.
#   2. PTC → Agir (36): troca de nome; em 2022 o 36 já é AGIR no TSE.
#   3. PMN → Mobiliza (33): troca de nome; em 2026 o 33 é Mobiliza.
#   4. PMB → Democrata (35): troca de nome; em 2026 o 35 é Democrata.
#   5. PRTB: sai a entrada "fim". O partido existe — concorreu com o 28 em
#      2022 e concorre em 2026. Estava marcado "verificar antes de assinar".
#
# `desde` é a primeira eleição GERAL em que o nome/número novo aparece nos
# dados (a data exata do ato no TSE não muda a comparação entre 2018, 2022
# e 2026).
#
# Sem assinatura (curador nulo), a tela comparativa mostra cada eleição com o
# nome que o partido tinha na época e NÃO liga as séries.
#
# POR QUE ISSO PRECISA DE ASSINATURA
#
# Dizer que "o União Brasil de 2022 é a continuação do PSL de 2018" é uma
# afirmação editorial, não um fato do banco de dados. Fusão não é herança
# automática: o eleitorado, os quadros e o programa podem mudar. Como a
# decisão de 23/09/2026 foi comparar seguindo a linhagem, cada ligação fica
# escrita aqui, com fonte, e a tela mostra a troca ("União Brasil (ex-PSL)")
# em vez de fingir que sempre foi a mesma legenda.
#
# COMO A TELA USA
#
#   sucessor   para onde a sigla foi. A série continua no sucessor.
#   tipo       fusao | incorporacao | renomeacao | federacao
#   desde      ano da eleição a partir do qual vale o sucessor
#   nota       o que a tela escreve ao lado do nome
#
# Uma legenda que apenas deixou de existir (sem sucessor) fica com
# `sucessor: null`: a série termina ali, e isso aparece como fim de linha,
# não como queda a zero.
#
# FEDERAÇÃO NÃO É FUSÃO. PT/PCdoB/PV e PSDB/Cidadania disputaram 2022 em
# federação, mas continuam partidos distintos, com bancadas próprias. Aqui
# elas NÃO viram sucessão; a tela soma por federação quando o usuário pedir.

versao: "2026.2"
curador: "Marcelo Micucci"
publicada_em: 2026-09-24
versao_anterior: "2026.1"

