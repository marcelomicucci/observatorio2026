# Orçamento de requisições e cadência (spec §8.1).
#
# TSE: máximo 100 req/s por IP; excesso => bloqueio de 10 min, reiniciado a cada
# nova tentativa durante a penalidade. 404 repetido também bloqueia.
# Teto interno deliberadamente conservador.

rate:
  # Teto interno. O TSE permite 100 req/s por IP; 20 e o teto conservador de
  # primeiro contato proposto na especificacao (§8.1), mantido para os
  # simulados de 22-24/09. Ele NAO e suficiente para a noite de apuracao: com
  # a cadencia abaixo sobram ~3,6 req/s para o EA20 movido por mudanca, e a
  # estimativa de mudancas na noite de eleicao fica acima disso. O valor final
  # sai da medicao do simulado (ver `obs2026 orcamento` e o relatorio do
  # ensaio), nao de chute. Qualquer alteracao passa pela trava
  # `CollectorConfig.assert_budget`, que recusa cadencia que estoure o teto.
  max_rps: 20.0          # teto global compartilhado por TODOS os processos do IP
  burst: 20
  jitter_ms: [0, 120]
  # Requisicoes simultaneas. Sem concorrencia o teto acima e decorativo: com
  # jitter medio de 60 ms mais latencia de rede, uma busca sequencial alcanca
  # cerca de 3 req/s, nao 20 — medido no simulado. Quem limita a taxa e o
  # token bucket; os trabalhadores so mantem o balde vazio.
  max_workers: 24
  connect_timeout_s: 5.0
  read_timeout_s: 20.0

retry:
  max_attempts: 4
  backoff_base_s: 0.5
  backoff_max_s: 30.0
  retry_on_status: [500, 502, 503, 504]

circuit:
  # 404 isolado: suspende a fonte e manda revalidar catálogo.
  not_found_suspend_s: 600
  # Série de erros na mesma fonte: interrompe para não provocar bloqueio.
  error_streak_trip: 5
  error_streak_cooldown_s: 300
  # 429 / bloqueio: respeita a penalidade inteira sem insistir.
  blocked_cooldown_s: 660

cadence:
  # EA14 (Brasil) e EA15 (por UF) são o mecanismo de detecção de mudança.
  # Custo por ciclo: n_eleicoes x (1 EA14 + 28 EA15).
  accompaniment_interval_s: 20
  # Varredura de reconciliação: busca EA20 de TODAS as unidades, independente
  # de mudança detectada, para corrigir EA14/EA15 defasados ou perdidos.
  # É ROTATIVA: o coletor empurra uma fatia proporcional a cada 5 s, em vez de
  # despejar os 16.897 alvos de uma vez. Mesmo ciclo completo, carga plana.
  # A 900 s (proposta original do §8.1) o custo seria 18,8 req/s — sozinho
  # estoura o teto de 20.
  #
  # 3600 s, e não 1800: a cota que a varredura liberou foi para o controle,
  # abaixo. A varredura é rede de segurança — as mudanças chegam pelo
  # EA14/EA15 —, e o total do estado é o número que a sala está olhando.
  # Trocar meia hora por uma hora na rede de segurança compra o total do
  # estado duas vezes mais fresco. Custo: 4,7 req/s.
  reconcile_interval_s: 3600
  # Controle nacional/UF do EA20 (não depende de detecção). São os números
  # grandes — Brasil e cada UF, por cargo — e têm prioridade absoluta na fila
  # (nível próprio, acima de qualquer município). A cada 10 s: 8,3 req/s.
  #
  # Piso total: 2,9 + 8,3 + 4,7 = 15,9 req/s, com 4,1 req/s de folga para os
  # municípios que mudaram — mais folga que antes (3,6), não menos.
  control_interval_s: 10
  # Não buscar de novo o que o TSE já marcou como FINALIZADO (andamento `f`),
  # seja município, UF ou Brasil. Numa apuração, a maior parte do país
  # termina bem antes do fim da noite, e continuar buscando esses arquivos é
  # cota gasta sem informação nova — cota que falta a quem ainda está
  # contando.
  #
  # Finalizado não é imutável: decisão judicial e voto sub judice podem
  # re-totalizar. Por isso a unidade finalizada sai das buscas mas continua
  # VIGIADA pelo EA14/EA15, que corre sempre e custa o mesmo. A assinatura de
  # lá inclui a hora da totalização; se o TSE re-totalizar, ela muda e a
  # unidade volta a ser buscada na hora.
  #
  # `false` volta ao comportamento antigo: busca tudo, sempre.
  pular_finalizados: true
  # Teto de itens EA20 despachados por ciclo, para a fila não engolir o budget.
  max_inflight_results: 400

# Registro continuo de projecoes durante a apuracao. Cada rodada projeta
# todas as disputas (1 presidencial + 27 governadores + 27 senadores) e grava
# no diario de auditoria — e sao esses registros que dao pontos ao grafico de
# convergencia. Sem eles o grafico tem um ponto so e nao prova nada.
#
# MEDIDO com os dados completos do simulado:
#   1a rodada   12,3 s  (carga fria do arquivo bruto)
#   seguintes    1,2 s  (carregador incremental: so o que mudou e relido)
#
# A 120 s de intervalo, isso e menos de 1% de um nucleo, e cada disputa ganha
# um ponto a cada 2 minutos — cerca de 180 pontos numa noite de seis horas,
# que e densidade de sobra para o grafico de convergencia.
#
# A simulacao roda em thread separada: numpy no laco de eventos travaria as
# requisicoes ao TSE justamente no pico.
# Carga continua do bruto para o banco, dentro do `coletar`. E o que faz o
# painel e o telao mudarem sozinhos: sem isto, o banco so mudava quando
# alguem rodava `carregar` a mao. Incremental (so o que chegou), com Brasil e
# UF gravados antes dos municipios em cada passada.
carga:
  ativa: true
  intervalo_s: 5

projecao:
  ativa: true
  intervalo_s: 120
  # Menos simulacoes que as 5.000 do cenario homologado: aqui o que importa
  # e ter muitos pontos ao longo da noite, nao precisao de quarta casa.
  n_sims: 1500

priority:
  # Peso na fila: eleitorado da unidade x fator. Territórios grandes e atrasados
  # primeiro, mas com envelhecimento para nenhum ficar sem atendimento.
  aging_boost_per_minute: 0.15
  # Desempate entre itens do nível de totais. A precedência sobre os
  # municípios NÃO vem deste número — vem do nível na fila. Com peso só,
  # São Paulo (9,3 milhões de eleitores) passava à frente do total nacional.
  control_weight: 1000000
