# Linhagem partidária — sucessões, fusões e trocas de nome.
#
# ASSINADA por Marcelo Micucci em 23/09/2026 (versão 2026.1). A proposta foi
# redigida pelo assistente e aprovada por ele na mesma data; ajustar uma
# ligação é nova versão, com nova assinatura:
#
#     obs2026 assinar-linhagem --curador "Nome Sobrenome"
#
# Sem assinatura (curador nulo), a tela comparativa mostra cada eleição com o
# nome que o partido tinha na época e NÃO liga as séries.
#
# POR QUE ISSO PRECISA DE ASSINATURA
#
# Dizer que "o União Brasil de 2022 é a continuação do PSL de 2018" é uma
# afirmação editorial, não um fato do banco de dados. Fusão não é herança
# automática: o eleitorado, os quadros e o programa podem mudar. Como a
# decisão de 23/09/2026 foi comparar seguindo a linhagem, cada ligação fica
# escrita aqui, com fonte, e a tela mostra a troca ("União Brasil (ex-PSL)")
# em vez de fingir que sempre foi a mesma legenda.
#
# COMO A TELA USA
#
#   sucessor   para onde a sigla foi. A série continua no sucessor.
#   tipo       fusao | incorporacao | renomeacao | federacao
#   desde      ano da eleição a partir do qual vale o sucessor
#   nota       o que a tela escreve ao lado do nome
#
# Uma legenda que apenas deixou de existir (sem sucessor) fica com
# `sucessor: null`: a série termina ali, e isso aparece como fim de linha,
# não como queda a zero.
#
# FEDERAÇÃO NÃO É FUSÃO. PT/PCdoB/PV e PSDB/Cidadania disputaram 2022 em
# federação, mas continuam partidos distintos, com bancadas próprias. Aqui
# elas NÃO viram sucessão; a tela soma por federação quando o usuário pedir.

versao: "2026.1"
curador: "Marcelo Micucci"
publicada_em: 2026-09-23

sucessoes:
