# Classificação política de 2018 — §6.
#
# ASSINADA por Marcelo Micucci em 23/09/2026 (versão 2018.1). Proposta redigida pelo assistente e aprovada por ele em 23/09/2026.
#
# POR QUE UM ARQUIVO POR ANO
#
# Partido não é entidade estável: o 25 era DEM em 2018 e é PRD em 2026; o 17
# era PSL e hoje não existe; o 22 era PR (centro-direita) e virou PL, que se
# desloca à direita. Herdar a classificação de um ano para outro colaria a
# posição de um partido em outro. Cada eleição usa o arquivo do seu ano, e a
# comparação ano a ano liga as séries pela linhagem assinada
# (config/linhagem_partidos.yaml), não pela ideologia.
#
# MÉTODO
#
# Âncora: Bolognesi, B.; Ribeiro, E.; Codato, A. "Uma nova classificação
# ideológica dos partidos políticos brasileiros". Dados, 66(2), 2023 —
# survey com especialistas feito em 2018. Para 2018 ele é fonte direta dos
# partidos da época, não extrapolação. A escala de sete pontos foi reduzida
# às cinco categorias do produto: extrema-esquerda entra em `esquerda`,
# extrema-direita em `direita`.
#
# Partidos que seguem existindo em 2026 herdam a mesma categoria do arquivo
# de 2026, para a série ano a ano não mudar de régua no meio. Os extintos
# têm entrada própria, com o que o survey diz e o destino da legenda.
#
# grau_controversia: 0 consensual · 1 pouca discordância · 2 disputada ·
#                    3 fortemente disputada ou pouca informação

