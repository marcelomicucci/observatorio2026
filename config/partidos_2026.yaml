# Cadastro de partidos de 2026 — identidade, não ideologia.
#
# Aqui mora o que é FATO: número, sigla, nome e a cor usada no mapa por
# partido. A classificação ideológica, que é ato editorial, fica em
# `classificacao_2026.yaml`, com autoria. Uma coisa não depende da outra: o
# mapa por partido funciona mesmo com a curadoria ideológica pendente.
#
# CHAVE = NÚMERO + SIGLA
# O número é o que o TSE manda no EA20 (`par.n`), mas números são reusados
# entre eleições: em 2022 o 14 era o PTB; em 2026 é o Missão. Por isso a
# resolução exige que a sigla recebida bata com uma das `siglas` do número.
# Número certo com sigla estranha vira "partido desconhecido" (hachura), não
# o partido do cadastro — pintar o PTB de 2022 com a cor do Missão seria
# exatamente o erro silencioso que o §2.1 proíbe.
#
# `siglas` lista as grafias conhecidas: a do TSE, a do G1 e a do Senado
# (que escreve PODEMOS e REPUBLICANOS por extenso). A comparação ignora
# acento e caixa.
#
# Lista conferida contra os 29 partidos com candidatura majoritária em 2026
# (cache do enriquecimento, 20/09/2026) + PCdoB, que só disputa vagas
# proporcionais. Partido fora desta lista aparece com cor gerada e rótulo
# "fora do cadastro".
#
# CORES
# Escolhidas para se distinguirem entre si sobre fundo escuro, puxando para
# a cor com que cada partido costuma ser identificado quando isso não
# compromete a distinção. Não carregam ideologia: o vermelho do PT não é o
# vermelho da "esquerda" — a paleta ideológica é outra e mora no §6.
# Exceção deliberada: nenhum partido usa amarelo perto do centro (#F2C94C) —
# o PSOL (amarelo de marca) ficou magenta e o PSD, laranja: no hemiciclo, ao lado da
# faixa de bloco, lia-se como "centro". Editável na aba Configuração.

versao: "2026.1"
referencia_em: 2026-09-21

partidos:
