# Classificação política — §6.
#
# ASSINADA por Marcelo Micucci em 21/09/2026 (versão 2026.1).
#
# Classificar um partido como esquerda, centro ou direita é ato editorial, não
# cálculo. O §6 exige, para CADA entrada: fonte, justificativa, autor, data,
# validade temporal e grau de controvérsia.
#
# As entradas abaixo foram redigidas como proposta em 21/09/2026. Enquanto
# `curador` for nulo, o mapa ideológico continua desligado na interface, com
# o motivo, e o mapa por partido segue funcionando. Para ativar, quem
# responde pela classificação revisa cada linha e assina:
#
#     obs2026 assinar-classificacao --curador "Nome Sobrenome"
#
# A assinatura preenche `curador`, `publicada_em` e o `autor`/`decidido_em`
# das entradas ainda sem autor, sobe a versão e guarda a anterior em
# config/classificacao.anterior/. Mudar uma categoria depois disso é nova
# versão — mapas já exportados não são reescritos em silêncio (§6).
#
# MÉTODO DA PROPOSTA
# Âncora acadêmica: survey com especialistas publicado em
#   Bolognesi, B.; Ribeiro, E.; Codato, A. "Uma nova classificação
#   ideológica dos partidos políticos brasileiros". Dados — Revista de
#   Ciências Sociais, v. 66, n. 2, 2023.
# O survey é de 2018. Para partidos criados ou fundidos depois, a proposta
# parte dos predecessores e registra isso na justificativa. A escala de
# sete pontos do artigo (com extremos) foi reduzida às cinco categorias do
# produto: extrema-esquerda entra em `esquerda`, extrema-direita em
# `direita`. CONFERIR cada categoria contra a tabela do artigo antes de
# assinar — a proposta indica o enquadramento, não substitui a leitura.
#
# Três dimensões SEPARADAS. Uma não determina a outra:
#   ideologia         esquerda | centro_esquerda | centro | centro_direita | direita
#   posicao_governo   governo | oposicao | independente   (deixada nula: não
#                     é necessária para os mapas e muda durante o mandato)
#   alianca_estadual  registrada por UF, não herdada do cabeça de chapa
#
# Não existe categoria "indefinido": ausência de classificação é ausência de
# linha, e tem padrão visual próprio (hachura) — nunca o amarelo do centro.
#
# grau_controversia: 0 consensual · 1 pouca discordância · 2 disputada ·
#                    3 fortemente disputada ou pouca informação

