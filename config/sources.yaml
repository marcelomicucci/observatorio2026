# Ambientes de divulgação do TSE.
#
# REGRA DURA (spec §2.2): os códigos de eleição NÃO são fixados a partir de
# exemplos. Os valores abaixo existem apenas como *seed* para montar a URL do
# ele-c.json (EA11). Tudo o que estiver em `elections` é descoberto e
# sobrescrito pelo catálogo oficial em tempo de execução; divergência entre o
# seed e o catálogo é registrada como quality_flag, nunca silenciada.
#
# Fonte dos parâmetros de simulado, consultada em 2026-09-20:
# https://www.tse.jus.br/eleicoes/informacoes-tecnicas-sobre-a-divulgacao-de-resultados

environments:
  simulado2026:
    label: "Simulado TSE 2026 (2ª janela: 22, 23 e 24/09, 9h-12h e 14h-17h)"
    base: "https://resultados-sim.tse.jus.br/simulado"
    ambiente: "simulado2026"
    official: false
    # `ciclo` e `cd_pleito` vêm do EA11; o seed serve só para o primeiro fetch.
    seed:
      ciclo: "ele2026"
      cd_pleito: "17801"
      elections: ["21270", "21272", "21274"]

  oficial2026:
    label: "Eleições 2026 — 1º turno (TSE, resultado oficial)"
    # Códigos lidos do catálogo de produção em 04/10/2026 11h40
    # (https://resultados.tse.jus.br/oficial/comum/config/ele-c.json, gerado
    # pelo TSE em 02/10/2026 18:30:57, f="o"): pleito 3220, ciclo ele2026,
    # 6257 = federal (Presidente), 6259 = estadual (Governador, Senador,
    # Deputado Federal), 6261 = municipal (Conselheiro Distrital, fora do
    # produto). EA12, EA14 e EA20 conferidos nesses caminhos no mesmo dia.
    # 2º turno (25/10): 6258 e 6260, ainda fora do catálogo.
    base: "https://resultados.tse.jus.br"
    ambiente: "oficial"
    official: true
    seed:
      ciclo: "ele2026"
      cd_pleito: "3220"
      elections: ["6257", "6259", "6261"]

  demo2022:
    label: "Demonstração — resultado real de 2022 (Senado: 2018)"
    # Banco montado por `python scripts/demo2022.py` a partir dos arquivos
    # históricos do TSE. Existe para ver os relatórios do telão com partidos
    # reais antes da noite. O coletor RECUSA este ambiente: nada aqui é
    # buscado no TSE.
    demonstracao: true
    aviso: "DEMONSTRAÇÃO — resultado de 2022 (Senado: 2018), não é 2026"
    base: "https://resultados.tse.jus.br/oficial"
    ambiente: "oficial"
    official: false
    seed:
      ciclo: "ele2022"
      cd_pleito: "406"
      elections: ["544", "546"]

  tse2018t1:
    label: "2018 — 1º turno"
    # Eleição passada no formato do ao vivo, montada por
    # `obs2026 montar-ano --ano 2018 --turno 1` a partir dos arquivos do
    # TSE. É o que o seletor de anos do painel lê. O coletor RECUSA.
    demonstracao: true
    congelado: true
    aviso: "ELEIÇÃO DE 2018 — 1º TURNO · dados do TSE"
    base: "https://resultados.tse.jus.br/oficial"
    ambiente: "oficial"
    official: false
    seed:
      ciclo: "ele2018"
      cd_pleito: ""
      elections: []

  tse2018t2:
    label: "2018 — resultado final (2º turno onde houve)"
    # Eleição passada no formato do ao vivo, montada por
    # `obs2026 montar-ano --ano 2018 --turno 2` a partir dos arquivos do
    # TSE. É o que o seletor de anos do painel lê. O coletor RECUSA.
    demonstracao: true
    congelado: true
    aviso: "ELEIÇÃO DE 2018 — RESULTADO FINAL (2º TURNO ONDE HOUVE) · dados do TSE"
    base: "https://resultados.tse.jus.br/oficial"
    ambiente: "oficial"
    official: false
    seed:
      ciclo: "ele2018"
      cd_pleito: ""
      elections: []

  tse2022t1:
    label: "2022 — 1º turno"
    # Eleição passada no formato do ao vivo, montada por
    # `obs2026 montar-ano --ano 2022 --turno 1` a partir dos arquivos do
    # TSE. É o que o seletor de anos do painel lê. O coletor RECUSA.
    demonstracao: true
    congelado: true
    aviso: "ELEIÇÃO DE 2022 — 1º TURNO · dados do TSE"
    base: "https://resultados.tse.jus.br/oficial"
    ambiente: "oficial"
    official: false
    seed:
      ciclo: "ele2022"
      cd_pleito: ""
      elections: []

  tse2022t2:
    label: "2022 — resultado final (2º turno onde houve)"
    # Eleição passada no formato do ao vivo, montada por
    # `obs2026 montar-ano --ano 2022 --turno 2` a partir dos arquivos do
    # TSE. É o que o seletor de anos do painel lê. O coletor RECUSA.
    demonstracao: true
    congelado: true
    aviso: "ELEIÇÃO DE 2022 — RESULTADO FINAL (2º TURNO ONDE HOUVE) · dados do TSE"
    base: "https://resultados.tse.jus.br/oficial"
    ambiente: "oficial"
    official: false
    seed:
      ciclo: "ele2022"
      cd_pleito: ""
      elections: []

# Domínios permitidos (spec §10). Qualquer host fora desta lista é recusado,
# inclusive após redirecionamento.
allowed_hosts:
  - "resultados-sim.tse.jus.br"
  - "resultados.tse.jus.br"

# Cargos proporcionais — SÓ o resultado, sem projeção (pedido de 21/09/2026).
# O coletor busca apenas os 27 arquivos de UF do cargo, no intervalo abaixo;
# nenhum arquivo municipal. Não viram disputa no banco nem no motor: vão para
# o arquivo bruto e a composição da Câmara é lida de lá (politics/camara.py).
# Custo: 27 arquivos / 120 s = 0,23 req/s.
proporcionais:
  deputado_federal:
    cd: "6"
    intervalo_s: 120

# Cargos de interesse do produto. `cd` vem do EA11 (carg/cp), não é inventado.
# nv (vagas) é lido do payload EA20 e confrontado com `expected_seats`.
cargos:
  presidente:
    cd: "1"
    abrangencia_decisoria: "br"
    expected_seats: 1
    # Presidente é a única disputa que inclui o exterior (ZZ).
    includes_exterior: true
  governador:
    cd: "3"
    abrangencia_decisoria: "uf"
    expected_seats: 1
    includes_exterior: false
  senador:
    cd: "5"
    abrangencia_decisoria: "uf"
    expected_seats: 2      # 2026: duas vagas por UF — confrontar com carg.nv
    includes_exterior: false
