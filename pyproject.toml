[project]
name = "obs2026"
version = "0.1.0"
description = "Observatório Eleitoral 2026 — apuração, projeção e análise territorial"
requires-python = ">=3.11"`nlicense = { file = "LICENSE" }`nauthors = [{ name = "Marcelo Micucci Xavier" }]
dependencies = [
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
pg = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
obs2026 = "obs2026.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

